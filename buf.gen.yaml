version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/galaxy-io/filament/api
plugins:
  - local: protoc-gen-go
    out: api
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: api
    opt: paths=source_relative
  - remote: buf.build/community/sudorandom-connect-openapi:v0.27.2
    out: api
    opt:
      - features=connectrpc
      - content-types=json
      - format=json
      - path=openapi.json
      - trim-unused-types
