# SDK metadata only. Request/response schemas come from api/openapi.json.
info:
  title: Filament
  description: Filament API over Connect JSON.
components:
  schemas:
    connect-protocol-version:
      type: string
      const: "1"
      examples: ["1"]
    auth.v1.GetTokenRequest:
      required: [clientId, clientSecret]
    auth.v1.GetTokenResponse:
      required: [accessToken, expiresIn]
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Access token from the configured identity provider.
security:
  - BearerAuth: []
paths:
  /auth.v1.AuthService/AcceptInvite:
    post:
      parameters: &connect_headers
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: "1"
        - name: Connect-Timeout-Ms
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      x-fern-sdk-group-name: "auth"
      x-fern-sdk-method-name: accept_invite
      security: []
  /auth.v1.AuthService/CreateServiceAccount:
    post:
      parameters: *connect_headers
      x-fern-sdk-group-name: "service_account"
      x-fern-sdk-method-name: create
  /auth.v1.AuthService/GetAuthConfig:
    post:
      parameters: *connect_headers
      x-fern-sdk-group-name: "auth"
      x-fern-sdk-method-name: get_config
      security: []
  /auth.v1.AuthService/GetSession:
    post:
      parameters: *connect_headers
      x-fern-sdk-group-name: "auth"
      x-fern-sdk-method-name: get_session
  /auth.v1.AuthService/InviteMember:
