      x-fern-sdk-method-name: login
      security: []
  /auth.v1.AuthService/GetToken:
    post:
      parameters: *connect_headers
      x-fern-sdk-group-name: "auth"
      x-fern-sdk-method-name: get_token
      security: []
  /auth.v1.AuthService/Logout:
