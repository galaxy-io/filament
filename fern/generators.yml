# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
api:
  headers:
    Connect-Protocol-Version: literal<"1">
  specs:
    - openapi: ../api/openapi.json
      overrides: ./openapi-overrides.yml
default-group: python
groups:
  python:
    generators:
      - name: fern-python-sdk
        version: 5.33.0
        output:
          location: local-file-system
          path: ../sdks/python/src/filament
        config:
          package_name: filament
          client:
            class_name: Filament
          inline_request_params: true
          optional_auth: true
          # Mutations are not generally idempotent; callers can opt in per call.
          default_max_retries: 0
