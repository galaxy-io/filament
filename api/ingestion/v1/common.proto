syntax = "proto3";

package ingestion.v1;

import "google/protobuf/struct.proto";

// WorkerResources sizes the worker that executes a run, shaped like a Kubernetes
// ResourceRequirements: resource name ("cpu", "memory") to quantity string
// ("500m", "2Gi"). A missing key is unset and inherits, and only the Kubernetes
// dispatcher consults them.
message WorkerResources {
  map<string, string> requests = 1;
  map<string, string> limits = 2;
}

// WorkerToleration mirrors a Kubernetes toleration. Fields are the Kubernetes
// strings verbatim: operator "Equal" (default) or "Exists"; effect
// "NoSchedule", "PreferNoSchedule", "NoExecute", or empty to match all.
message WorkerToleration {
  string key = 1;
  string operator = 2;
  string value = 3;
  string effect = 4;
}

// WorkerConfiguration is how a pipeline's workers are shaped. It is a subset of
// a Kubernetes pod spec so a manifest fragment pastes in unchanged. Resources
// merge per key when a run overrides a pipeline; node_selector and tolerations
// replace wholesale.
message WorkerConfiguration {
  WorkerResources resources = 1;
  map<string, string> node_selector = 2;
  repeated WorkerToleration tolerations = 3;
}

// ConnectorKind distinguishes a source from a sink in the catalog.
enum ConnectorKind {
  CONNECTOR_KIND_UNSPECIFIED = 0;
  CONNECTOR_KIND_SOURCE = 1;
  CONNECTOR_KIND_SINK = 2;
}

// FieldType drives UI form controls for connector configuration fields.
enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  FIELD_TYPE_STRING = 1;
  FIELD_TYPE_INT = 2;
  FIELD_TYPE_BOOL = 3;
  FIELD_TYPE_SECRET = 4;
  FIELD_TYPE_DURATION = 5;
  FIELD_TYPE_ENUM = 6;
  FIELD_TYPE_OBJECT = 7;
  // LIST is a string list; ConfigField.enum supplies the selectable values.
  FIELD_TYPE_LIST = 8;
}

// ReplicationMode is how a connection replicates, decided at source creation:
// query-based reads (standard) or the change stream (CDC). Databases choose;
// APIs are implicitly standard.
enum ReplicationMode {
  REPLICATION_MODE_UNSPECIFIED = 0;
  REPLICATION_MODE_STANDARD = 1;
  REPLICATION_MODE_CDC = 2;
}

// ReadMode is the per-resource read lever on Standard connections.
enum ReadMode {
  READ_MODE_UNSPECIFIED = 0;
  READ_MODE_FULL = 1;
  READ_MODE_INCREMENTAL = 2;
}

// WriteMode is the destination-route write lever. Delete and merge are engine
// mechanisms and are not user-selectable write modes.
enum WriteMode {
  WRITE_MODE_UNSPECIFIED = 0;
  WRITE_MODE_APPEND = 1;
  WRITE_MODE_REPLACE = 2;
  WRITE_MODE_UPSERT = 3;
}

enum FieldScope {
  FIELD_SCOPE_UNSPECIFIED = 0;
  FIELD_SCOPE_CONNECTION = 1;
  FIELD_SCOPE_PIPELINE = 2;
}

// ConfigField describes one connector configuration field.
message ConfigField {
  string name = 1;
  FieldType type = 2;
  bool required = 3;
  google.protobuf.Value default = 4;
  repeated EnumOption enum = 5;
  string help = 6;
  FieldScope scope = 7;
  // secret marks the field as sensitive: rendered masked, stored as a ref.
  bool secret = 8;
  // fields describes members when type is FIELD_TYPE_OBJECT. An empty list
  // means the object is intentionally free-form.
  repeated ConfigField fields = 9;
  // visible_when conditionally includes this field based on a sibling field.
  FieldCondition visible_when = 10;
}

// EnumOption is one ordered choice for an enum or list config field.
message EnumOption {
  string value = 1;
  string label = 2;
}

message FieldCondition {
  string field = 1;
  repeated string values = 2;
}

// ConfigSchema describes the configuration accepted by a connector.
message ConfigSchema {
  repeated ConfigField fields = 1;
}
