syntax = "proto3";

package ingestion.v1;

import "google/protobuf/struct.proto";

// ConnectorKind distinguishes a source from a sink in the catalog.
enum ConnectorKind {
  CONNECTOR_KIND_UNSPECIFIED = 0;
  CONNECTOR_KIND_SOURCE = 1;
  CONNECTOR_KIND_SINK = 2;
}

// FieldType mirrors pkg.FieldType; drives UI form controls for config fields.
enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  FIELD_TYPE_STRING = 1;
  FIELD_TYPE_INT = 2;
  FIELD_TYPE_BOOL = 3;
  FIELD_TYPE_SECRET = 4;
  FIELD_TYPE_DURATION = 5;
  FIELD_TYPE_ENUM = 6;
  FIELD_TYPE_OBJECT = 7;
}

// ReplicationMode is how a connection replicates, decided at source creation:
// query-based reads (standard) or the change stream (CDC). Databases choose;
// APIs are implicitly standard.
enum ReplicationMode {
  REPLICATION_MODE_UNSPECIFIED = 0;
  REPLICATION_MODE_STANDARD = 1;
  REPLICATION_MODE_CDC = 2;
}

// ReadMode is the per-table read lever on standard connections: reread the
// whole table each run, or only rows past a cursor column.
enum ReadMode {
  READ_MODE_UNSPECIFIED = 0;
  READ_MODE_FULL = 1;
  READ_MODE_INCREMENTAL = 2;
}

enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OPERATION_INSERT = 1;
  OPERATION_UPDATE = 2;
  OPERATION_DELETE = 3;
}

// IngestionType is named {read}_{write}: what the source reads crossed with
// how the sink lands it. Derived by the server from read_mode, write_mode,
// and the connection's replication mode — never set by clients.
enum IngestionType {
  INGESTION_TYPE_UNSPECIFIED = 0;
  INGESTION_TYPE_SNAPSHOT_REPLACE = 1;
  INGESTION_TYPE_SNAPSHOT_UPSERT = 2;
  INGESTION_TYPE_SNAPSHOT_APPEND = 3;
  INGESTION_TYPE_INCREMENTAL_APPEND = 4;
  INGESTION_TYPE_INCREMENTAL_UPSERT = 5;
  INGESTION_TYPE_INCREMENTAL_DELETE = 6;
  INGESTION_TYPE_CDC = 7;
}

// WriteMode is the sink write lever: append keeps the history of every load;
// replace, upsert, and append_dedupe manage current state. Delete and merge
// are engine mechanisms, never offered as levers.
enum WriteMode {
  WRITE_MODE_UNSPECIFIED = 0;
  WRITE_MODE_APPEND = 1;
  WRITE_MODE_REPLACE = 2;
  WRITE_MODE_UPSERT = 3;
  WRITE_MODE_DELETE = 4;
  WRITE_MODE_MERGE = 5;
}

enum WriteAtomicity {
  WRITE_ATOMICITY_UNSPECIFIED = 0;
  WRITE_ATOMICITY_BATCH = 1;
  WRITE_ATOMICITY_RESOURCE = 2;
  WRITE_ATOMICITY_RUN = 3;
}

enum CheckpointPolicy {
  CHECKPOINT_POLICY_UNSPECIFIED = 0;
  CHECKPOINT_POLICY_NONE = 1;
  CHECKPOINT_POLICY_AFTER_BATCH = 2;
  CHECKPOINT_POLICY_AFTER_COMMIT = 3;
}

enum FieldScope {
  FIELD_SCOPE_UNSPECIFIED = 0;
  FIELD_SCOPE_CONNECTION = 1;
  FIELD_SCOPE_PIPELINE = 2;
}

// ConfigField mirrors pkg.ConfigField.
message ConfigField {
  string name = 1;
  FieldType type = 2;
  bool required = 3;
  google.protobuf.Value default = 4;
  repeated EnumOption enum = 5;
  string help = 6;
  FieldScope scope = 7;
  // secret marks the field as sensitive: rendered masked, stored as a ref.
  bool secret = 8;
  // fields describes members when type is FIELD_TYPE_OBJECT. An empty list
  // means the object is intentionally free-form.
  repeated ConfigField fields = 9;
  // visible_when conditionally includes this field based on a sibling field.
  FieldCondition visible_when = 10;
}

message EnumOption {
  string value = 1;
  string label = 2;
}

message FieldCondition {
  string field = 1;
  repeated string values = 2;
}

// ConfigSchema mirrors pkg.ConfigSchema.
message ConfigSchema {
  repeated ConfigField fields = 1;
}

message WritePolicyCapability {
  WriteMode mode = 1;
  bool requires_pk = 2;
  bool requires_order = 3;
  repeated Operation accepts_ops = 4;
  WriteAtomicity atomicity = 5;
}

message SourcePolicy {
  // The engine read mechanism; CDC policies report READ_MODE_UNSPECIFIED
  // since the stream is not a per-table read.
  ReadMode mode = 1;
  repeated Operation emits_ops = 2;
  bool ordered = 3;
  CheckpointPolicy checkpointing = 4;
}
