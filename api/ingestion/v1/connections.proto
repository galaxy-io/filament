syntax = "proto3";

package ingestion.v1;

import "google/protobuf/struct.proto";
import "ingestion/v1/common.proto";
import "ingestion/v1/pagination.proto";

// Connection is a reusable, tenant-scoped source or sink. It holds the
// connection-scoped config (host/bucket/credentials) shared by every pipeline
// node that references it, keeping connection details in one place instead of
// duplicated inline on each pipeline. version is an optimistic lock, mirroring
// Pipeline: an update must carry the version it last read.
message Connection {
  string tenant_id = 1;
  string id = 2;
  ConnectorKind kind = 3;
  string name = 4;
  string connector = 5;
  google.protobuf.Struct config = 6; // CONNECTION-scoped fields only
  map<string, string> secret_refs = 7;
  int64 version = 8;
  int64 deleted_at = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
  string created_by_user_id = 12;
  string updated_by_user_id = 13;
  string deleted_by_user_id = 14;
}

message CreateConnectionRequest {
  string tenant_id = 1;
  ConnectorKind kind = 2;
  string name = 3;
  string connector = 4;
  google.protobuf.Struct config = 5;
  map<string, string> secret_refs = 6;
}

message CreateConnectionResponse {
  Connection connection = 1;
}

message UpdateConnectionRequest {
  string tenant_id = 1;
  Connection connection = 2;
}

message UpdateConnectionResponse {
  Connection connection = 1;
}

message GetConnectionRequest {
  string tenant_id = 1;
  string id = 2;
}

message GetConnectionResponse {
  Connection connection = 1;
}

// ListConnections filters by tenant; kind UNSPECIFIED returns both sources and
// sinks.
message ListConnectionsRequest {
  string tenant_id = 1;
  ConnectorKind kind = 2;
  bool include_deleted = 3;
  PaginationRequest pagination = 4;
}

message ListConnectionsResponse {
  repeated Connection connections = 1;
  PaginationResponse pagination = 2;
}

message DeleteConnectionRequest {
  string tenant_id = 1;
  string id = 2;
}

message DeleteConnectionResponse {}
