syntax = "proto3";

package ingestion.v1;

import "google/protobuf/struct.proto";
import "ingestion/v1/common.proto";
import "ingestion/v1/pagination.proto";

// Capabilities flattens source and sink capabilities; fields not relevant to a
// given kind stay false.
message Capabilities {
  bool discoverable = 1;
  bool per_resource_cursor = 2;
  bool transactional = 3;
  bool upsertable = 4;
  bool schematized = 5;
  repeated WritePolicyCapability write_policies = 6;
  repeated SourcePolicy source_policies = 7;
  // Sink: the write modes this sink offers.
  repeated WriteMode write_modes = 8;
}

// ConnectorSpec mirrors pkg.ConnectorSpec / pkg.SinkSpec.
message ConnectorSpec {
  string name = 1;
  string display_name = 2;
  ConnectorKind kind = 3;
  string version = 4;
  repeated ReplicationMode modes = 5;
  ConfigSchema config_schema = 6;
  Capabilities capabilities = 7;
  string description = 8;
  string dark_logo_url = 9;
  string light_logo_url = 10;
  // Pipeline-scoped config field holding the sink's destination schema, when
  // the sink has one. The server defaults it from the source connection name.
  string schema_field = 11;
}

message ListConnectorsRequest {
  string tenant_id = 1;
  // Filter to one kind; UNSPECIFIED returns both sources and sinks.
  ConnectorKind kind = 2;
  PaginationRequest pagination = 3;
}

message ListConnectorsResponse {
  repeated ConnectorSpec connectors = 1;
  PaginationResponse pagination = 2;
}

message GetConnectorRequest {
  string tenant_id = 1;
  string connector = 2;
  ConnectorKind kind = 3;
}

message GetConnectorResponse {
  ConnectorSpec connector = 1;
}

message ValidateConfigRequest {
  string tenant_id = 1;
  ConnectorKind kind = 2;
  string connector = 3;
  google.protobuf.Struct config = 4;
  // live attempts a TestConnection probe if the connector supports it.
  bool live = 5;
  // When set, secrets stored on this connection fill config fields the
  // request leaves blank. tenant_id must match the connection's tenant.
  string connection_id = 6;
}

// ValidationError carries a field-keyed validation failure. An empty field means
// the error applies to the whole config.
message ValidationError {
  string field = 1;
  string message = 2;
}

message ValidateConfigResponse {
  bool valid = 1;
  repeated ValidationError errors = 2;
}

message DiscoverResourcesRequest {
  string tenant_id = 1;
  // Source connector only; discovering a sink is not meaningful.
  string connector = 2;
  google.protobuf.Struct config = 3;
  bool refresh = 4;
  // tenant_id must match the connection's tenant.
  string connection_id = 5;
}

// Resource mirrors pkg.Resource.
message Resource {
  string name = 1;
  bool selectable = 2;
  repeated string primary_key = 3;
  int64 estimated_rows = 4;
  string selector = 5;
  string display_name = 6;
  map<string, string> metadata = 7;
}

message DiscoverResourcesResponse {
  repeated Resource resources = 1;
}

message GetResourceColumnsRequest {
  string tenant_id = 1;
  string connector = 2;
  google.protobuf.Struct config = 3;
  // tenant_id must match the connection's tenant.
  string connection_id = 4;
  repeated string resources = 5;
}

message ResourceColumn {
  string name = 1;
  string logical_type = 2;
  string native_type = 3;
  bool nullable = 4;
  bool primary_key = 5;
  bool cursor_eligible = 6;
  bool cursor_recommended = 7;
  int32 recommendation_rank = 8;
  string warning = 9;
  bool configurable = 10;
  bool supports_lookback = 11;
}

message ResourceColumns {
  string resource = 1;
  repeated ResourceColumn columns = 2;
}

message GetResourceColumnsResponse {
  repeated ResourceColumns resources = 1;
}
