syntax = "proto3";

package ingestion.v1;

message PutSecretRequest {
  string tenant_id = 1;
  string ref = 2;
  bytes value = 3;
  map<string, string> meta = 4;
}

message PutSecretResponse {}

message DeleteSecretRequest {
  string tenant_id = 1;
  string ref = 2;
}

message DeleteSecretResponse {}
