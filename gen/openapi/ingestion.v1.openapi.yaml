  /v1/pipelines/{pipeline_id}/run:
    post:
      tags:
        - ingestion.v1.IngestionService
      summary: RunPipeline
      description: Runs; compile + submit a pipeline, then list / snapshot / signal.
      operationId: ingestion.v1.IngestionService.RunPipeline
      parameters:
        - name: pipeline_id
          in: path
          required: true
          schema:
            type: string
            title: pipeline_id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clientToken:
                  type: string
                  title: client_token
                  description: |-
                    client_token salts the idempotency key so a deliberate re-run differs from a
                     double-click; reusing a token dedupes to the same runs.
                options:
                  title: options
                  description: |-
                    options overrides engine throughput defaults for every run this call
                     produces. Unset (or any zero field) defers to defaults.
                  $ref: '#/components/schemas/ingestion.v1.RunOptions'
              title: RunPipelineRequest
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ingestion.v1.RunPipelineResponse'
