         is optional: a zero value defers to the engine default downstream.
    ingestion.v1.RunPipelineRequest:
      type: object
      properties:
        pipelineId:
          type: string
          title: pipeline_id
        clientToken:
          type: string
          title: client_token
          description: |-
            client_token salts the idempotency key so a deliberate re-run differs from a
             double-click; reusing a token dedupes to the same runs.
        options:
          title: options
          description: |-
            options overrides engine throughput defaults for every run this call
             produces. Unset (or any zero field) defers to defaults.
          $ref: '#/components/schemas/ingestion.v1.RunOptions'
      title: RunPipelineRequest
      additionalProperties: false
    ingestion.v1.RunPipelineResponse:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/ingestion.v1.RunBinding'
          title: runs
      title: RunPipelineResponse
      additionalProperties: false
    ingestion.v1.RunResourceState:
      type: object
      properties:
        resource:
          type: string
          title: resource
        enabled:
          type: boolean
          title: enabled
        status:
          title: status
          $ref: '#/components/schemas/ingestion.v1.RunStatus'
        records:
          type:
            - integer
            - string
          title: records
          format: int64
        bytes:
          type:
            - integer
            - string
          title: bytes
          format: int64
        error:
          type: string
          title: error
      title: RunResourceState
      additionalProperties: false
      description: RunResourceState mirrors pkg.ResourceState (progress per resource).
    ingestion.v1.RunSnapshot:
      type: object
      properties:
        run:
          title: run
          $ref: '#/components/schemas/ingestion.v1.RunInfo'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ingestion.v1.RunResourceState'
          title: resources
        atSeq:
          type:
            - integer
            - string
          title: at_seq
          format: int64
      title: RunSnapshot
      additionalProperties: false
    ingestion.v1.RunStatus:
      type: string
      title: RunStatus
      enum:
        - RUN_STATUS_UNSPECIFIED
        - RUN_STATUS_REQUESTED
        - RUN_STATUS_RUNNING
        - RUN_STATUS_COMPLETED
        - RUN_STATUS_FAILED
        - RUN_STATUS_CANCELED
        - RUN_STATUS_PAUSED
        - RUN_STATUS_PARTIAL
      description: RunStatus mirrors pkg.RunStatus.
    ingestion.v1.Signal:
      type: string
      title: Signal
      enum:
        - SIGNAL_UNSPECIFIED
        - SIGNAL_PAUSE
        - SIGNAL_RESUME
        - SIGNAL_CANCEL
      description: Signal mirrors pkg.Signal.
    ingestion.v1.SignalRunRequest:
      type: object
      properties:
        runId:
          type: string
          title: run_id
        signal:
          title: signal
          $ref: '#/components/schemas/ingestion.v1.Signal'
      title: SignalRunRequest
      additionalProperties: false
    ingestion.v1.SignalRunResponse:
      type: object
      title: SignalRunResponse
      additionalProperties: false
    ingestion.v1.SourcePolicy:
      type: object
      properties:
        mode:
          title: mode
          $ref: '#/components/schemas/ingestion.v1.ReplicationMode'
        emitsOps:
          type: array
          items:
            $ref: '#/components/schemas/ingestion.v1.Operation'
          title: emits_ops
        ordered:
          type: boolean
          title: ordered
        checkpointing:
          title: checkpointing
          $ref: '#/components/schemas/ingestion.v1.CheckpointPolicy'
      title: SourcePolicy
      additionalProperties: false
    ingestion.v1.TailRunRequest:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        runId:
          type: string
          title: run_id
        replay:
          type: boolean
          title: replay
          description: |-
            replay first emits events synthesized from the current snapshot (each marked
             replay=true) so progress is correct on reconnect, before live facts stream.
      title: TailRunRequest
      additionalProperties: false
    ingestion.v1.TailRunResponse:
      type: object
      properties:
        event:
          title: event
          $ref: '#/components/schemas/ingestion.v1.RunEvent'
      title: TailRunResponse
      additionalProperties: false
    ingestion.v1.UpdateConnectionRequest:
      type: object
      properties:
        connection:
          title: connection
          $ref: '#/components/schemas/ingestion.v1.Connection'
      title: UpdateConnectionRequest
      additionalProperties: false
    ingestion.v1.UpdateConnectionResponse:
      type: object
      properties:
        connection:
          title: connection
          $ref: '#/components/schemas/ingestion.v1.Connection'
      title: UpdateConnectionResponse
      additionalProperties: false
    ingestion.v1.UpdatePipelineRequest:
      type: object
      properties:
        pipeline:
          title: pipeline
          $ref: '#/components/schemas/ingestion.v1.Pipeline'
      title: UpdatePipelineRequest
      additionalProperties: false
    ingestion.v1.UpdatePipelineResponse:
      type: object
      properties:
        pipeline:
          title: pipeline
          $ref: '#/components/schemas/ingestion.v1.Pipeline'
      title: UpdatePipelineResponse
      additionalProperties: false
    ingestion.v1.UpdatePipelineScheduleRequest:
      type: object
      properties:
        pipelineId:
          type: string
          title: pipeline_id
        schedule:
          title: schedule
          $ref: '#/components/schemas/ingestion.v1.PipelineScheduleConfig'
      title: UpdatePipelineScheduleRequest
      additionalProperties: false
    ingestion.v1.UpdatePipelineScheduleResponse:
      type: object
      properties:
        schedule:
          title: schedule
          $ref: '#/components/schemas/ingestion.v1.PipelineSchedule'
      title: UpdatePipelineScheduleResponse
      additionalProperties: false
    ingestion.v1.ValidateConfigRequest:
      type: object
      properties:
        kind:
          title: kind
          $ref: '#/components/schemas/ingestion.v1.ConnectorKind'
        connector:
          type: string
          title: connector
        config:
          title: config
          $ref: '#/components/schemas/google.protobuf.Struct'
        live:
          type: boolean
          title: live
          description: live attempts a TestConnection probe if the connector supports it.
      title: ValidateConfigRequest
      additionalProperties: false
    ingestion.v1.ValidateConfigResponse:
      type: object
      properties:
        valid:
          type: boolean
          title: valid
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ingestion.v1.ValidationError'
          title: errors
      title: ValidateConfigResponse
      additionalProperties: false
    ingestion.v1.ValidationError:
      type: object
      properties:
        field:
          type: string
          title: field
        message:
          type: string
          title: message
      title: ValidationError
      additionalProperties: false
      description: |-
        ValidationError carries a field-keyed validation failure. An empty field means
         the error applies to the whole config.
    ingestion.v1.WriteAtomicity:
      type: string
      title: WriteAtomicity
      enum:
        - WRITE_ATOMICITY_UNSPECIFIED
        - WRITE_ATOMICITY_BATCH
        - WRITE_ATOMICITY_RESOURCE
        - WRITE_ATOMICITY_RUN
    ingestion.v1.WriteMode:
      type: string
      title: WriteMode
      enum:
        - WRITE_MODE_UNSPECIFIED
        - WRITE_MODE_APPEND
        - WRITE_MODE_REPLACE
        - WRITE_MODE_UPSERT
        - WRITE_MODE_DELETE
        - WRITE_MODE_MERGE
    ingestion.v1.WritePolicyCapability:
      type: object
      properties:
        mode:
          title: mode
          $ref: '#/components/schemas/ingestion.v1.WriteMode'
        requiresPk:
          type: boolean
          title: requires_pk
        requiresOrder:
          type: boolean
          title: requires_order
        acceptsOps:
          type: array
          items:
            $ref: '#/components/schemas/ingestion.v1.Operation'
          title: accepts_ops
        atomicity:
          title: atomicity
          $ref: '#/components/schemas/ingestion.v1.WriteAtomicity'
      title: WritePolicyCapability
      additionalProperties: false
security: []
tags:
  - name: ingestion.v1.IngestionService
    description: |-
      IngestionService is the engine-as-a-service surface the pipeline UI drives.
       The google.api.http annotations expose each rpc as REST under /v1 via the
       vanguard transcoder; path variables name fields on the request message.
