components:
  schemas:
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.ListValue:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Value'
          title: values
          description: Repeated field of dynamically typed values.
      title: ListValue
      additionalProperties: false
      description: |-
        `ListValue` is a wrapper around a repeated field of values.

         The JSON representation for `ListValue` is JSON array.
    google.protobuf.NullValue:
      type: string
      title: NullValue
      enum:
        - NULL_VALUE
      description: |-
        `NullValue` is a singleton enumeration to represent the null value for the
         `Value` type union.

         The JSON representation for `NullValue` is JSON `null`.
    google.protobuf.Struct:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/google.protobuf.Value'
      description: |-
        `Struct` represents a structured data value, consisting of fields
         which map to dynamically typed values. In some languages, `Struct`
         might be supported by a native representation. For example, in
         scripting languages like JS a struct is represented as an
         object. The details of that representation are described together
         with the proto support for the language.

         The JSON representation for `Struct` is JSON object.
    google.protobuf.Struct.FieldsEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          title: value
          $ref: '#/components/schemas/google.protobuf.Value'
      title: FieldsEntry
      additionalProperties: false
    google.protobuf.Value:
      oneOf:
        - type: "null"
        - type: number
        - type: string
        - type: boolean
        - type: array
        - type: object
          additionalProperties: true
      description: |-
        `Value` represents a dynamically typed value which can be either
         null, a number, a string, a boolean, a recursive struct value, or a
         list of values. A producer of value is expected to set one of these
         variants. Absence of any variant indicates an error.

         The JSON representation for `Value` is JSON value.
    ingestion.v1.Capabilities:
      type: object
      properties:
        discoverable:
          type: boolean
          title: discoverable
        perResourceCursor:
          type: boolean
          title: per_resource_cursor
        transactional:
          type: boolean
          title: transactional
        upsertable:
          type: boolean
          title: upsertable
        schematized:
          type: boolean
          title: schematized
        writePolicies:
          type: array
          items:
            $ref: '#/components/schemas/ingestion.v1.WritePolicyCapability'
          title: write_policies
        sourcePolicies:
          type: array
          items:
            $ref: '#/components/schemas/ingestion.v1.SourcePolicy'
          title: source_policies
      title: Capabilities
      additionalProperties: false
      description: |-
        Capabilities flattens source and sink capabilities; fields not relevant to a
         given kind stay false.
    ingestion.v1.CheckpointPolicy:
      type: string
      title: CheckpointPolicy
      enum:
        - CHECKPOINT_POLICY_UNSPECIFIED
        - CHECKPOINT_POLICY_NONE
        - CHECKPOINT_POLICY_AFTER_BATCH
        - CHECKPOINT_POLICY_AFTER_COMMIT
    ingestion.v1.ConfigField:
      type: object
      properties:
        name:
          type: string
          title: name
        type:
          title: type
          $ref: '#/components/schemas/ingestion.v1.FieldType'
        required:
          type: boolean
          title: required
        default:
          title: default
          $ref: '#/components/schemas/google.protobuf.Value'
        enum:
          type: array
          items:
            $ref: '#/components/schemas/ingestion.v1.EnumOption'
          title: enum
        help:
          type: string
          title: help
        scope:
          title: scope
          $ref: '#/components/schemas/ingestion.v1.FieldScope'
        secret:
          type: boolean
          title: secret
          description: 'secret marks the field as sensitive: rendered masked, stored as a ref.'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ingestion.v1.ConfigField'
          title: fields
          description: |-
            fields describes members when type is FIELD_TYPE_OBJECT. An empty list
             means the object is intentionally free-form.
        visibleWhen:
          title: visible_when
          description: visible_when conditionally includes this field based on a sibling field.
          $ref: '#/components/schemas/ingestion.v1.FieldCondition'
      title: ConfigField
      additionalProperties: false
      description: ConfigField mirrors pkg.ConfigField.
    ingestion.v1.ConfigSchema:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ingestion.v1.ConfigField'
          title: fields
      title: ConfigSchema
      additionalProperties: false
      description: ConfigSchema mirrors pkg.ConfigSchema.
    ingestion.v1.Connection:
      type: object
      properties:
        id:
          type: string
          title: id
        tenantId:
          type: string
          title: tenant_id
        kind:
          title: kind
          $ref: '#/components/schemas/ingestion.v1.ConnectorKind'
        name:
          type: string
          title: name
        connector:
          type: string
          title: connector
        config:
          title: config
          description: CONNECTION-scoped fields only
          $ref: '#/components/schemas/google.protobuf.Struct'
        secretRefs:
          type: object
          title: secret_refs
          additionalProperties:
            type: string
            title: value
        version:
          type:
            - integer
            - string
          title: version
          format: int64
      title: Connection
      additionalProperties: false
      description: |-
        Connection is a reusable, tenant-scoped source or sink. It holds the
         connection-scoped config (host/bucket/credentials) shared by every pipeline
         node that references it, keeping connection details in one place instead of
         duplicated inline on each pipeline. version is an optimistic lock, mirroring
         Pipeline: an update must carry the version it last read.
    ingestion.v1.Connection.SecretRefsEntry:
      type: object
      properties:
