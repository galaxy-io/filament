# Our own packages ship fresh by design; exempt them from the release-age
# supply-chain quarantine.
minimumReleaseAgeExclude:
  - "@galaxy-io/*"

# CodeMirror extensions must share the same state and view instances.
overrides:
  "@codemirror/state": "6.7.5"
  "@codemirror/view": "6.43.12"
  # 1.5.431 was resolved before it cleared minimumReleaseAge. Keep installs
  # reproducible on the newest accepted release until the next lock refresh.
  "electron-to-chromium": "1.5.430"

allowBuilds:
  "@bufbuild/buf": true
