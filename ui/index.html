<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Open Graph / Link preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Galaxy" />
    <meta property="og:image" content="https://cdn.getgalaxy.io/meta/filament.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Galaxy" />
    <meta name="twitter:image" content="https://cdn.getgalaxy.io/meta/filament.png" />
    <!-- Fonts -->
    <link rel="preload" href="https://cdn.getgalaxy.io/fonts/Diatype/ABCDiatype-Regular.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="https://cdn.getgalaxy.io/fonts/Diatype/ABCDiatype-Medium.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="https://cdn.getgalaxy.io/fonts/BerkeleyMono/BerkeleyMono-Regular.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="https://cdn.getgalaxy.io/fonts/BerkeleyMono/BerkeleyMono-Bold.otf" as="font" type="font/otf" crossorigin>
    <!-- Title -->
    <title>Filament</title>
    <!-- Critical inline script to prevent white flash - runs before any modules load -->
    <!-- Keep THEME_KEY in sync with GALAXY_THEME_STORAGE_KEY, and the hexes with color.background.base in @galaxy-io/dls -->
    <script>
      (function () {
        try {
          const THEME_KEY = 'galaxy:theme';
          const storedTheme = localStorage.getItem(THEME_KEY);
          const selectedTheme =
            storedTheme === 'SYSTEM' || storedTheme === 'LIGHT' || storedTheme === 'DARK'
              ? storedTheme
              : (localStorage.setItem(THEME_KEY, 'SYSTEM'), 'SYSTEM');

          // Resolve to actual theme (DARK/LIGHT)
          const resolvedTheme =
            selectedTheme === 'SYSTEM'
              ? window.matchMedia?.('(prefers-color-scheme: dark)').matches
                ? 'DARK'
                : 'LIGHT'
              : selectedTheme;

          // Apply background immediately to prevent white flash
          const bg = resolvedTheme === 'DARK' ? '#141415' : '#ffffff';
          document.documentElement.style.backgroundColor = bg;
          document.body?.style.setProperty('background-color', bg);
        } catch (_) {
          // Fallback on error (e.g. localStorage blocked)
          document.documentElement.style.backgroundColor = '#141415';
          document.body?.style.setProperty('background-color', '#141415');
        }
      })();
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        outline: none;
        box-sizing: border-box;
        border: 0;
        font-size: 100%;
        font: inherit;
        vertical-align: baseline;
      }

      html {
        line-height: 1;
      }

      html,
      body {
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      ::-webkit-scrollbar {
        display: none;
      }

      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
