spec:
  name: filament
  services:
    - name: filament
      image:
        registry_type: GHCR
        registry: galaxy-io
        repository: filament/standalone
        tag: 0.1.0
      instance_count: 1
      instance_size_slug: basic-xxs
      http_port: 8080
      health_check:
        http_path: /
      envs:
        - key: INGESTION_ADDR
          scope: RUN_TIME
          value: "0.0.0.0:8080"
        - key: LOG_LEVEL
          scope: RUN_TIME
          value: INFO
        - key: NATS_TTL_SECONDS
          scope: RUN_TIME
          value: "604800"
