syntax = "proto3";

package worker.v1;

import "google/protobuf/struct.proto";
import "ingestion/v1/connectors.proto";

enum InspectStatus {
  INSPECT_STATUS_UNSPECIFIED = 0;
  INSPECT_STATUS_OK = 1;
  INSPECT_STATUS_UNSUPPORTED = 2;
  INSPECT_STATUS_FAILED = 3;
}

message DiscoverRequest {
  string source = 1;
  google.protobuf.Struct config = 2;
  bool refresh = 3;
}

// DiscoverResponse carries the public resource projection. Row estimates and
// embedded schemas stay on the worker; no control service reads them.
message DiscoverResponse {
  repeated ingestion.v1.Resource resources = 1;
}

// InspectRequest names the resources to report on; none means every
// selectable resource the source discovers.
message InspectRequest {
  string source = 1;
  google.protobuf.Struct config = 2;
  repeated string resources = 3;
}

message Inspection {
  string name = 1;
  InspectStatus status = 2;
  string message = 3;
  repeated string primary_key = 4;
  repeated ingestion.v1.ResourceColumn columns = 5;
  bool ranked = 6;
  bool managed_incremental = 7;
}

message InspectResponse {
  repeated Inspection inspections = 1;
}
