syntax = "proto3";

package ingestion.v1;

import "google/protobuf/struct.proto";
import "ingestion/v1/common.proto";
import "ingestion/v1/pagination.proto";
import "ingestion/v1/sorting.proto";

// RunStatus is the persisted lifecycle state of a run.
enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_REQUESTED = 1;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_COMPLETED = 3;
  RUN_STATUS_FAILED = 4;
  RUN_STATUS_CANCELED = 5;
  RUN_STATUS_PAUSED = 6;
  RUN_STATUS_PARTIAL = 7;
  RUN_STATUS_SCHEDULED = 8;
}

// RunSignal is a lifecycle command sent to a run.
enum RunSignal {
  RUN_SIGNAL_UNSPECIFIED = 0;
  RUN_SIGNAL_PAUSE = 1;
  RUN_SIGNAL_RESUME = 2;
  RUN_SIGNAL_CANCEL = 3;
  // Continuous only: drain and persist stopped intent, disabling restart.
  RUN_SIGNAL_STOP = 4;
}

// ExecutionDesiredState is the persisted intent for continuous execution.
enum ExecutionDesiredState {
  EXECUTION_DESIRED_STATE_UNSPECIFIED = 0;
  EXECUTION_DESIRED_STATE_ENABLED = 1;
  EXECUTION_DESIRED_STATE_PAUSED = 2;
  EXECUTION_DESIRED_STATE_STOPPED = 3;
}

// ExecutionObservedState describes progress toward the requested state.
// An idle source can remain RUNNING; lack of arriving records is not a failure.
enum ExecutionObservedState {
  EXECUTION_OBSERVED_STATE_UNSPECIFIED = 0;
  EXECUTION_OBSERVED_STATE_STARTING = 1;
  EXECUTION_OBSERVED_STATE_RUNNING = 2;
  EXECUTION_OBSERVED_STATE_DRAINING = 3;
  EXECUTION_OBSERVED_STATE_PAUSED = 4;
  EXECUTION_OBSERVED_STATE_STOPPED = 5;
  EXECUTION_OBSERVED_STATE_RETRYING = 6;
  EXECUTION_OBSERVED_STATE_BLOCKED = 7;
  EXECUTION_OBSERVED_STATE_FAILED = 8;
}

// ExecutionStatus is the user-facing state of continuous execution, loaded from
// durable state. GetRun/ListRuns remain authoritative after missed live events.
// Pause/resume and worker restarts retain the run ID; starting again after stop
// creates a new run. Desired and observed states can differ while draining.
message ExecutionStatus {
  ExecutionDesiredState desired_state = 1;
  ExecutionObservedState observed_state = 2;
  // Opaque revision for SignalRunRequest.expected_revision; clients echo it.
  int64 revision = 3;
  // User-facing explanation, including actionable blocked/failed conditions.
  string reason = 4;
  // Epoch milliseconds of the most recent durable commit; zero means none yet.
  int64 last_committed_at = 5;
}

// RatePolicy throttles source reads.
message RatePolicy {
  double requests_per_second = 1;
  int32 burst = 2;
}

// RunOptions overrides the engine's throughput defaults for a run. Every field
// is optional: a zero value defers to the engine default downstream.
message RunOptions {
  int32 fetch_size = 1;
  int32 batch_max_rows = 2;
  int64 batch_max_bytes = 3;
  RatePolicy rate_limit = 4;
  int32 snapshot_parallelism = 5;
  int32 checkpoint_every = 6;
  // Unspecified inherits the pipeline mode. Explicit values override this start.
  // Continuous creates a durable activation; unavailable profiles are rejected.
  ExecutionMode execution = 7;
}

message RunPipelineRequest {
  string pipeline_id = 1;
  // client_token salts the idempotency key so a deliberate re-run differs from a
  // double-click; reusing a token dedupes to the same runs.
  string client_token = 2;
  // options overrides engine throughput defaults for every run this call
  // produces. Unset (or any zero field) defers to defaults.
  RunOptions options = 3;
  // worker_configuration overrides the pipeline's own for this call only, field
  // by field: an empty field inherits the pipeline's value. The resolved result
  // is stamped onto each run, so editing the pipeline afterwards cannot change
  // a run already requested.
  WorkerConfiguration worker_configuration = 4;
}

// PipelineEdgeRun ties one compiled pipeline edge to the run it produced.
message PipelineEdgeRun {
  string pipeline_edge_key = 1;
  RunInfo run = 2;
}

message RunPipelineResponse {
  repeated PipelineEdgeRun edge_runs = 1;
}

// RunResourceState reports progress for one resource in a run.
message RunResourceState {
  string resource_name = 1;
  RunStatus status = 2;
  int64 records = 3;
  int64 bytes = 4;
  string error = 5;
}

// RunInfo is the run-level persisted state exposed by the API.
message RunInfo {
  string tenant_id = 1;
  string id = 2;
  string pipeline_id = 3;
  string pipeline_version_id = 4;
  RunStatus status = 5;
  int64 records = 6;
  int64 bytes = 7;
  string error = 8;
  int64 started_at = 9;
  int64 ended_at = 10;
  string source_connection_id = 11;
  string sink_connection_id = 12;
  // Worker pod usage folded from run.heartbeat facts.
  double cpu_seconds = 13;
  int64 memory_peak_bytes = 14;
  // Lifecycle stamps in epoch millis; 0 means unset. created_at is row birth,
  // scheduled_at the intended fire time (scheduled runs only), requested_at
  // when the run was queued for dispatch. started_at/ended_at above are the
  // worker's own start and finish.
  int64 created_at = 15;
  int64 scheduled_at = 16;
  int64 requested_at = 17;
  int64 updated_at = 18;
  ExecutionMode execution = 19;
  // Present for continuous runs. records/bytes above reflect committed progress.
  ExecutionStatus execution_status = 20;
}

message RunSnapshot {
  RunInfo run = 1;
  repeated RunResourceState resources = 2;
  uint64 at_seq = 3;
}

message GetRunRequest {
  string run_id = 1;
}

message GetRunResponse {
  RunSnapshot snapshot = 1;
}

message ListRunsRequest {
  string pipeline_id = 1;
  optional string pipeline_version_id = 2;
  repeated RunStatus status = 3;
  PaginationRequest pagination = 4;
  // since_ms/until_ms window on started_at (inclusive/exclusive, epoch
  // millis); 0 means unbounded. Runs that never started are excluded.
  int64 since_ms = 5;
  int64 until_ms = 6;
  string search = 7;
  SortingRequest sorting = 8;
}

message ListRunsResponse {
  repeated RunInfo runs = 1;
  PaginationResponse pagination = 2;
}

message SignalRunRequest {
  string run_id = 1;
  RunSignal signal = 2;
  // Optional CAS for continuous desired state. A stale revision is rejected.
  // Absent permits a transition against the current revision.
  optional int64 expected_revision = 3;
}

// Continuous success confirms persisted intent, not completed worker drainage.
// Bounded responses leave execution_status absent.
message SignalRunResponse {
  ExecutionStatus execution_status = 1;
}

message TailRunRequest {
  string run_id = 1;
  // replay first emits events synthesized from the current snapshot (each marked
  // replay=true) so progress is correct on reconnect, before live facts stream.
  bool should_replay = 2;
}

// RunEventFields contains the optional measurements carried by a run event.
message RunEventFields {
  int64 records = 1;
  int64 bytes = 2;
  string uri = 3;
  uint32 crc = 4;
  string error = 5;
  int64 retry_after_ms = 6;
  int64 parents_total = 7;
  // Legacy bounded cursor payload. Continuous progress is read through GetRun;
  // continuous events do not carry raw customer cursors.
  google.protobuf.Struct checkpoint = 8;
}

// RunEvent is the event envelope forwarded by the run stream. event_type is the
// wire token (e.g. "written", "completed"). replay marks a snapshot-synthesized
// event rather than a live fact.
message RunEvent {
  string tenant_id = 1;
  string event_type = 2;
  string run_id = 3;
  string resource = 4;
  uint64 seq = 5;
  int64 created_at = 6;
  RunEventFields fields = 7;
  bool is_replay = 8;
}

message TailRunResponse {
  RunEvent event = 1;
}
