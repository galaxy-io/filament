syntax = "proto3";

package ingestion.v1;

import "google/protobuf/struct.proto";

// NotificationType identifies how a pipeline notification is delivered.
// Unspecified is an input sentinel and cannot be persisted.
enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  NOTIFICATION_TYPE_WEBHOOK = 1;
}

// NotifierEvent identifies an event kind a notifier can deliver. Unspecified is
// an input sentinel and cannot be persisted.
enum NotifierEvent {
  NOTIFIER_EVENT_UNSPECIFIED = 0;
  NOTIFIER_EVENT_RUN_STARTED = 1;
  NOTIFIER_EVENT_RUN_COMPLETED = 2;
  NOTIFIER_EVENT_RUN_FAILED = 3;
  NOTIFIER_EVENT_RUN_PARTIAL = 4;
  NOTIFIER_EVENT_RUN_CANCELED = 5;
  NOTIFIER_EVENT_RUN_PAUSED = 6;
}

// Notifier holds settings, plain config, and secret references, never secret
// values. Webhook config carries url; secret_refs carries headers.
message Notifier {
  string id = 1;
  string tenant_id = 2;
  string pipeline_id = 3;
  string name = 4;
  NotificationType notification_type = 5;
  bool is_enabled = 6;
  repeated NotifierEvent events = 7;
  repeated string resources = 8;
  google.protobuf.Struct config = 9;
  map<string, string> secret_refs = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
  int64 deleted_at = 13;
  string created_by_user_id = 14;
  string updated_by_user_id = 15;
  string deleted_by_user_id = 16;
}

// NotifierInput replaces the rule's settings. Secret fields in config are
// extracted and stored as secrets; on update, an omitted secret field keeps
// the reference echoed in secret_refs.
message NotifierInput {
  string name = 1;
  NotificationType notification_type = 2;
  bool is_enabled = 3;
  repeated NotifierEvent events = 4;
  repeated string resources = 5; // Empty matches any resource.
  google.protobuf.Struct config = 6;
  map<string, string> secret_refs = 7;
}

message CreatePipelineNotifierRequest {
  string pipeline_id = 1;
  NotifierInput notifier = 2;
}

message CreatePipelineNotifierResponse {
  Notifier notifier = 1;
}

message UpdatePipelineNotifierRequest {
  string pipeline_id = 1;
  string notifier_id = 2;
  NotifierInput notifier = 3;
}

message UpdatePipelineNotifierResponse {
  Notifier notifier = 1;
}

message ListPipelineNotifiersRequest {
  string pipeline_id = 1;
}

message ListPipelineNotifiersResponse {
  repeated Notifier notifiers = 1;
}

message DeletePipelineNotifierRequest {
  string pipeline_id = 1;
  string notifier_id = 2;
}

message DeletePipelineNotifierResponse {}
