syntax = "proto3";

package ingestion.v1;

import "google/protobuf/struct.proto";
import "ingestion/v1/common.proto";
import "ingestion/v1/pagination.proto";
import "ingestion/v1/sorting.proto";

// ConnectorSpec describes one registered source or sink connector.
message ConnectorSpec {
  string name = 1;
  string display_name = 2;
  ConnectorKind kind = 3;
  string version = 4;
  repeated ReplicationMode modes = 5;
  ConfigSchema config_schema = 6;
  string description = 7;
  string dark_logo_url = 8;
  string light_logo_url = 9;
  string schema_field = 10;
  ConnectorMaturity maturity = 11;
}

enum ConnectorMaturity {
  CONNECTOR_MATURITY_UNSPECIFIED = 0;
  CONNECTOR_MATURITY_ALPHA = 1;
  CONNECTOR_MATURITY_BETA = 2;
  CONNECTOR_MATURITY_STABLE = 3;
}

message ListConnectorsRequest {
  ConnectorKind kind = 1;
  PaginationRequest pagination = 2;
  string search = 3;
  SortingRequest sorting = 4;
}

message ListConnectorsResponse {
  repeated ConnectorSpec connectors = 1;
  PaginationResponse pagination = 2;
}

message GetConnectorRequest {
  string connector = 1;
  ConnectorKind kind = 2;
}

message GetConnectorResponse {
  ConnectorSpec connector = 1;
}

message ValidateConfigRequest {
  ConnectorKind kind = 1;
  string connector = 2;
  google.protobuf.Struct config = 3;
  string connection_id = 4;
}

message ValidationError {
  string field = 1;
  string message = 2;
}

message ValidateConfigResponse {
  bool valid = 1;
  repeated ValidationError errors = 2;
}

message DiscoverResourcesRequest {
  string connector = 1;
  google.protobuf.Struct config = 2;
  bool refresh = 3;
  string connection_id = 4;
}

message Resource {
  string name = 1;
  bool is_selectable = 2;
  repeated string primary_key = 3;
  string selector = 4;
  string display_name = 5;
  map<string, string> metadata = 6;
}

message DiscoverResourcesResponse {
  repeated Resource resources = 1;
}

message GetResourceColumnsRequest {
  string connector = 1;
  google.protobuf.Struct config = 2;
  string connection_id = 3;
  repeated string resources = 4;
}

message ResourceColumn {
  string name = 1;
  string logical_type = 2;
  string native_type = 3;
  bool is_nullable = 4;
  bool is_primary_key = 5;
  bool is_cursor_eligible = 6;
  bool is_cursor_recommended = 7;
  int32 recommendation_rank = 8;
  string warning = 9;
  bool is_configurable = 10;
  bool supports_lookback = 11;
}

message ResourceColumns {
  string resource = 1;
  repeated ResourceColumn columns = 2;
}

message GetResourceColumnsResponse {
  repeated ResourceColumns resources = 1;
}
