syntax = "proto3";

package ingestion.v1;

import "google/protobuf/struct.proto";
import "ingestion/v1/common.proto";
import "ingestion/v1/pagination.proto";
import "ingestion/v1/sorting.proto";

// ConnectorSpec describes one registered source or sink connector.
message ConnectorSpec {
  string name = 1;
  string display_name = 2;
  ConnectorKind kind = 3;
  string version = 4;
  repeated ReplicationMode modes = 5;
  ConfigSchema config_schema = 6;
  string description = 7;
  string dark_logo_url = 8;
  string light_logo_url = 9;
  string schema_field = 10;
  reserved 11;
  reserved "maturity";
  string api_version = 12;
  // Concrete registration selected by a source catalog alias; empty otherwise.
  string alias_target = 13;
  bool is_preview = 14;
  // Deprecated: read webhook.verifier.
  string webhook_verifier = 15 [deprecated = true];
  // Set for sources that receive provider webhooks.
  WebhookSpec webhook = 16;
}

// WebhookSpec describes how a source receives provider webhooks.
message WebhookSpec {
  // Verifier profile that authenticates deliveries, and its parameters.
  string verifier = 1;
  google.protobuf.Struct verifier_params = 2;
  // The endpoint configuration names the resources, rather than the source.
  bool dynamic_resources = 3;
  // Enum connection config field that chooses how a connection reads the
  // source: "api" (the default), "webhooks" or "both". Empty means every
  // connection of the source receives webhooks.
  string ingestion_field = 4;
  // Markdown instructions for configuring the sender.
  string setup = 5;
  // Resources the source reads from deliveries. Empty when
  // dynamic_resources is set and the endpoint names them.
  repeated string resources = 6;
  // How the receiver routes deliveries sent to the endpoint's single URL.
  // Saving an endpoint copies it.
  google.protobuf.Struct ingress = 7;
  // Webhook resources run continuously while the source's other resources
  // run bounded, so one pipeline holds both. The webhook route key then ends
  // in "/continuous".
  bool splits_execution = 8;
  // Deliveries may be sent to the endpoint's single URL and are routed to a
  // resource by their event type. Each resource keeps its own URL as well.
  bool routed = 9;
  // Who creates the signing secret. With PROVIDER the connection must be
  // given the provider's secret and Filament never mints one.
  WebhookSecretIssuer secret_issuer = 10;
}

// WebhookSecretIssuer says who creates a webhook's signing secret.
enum WebhookSecretIssuer {
  // Filament mints the secret.
  WEBHOOK_SECRET_ISSUER_UNSPECIFIED = 0;
  // Filament mints the secret and the user copies it into the sender.
  WEBHOOK_SECRET_ISSUER_FILAMENT = 1;
  // The provider creates the secret and the user copies it into Filament.
  WEBHOOK_SECRET_ISSUER_PROVIDER = 2;
}

message ListConnectorsRequest {
  ConnectorKind kind = 1;
  PaginationRequest pagination = 2;
  string search = 3;
  SortingRequest sorting = 4;
}

message ListConnectorsResponse {
  repeated ConnectorSpec connectors = 1;
  PaginationResponse pagination = 2;
}

message GetConnectorRequest {
  string connector = 1;
  ConnectorKind kind = 2;
}

message GetConnectorResponse {
  ConnectorSpec connector = 1;
}

message ValidateConfigRequest {
  ConnectorKind kind = 1;
  string connector = 2;
  google.protobuf.Struct config = 3;
  string connection_id = 4;
}

message ValidationError {
  string field = 1;
  string message = 2;
}

message ValidateConfigResponse {
  bool valid = 1;
  repeated ValidationError errors = 2;
}

message DiscoverResourcesRequest {
  string connector = 1;
  google.protobuf.Struct config = 2;
  bool refresh = 3;
  string connection_id = 4;
}

message Resource {
  string name = 1;
  bool is_selectable = 2;
  repeated string primary_key = 3;
  string selector = 4;
  string display_name = 5;
  map<string, string> metadata = 6;
}

message DiscoverResourcesResponse {
  repeated Resource resources = 1;
}

message GetResourceColumnsRequest {
  string connector = 1;
  google.protobuf.Struct config = 2;
  string connection_id = 3;
  repeated string resources = 4;
}

message ResourceColumn {
  string name = 1;
  string logical_type = 2;
  string native_type = 3;
  bool is_nullable = 4;
  bool is_primary_key = 5;
  bool is_cursor_eligible = 6;
  bool is_cursor_recommended = 7;
  int32 recommendation_rank = 8;
  string warning = 9;
  bool is_configurable = 10;
  bool supports_lookback = 11;
}

message ResourceColumns {
  string resource = 1;
  repeated ResourceColumn columns = 2;
  // Incremental state is owned by the source; no cursor column is required.
  bool managed_incremental = 3;
  // The source reads only the columns an edge selects.
  bool selectable_columns = 4;
  // The resource's partitions an edge may select; empty when it is not partitioned.
  repeated string partitions = 5;
}

message GetResourceColumnsResponse {
  repeated ResourceColumns resources = 1;
}
