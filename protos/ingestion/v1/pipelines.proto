syntax = "proto3";

package ingestion.v1;

import "google/protobuf/struct.proto";
import "ingestion/v1/common.proto";
import "ingestion/v1/pagination.proto";
import "ingestion/v1/runs.proto";
import "ingestion/v1/sorting.proto";

// PipelineNode is one source or sink on the canvas. connection_id references the
// reusable Connection that supplies the connector and connection-scoped config
// (host/bucket/credentials). config/secret_refs are the per-node PIPELINE-scoped
// overlay (prefix, path, target table) shallow-merged over the
// connection config at run time, with the node overlay winning on key conflicts.
message PipelineNode {
  string id = 1;
  ConnectorKind kind = 2;
  string connection_id = 3;
  google.protobuf.Struct config = 4; // PIPELINE overlay only
  map<string, string> secret_refs = 5; // PIPELINE overlay only
}

// PipelineEdge routes from a source node to a sink node. An empty resource routes
// all enabled resources; a named resource is an additive per-resource route.
// Standard connections carry a per-resource read mode and a destination-route
// write mode. All edges on the same source-to-destination route must use the
// same write mode. CDC connections carry no read lever and support append
// (default) or merge writes.
message PipelineEdge {
  string from_node = 1;
  string resource = 2;
  string to_node = 3;
  string selector = 4;
  // cursors contains durable-incremental overrides. An all-resource edge may
  // configure several resources; a resource-specific edge may configure only
  // its own resource. Omitted resources use connector auto-detection.
  repeated ResourceCursorConfig cursors = 5;
  ReadMode read_mode = 6;
  WriteMode write_mode = 7;
}

message ResourceCursorConfig {
  string resource = 1;
  string field = 2;
  int64 lookback_seconds = 3;
}

message PipelineGraph {
  repeated PipelineNode nodes = 1;
  repeated PipelineEdge edges = 2;
}

message PipelineVersion {
  string id = 1;
  int64 version = 2;
  int64 created_at = 3;
  PipelineGraph graph = 4;
  int64 updated_at = 5;
  string created_by_user_id = 6;
  string updated_by_user_id = 7;
  string deleted_by_user_id = 8;
}

// Pipeline is mutable metadata plus a pointer to its current graph version.
message Pipeline {
  string tenant_id = 1;
  string id = 2;
  string name = 3;
  string description = 4;
  PipelineVersion current_version = 5;
  repeated PipelineVersion versions = 6;
  RunInfo last_run = 7;
  PipelineSchedule schedule = 8;
  int64 created_at = 9;
  int64 deleted_at = 10;
  int64 updated_at = 11;
  string created_by_user_id = 12;
  string updated_by_user_id = 13;
  string deleted_by_user_id = 14;
  // worker_configuration shapes this pipeline's runs by default. It lives on
  // the pipeline rather than the version so editing it cannot mint a version
  // and orphan the resource checkpoints keyed by the old one.
  WorkerConfiguration worker_configuration = 15;
}

// PipelineScheduleConfig is the client-owned portion of a pipeline's schedule.
// Omit it when creating a pipeline that should only run manually.
enum PipelineScheduleOverlapPolicy {
  PIPELINE_SCHEDULE_OVERLAP_POLICY_UNSPECIFIED = 0;
  PIPELINE_SCHEDULE_OVERLAP_POLICY_SKIP = 1;
  PIPELINE_SCHEDULE_OVERLAP_POLICY_ALLOW = 2;
}

message PipelineScheduleConfig {
  string cron = 1;
  string timezone = 2;
  bool is_enabled = 3;
  PipelineScheduleOverlapPolicy overlap_policy = 4;
}

// PipelineSchedule includes the server-owned identity and derived fire times.
message PipelineSchedule {
  string id = 1;
  string pipeline_id = 2;
  PipelineScheduleConfig config = 3;
  int64 next_fire_at = 4;
  int64 last_fired_at = 5;
}

message CreatePipelineRequest {
  string name = 1;
  string description = 2;
  PipelineScheduleConfig schedule = 3;
  // worker_configuration shapes this pipeline's runs. Omit it to configure the
  // pipeline's workers later through UpdatePipeline.
  WorkerConfiguration worker_configuration = 4;
}

message CreatePipelineResponse {
  Pipeline pipeline = 1;
  PipelineSchedule schedule = 2;
}

message CreatePipelineScheduleRequest {
  string pipeline_id = 1;
  PipelineScheduleConfig schedule = 2;
}

message CreatePipelineScheduleResponse {
  PipelineSchedule schedule = 1;
}

message UpdatePipelineScheduleRequest {
  string pipeline_id = 1;
  PipelineScheduleConfig schedule = 2;
}

message UpdatePipelineScheduleResponse {
  PipelineSchedule schedule = 1;
}

message CreatePipelineVersionRequest {
  string pipeline_id = 1;
  PipelineGraph graph = 2;
}

message CreatePipelineVersionResponse {
  PipelineVersion version = 1;
}

message UpdatePipelineRequest {
  string pipeline_id = 1;
  string name = 2;
  string description = 3;
  WorkerConfiguration worker_configuration = 4;
}

message UpdatePipelineResponse {
  Pipeline pipeline = 1;
}

message GetPipelineRequest {
  string id = 1;
  bool include_versions = 2;
  bool include_last_run = 3;
  bool include_schedule = 4;
}

message GetPipelineResponse {
  Pipeline pipeline = 1;
}

message GetPipelineVersionRequest {
  string pipeline_id = 1;
  int64 version = 2;
}

message GetPipelineVersionResponse {
  PipelineVersion version = 1;
}

message ListPipelineVersionsRequest {
  string pipeline_id = 1;
  PaginationRequest pagination = 2;
  SortingRequest sorting = 3;
}

message ListPipelineVersionsResponse {
  repeated PipelineVersion versions = 1;
  PaginationResponse pagination = 2;
}

message ListPipelinesRequest {
  bool include_deleted = 1;
  PaginationRequest pagination = 2;
  bool include_versions = 3;
  bool include_last_run = 4;
  bool include_schedule = 5;
  string search = 6;
  SortingRequest sorting = 7;
}

message ListPipelinesResponse {
  repeated Pipeline pipelines = 1;
  PaginationResponse pagination = 2;
}

message DeletePipelineRequest {
  string id = 1;
}

message DeletePipelineResponse {}
