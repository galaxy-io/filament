syntax = "proto3";

package auth.v1;

import "auth/v1/members.proto";

// ServiceAccount is a non-human identity used by automation such as the
// filament CLI. Its client secret is never returned by list operations.
message ServiceAccount {
  string user_id = 1;
  string client_id = 2;
  string name = 3;
  string description = 4;
  Role role = 5;
}

message ListServiceAccountsRequest {}

message ListServiceAccountsResponse {
  repeated ServiceAccount service_accounts = 1;
  bool can_manage = 2;
}

message CreateServiceAccountRequest {
  string name = 1;
  string description = 2;
  Role role = 3;
}

// CreateServiceAccountResponse returns client_secret exactly once. Filament
// does not persist it and Zitadel cannot retrieve it again.
message CreateServiceAccountResponse {
  ServiceAccount service_account = 1;
  string client_secret = 2;
}

message RotateServiceAccountSecretRequest {
  string user_id = 1;
}

// RotateServiceAccountSecretResponse returns the replacement secret exactly
// once. The previous secret is invalid after rotation.
message RotateServiceAccountSecretResponse {
  string client_id = 1;
  string client_secret = 2;
}

message RemoveServiceAccountRequest {
  string user_id = 1;
}

message RemoveServiceAccountResponse {}
