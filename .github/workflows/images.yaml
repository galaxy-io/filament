name: "CI: Images"

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      tag:
        description: Image version tag
        required: true
        type: string
      publish:
        description: Push images to the registry
        required: false
        default: false
        type: boolean
      prerelease:
        description: Do not publish the latest image tag
        required: false
        default: false
        type: boolean

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: filament/server
            dockerfile: cmd/server/Dockerfile
            buildtags: "-tags embedui"
          - image: filament/control-plane
            dockerfile: cmd/control-plane/Dockerfile
          - image: filament/worker
            dockerfile: cmd/worker/Dockerfile
          - image: filament/standalone
            dockerfile: cmd/standalone/Dockerfile
            buildtags: "-tags embedui"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: cmd/go.sum

      - if: contains(matrix.buildtags, 'embedui')
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - if: contains(matrix.buildtags, 'embedui')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - if: contains(matrix.buildtags, 'embedui')
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - if: contains(matrix.buildtags, 'embedui')
        name: Build UI
        run: just ui-dist

      - name: Build
        env:
          GOWORK: off
          CGO_ENABLED: "0"
          GOOS: linux
        run: go build -C $(dirname ${{ matrix.dockerfile }}) ${{ matrix.buildtags }} -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/bin/${{ matrix.image }}" .

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=raw,value=latest,enable=${{ inputs.publish && !inputs.prerelease && !contains(inputs.tag, '-') }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - if: inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
