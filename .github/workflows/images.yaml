name: "CI: Images"

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: filament-server
            dockerfile: cmd/server/Dockerfile
            buildtags: "-tags embedui"
          - image: filament-control-plane
            dockerfile: cmd/control-plane/Dockerfile
          - image: filament-worker
            dockerfile: cmd/worker/Dockerfile
          - image: filament-standalone
            dockerfile: cmd/standalone/Dockerfile
            buildtags: "-tags embedui"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            cmd/server/go.sum
            cmd/control-plane/go.sum
            cmd/worker/go.sum
            cmd/standalone/go.sum

      - if: contains(matrix.buildtags, 'embedui')
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - if: contains(matrix.buildtags, 'embedui')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - if: contains(matrix.buildtags, 'embedui')
        name: Build UI
        run: cd ui && pnpm install && pnpm build

      - name: Build
        env:
          GOWORK: off
          CGO_ENABLED: "0"
          GOOS: linux
        run: go build -C $(dirname ${{ matrix.dockerfile }}) ${{ matrix.buildtags }} -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/bin/${{ matrix.image }}" .

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
