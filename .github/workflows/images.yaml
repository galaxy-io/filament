name: "CI: Images"

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      tag:
        description: Image version tag
        required: true
        type: string
      publish:
        description: Push images to the registry
        required: false
        default: false
        type: boolean
      prerelease:
        description: Do not publish the latest image tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: filament/server
            dockerfile: cmd/server/Dockerfile
            buildtags: "-tags embedui"
          - image: filament/control-plane
            dockerfile: cmd/control-plane/Dockerfile
          - image: filament/worker
            dockerfile: cmd/worker/Dockerfile
          - image: filament/standalone
            dockerfile: cmd/standalone/Dockerfile
            buildtags: "-tags embedui"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: cmd/go.sum

      - if: contains(matrix.buildtags, 'embedui')
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - if: contains(matrix.buildtags, 'embedui')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - if: contains(matrix.buildtags, 'embedui')
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - if: contains(matrix.buildtags, 'embedui')
        name: Build UI
        run: just ui-dist

      - name: Build
        env:
          GOWORK: off
          CGO_ENABLED: "0"
          GOOS: linux
        run: go build -C $(dirname ${{ matrix.dockerfile }}) ${{ matrix.buildtags }} -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/bin/${{ matrix.image }}" .

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=sha
            type=raw,value=latest,enable=${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish) && !inputs.prerelease && !contains(inputs.tag || github.ref_name, '-') }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
