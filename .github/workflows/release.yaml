name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Release Please creates the tag and the GitHub release; this builds
  # what the release ships.
  release:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ github.ref_name }}
      prerelease: ${{ contains(github.ref_name, '-') }}
    steps:
      - run: echo "Releasing ${GITHUB_REF_NAME}"

  images:
    needs: release
    uses: ./.github/workflows/images.yaml
    with:
      ref: ${{ needs.release.outputs.tag }}
      tag: ${{ needs.release.outputs.tag }}
      publish: true
      prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
    secrets: inherit

  cli:
    needs: release
    uses: ./.github/workflows/cli.yaml
    with:
      ref: ${{ needs.release.outputs.tag }}
      tag: ${{ needs.release.outputs.tag }}
      prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
    secrets: inherit

  # The chart tracks the platform through appVersion. Committing it as a fix
  # lets Release Please open the chart's release PR.
  chart-app-version:
    needs: [release, images, cli]
    if: needs.release.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.GX_NULL_APP_ID }}
          private-key: ${{ secrets.GX_NULL_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set appVersion
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          version="${TAG#v}" yq -i '.appVersion = strenv(version)' charts/filament/Chart.yaml
          git config user.name "gx-null[bot]"
          git config user.email "286761379+gx-null[bot]@users.noreply.github.com"
          git add charts/filament/Chart.yaml
          git diff --cached --quiet && exit 0
          git commit -m "fix(charts): appVersion ${TAG}"
          git push origin main
