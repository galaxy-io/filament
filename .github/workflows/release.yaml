name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Release Please creates the tag and the GitHub release; this builds
  # what the release ships. Prereleases are nightly-release.yaml's.
  release:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - run: echo "Releasing ${GITHUB_REF_NAME}"

  images:
    needs: release
    uses: ./.github/workflows/images.yaml
    with:
      ref: ${{ needs.release.outputs.tag }}
      tag: ${{ needs.release.outputs.tag }}
      publish: true
      prerelease: false
    secrets: inherit

  cli:
    needs: release
    uses: ./.github/workflows/cli.yaml
    with:
      ref: ${{ needs.release.outputs.tag }}
      tag: ${{ needs.release.outputs.tag }}
      prerelease: false
    secrets: inherit

  # After the images, so the chart never names a version that cannot be pulled.
  chart:
    needs: [release, images]
    uses: ./.github/workflows/chart.yaml

  # Last, so the announcement never names a version that cannot be installed.
  announce:
    needs: [release, images, cli, chart]
    runs-on: ubuntu-latest
    steps:
      - name: Announce to the community Slack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          WEBHOOK_URL: ${{ secrets.SLACK_COMMUNITY_WEBHOOK_URL }}
        run: |
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "SLACK_COMMUNITY_WEBHOOK_URL is not set"
            exit 1
          fi

          version="${TAG#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

          # Release Please emits GitHub Markdown; Slack wants mrkdwn.
          notes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' | sed -E \
            -e 's/^#{2,} +(.*)$/*\1*/' \
            -e 's/^\* /• /' \
            -e 's/\[([^][]*)\]\(([^()]*)\)/<\2|\1>/g' \
            -e 's/\*\*([^*]+)\*\*/*\1*/g' | cat -s)

          text=$(cat <<MESSAGE
          :rocket: *Filament ${TAG}* is out.

          ${notes}

          \`\`\`
          brew upgrade galaxy-io/tap/filament
          helm upgrade filament oci://ghcr.io/galaxy-io/charts/filament --version ${version}
          \`\`\`
          <${url}|Full release notes>
          MESSAGE
          )

          jq -n --arg text "$text" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK_URL"
