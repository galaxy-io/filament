# One-off live validation for filament PR #682 (Saloni's timestamp blocker):
# saved pipeline, --sync-mode incremental, run twice with a Jira issue edit
# between. Runs on a scratch branch in the fork; delete the branch and the
# JIRA_API_TOKEN secret after the validation.
name: jira-incr-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      JIRA_SITE: zebjutt12345
      JIRA_EMAIL: zebjutt12345@gmail.com
    steps:
      - name: Check out PR branch code
        uses: actions/checkout@v4
        with:
          ref: jira-source-connector

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Filament
        run: |
          go build -o filament ./cmd/filament
          go build -o filament-standalone ./cmd/standalone

      - name: Start local engine
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          ./filament up -d
          ./filament status

      - name: Create Jira source, stdout sink, pipeline
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          ./filament source create jira-test --source-connector jira@3 --source-site "$JIRA_SITE" --source-email "$JIRA_EMAIL" --source-api-token-env JIRA_API_TOKEN
          ./filament sink create stdout-out --sink-connector stdout
          ./filament pipeline create jira-incr-test --source jira-test --sink stdout-out --resources issues --sync-mode incremental --write-mode append

      - name: First incremental run
        run: |
          set -o pipefail
          ./filament run jira-incr-test 2>&1 | tee run1.log

      - name: Edit FT-3 in Jira (bump its updated timestamp)
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          labels=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" "https://$JIRA_SITE.atlassian.net/rest/api/3/issue/FT-3?fields=labels" | jq -c '.fields.labels')
          echo "current labels: $labels"
          new_labels=$(echo "$labels" | jq -c '. + ["incr-test-3"] | unique')
          curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -X PUT -H "Content-Type: application/json" -d "{\"fields\":{\"labels\":$new_labels}}" "https://$JIRA_SITE.atlassian.net/rest/api/3/issue/FT-3"
          echo "FT-3 labels updated"

      - name: Wait for Jira to register the edit
        run: sleep 20

      - name: Second incremental run
        run: |
          set -o pipefail
          ./filament run jira-incr-test 2>&1 | tee run2.log

      - name: Show run history
        run: ./filament run list jira-incr-test || true

      - name: Summarize issue keys per run
        run: |
          echo "--- run 1 issue keys ---"
          grep -o "FT-[0-9]*" run1.log | sort -u || true
          echo "--- run 2 issue keys ---"
          grep -o "FT-[0-9]*" run2.log | sort -u || true

      - name: Upload run logs
        uses: actions/upload-artifact@v4
        with:
          name: incr-runs
          path: |
            run1.log
            run2.log
