name: "CI: Lint"

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ui: ${{ steps.filter.outputs.ui }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            go:
              - "**.go"
              - "**/go.mod"
              - "**/go.sum"
              - ".golangci.yaml"
              - "justfile"
            ui:
              - "ui/**"
            chart:
              - "charts/**"

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ hashFiles('**/go.sum', '.golangci.yaml') }}-${{ github.run_id }}
          restore-keys: |
            golangci-${{ hashFiles('**/go.sum', '.golangci.yaml') }}-
            golangci-

      - name: Setup
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Lint
        run: just go-lint check

      - name: Format
        run: just go-format check

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install
        run: cd ui && pnpm install

      - name: Lint
        run: just ui-lint check

      - name: Format
        run: just ui-format check

      - name: Build
        run: just ui-dist

  chart:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.0

      - name: Dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add nats https://nats-io.github.io/k8s/helm/charts
          helm repo add zitadel https://charts.zitadel.com
          helm dependency build charts/filament

      - name: Lint
        run: helm lint charts/filament

      - name: Render
        run: |
          helm template filament charts/filament > /dev/null
          helm template filament charts/filament --set existingSecret=byo > /dev/null
          helm template filament charts/filament --set controlPlane.autoscaling.enabled=true --set server.autoscaling.enabled=true > /dev/null
          helm template filament charts/filament --set server.ingress.enabled=true --set "server.ingress.hosts[0]=filament.example.com" > /dev/null

      - name: Package
        run: helm package charts/filament --destination /tmp

      - name: Docs
        run: |
          curl -fsSL https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP" helm-docs
          "$RUNNER_TEMP/helm-docs" --chart-search-root charts/filament
          git diff --exit-code charts/filament/README.md

      - name: Check appVersion images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          app_version=$(yq -r '.appVersion' charts/filament/Chart.yaml)
          for image in server control-plane worker standalone; do
            crane digest "ghcr.io/${owner}/filament/${image}:${app_version}"
          done

  lint-ok:
    needs: [go, ui, chart]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Result
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
