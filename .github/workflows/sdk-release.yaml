name: "CD: SDK"

on:
  push:
    tags: ["filament-py-*", "filament-ts-*"]

permissions:
  contents: read

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  python:
    name: Publish Python SDK
    if: startsWith(github.ref_name, 'filament-py-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # PyPI trusted publishing: the workflow's OIDC identity is the credential.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Read Python SDK version
        id: version
        run: |
          version="$(uv version --project sdks/python --short)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        run: uv build --no-sources --project sdks/python --out-dir "$RUNNER_TEMP/sdk-dist"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-py-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/sdk-dist/
          if-no-files-found: error

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/sdk-dist/

  typescript:
    name: Publish TypeScript SDK
    if: startsWith(github.ref_name, 'filament-ts-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # npm trusted publishing: the workflow's OIDC identity is the credential.
      id-token: write
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      # Trusted publishing needs a newer npm than Node 22 ships.
      - run: npm install -g npm@latest

      - name: Read TypeScript SDK version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: |
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/sdk-dist"
          npm pack --pack-destination "$RUNNER_TEMP/sdk-dist"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-ts-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/sdk-dist/
          if-no-files-found: error

      - name: Publish to npm
        run: npm publish --access public
