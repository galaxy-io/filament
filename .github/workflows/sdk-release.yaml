name: "CD: SDK"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  python:
    name: Build Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"
          python-version: "3.12"

      - name: Read Python SDK version
        id: version
        run: |
          version="$(uv version --project sdks/python --short)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        run: uv build --no-sources --project sdks/python --out-dir "$RUNNER_TEMP/sdk-dist"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-py-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/sdk-dist/
          if-no-files-found: error

  typescript:
    name: Build TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Read TypeScript SDK version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: |
          npm ci
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP/sdk-dist"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filament-ts-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/sdk-dist/
          if-no-files-found: error
