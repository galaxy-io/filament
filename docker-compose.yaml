name: filament

services:
  postgres:
    image: postgres:16
    networks:
      - filament
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: filament
      POSTGRES_PASSWORD: filament
      POSTGRES_DB: filament
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filament -d filament"]
      interval: 2s
      timeout: 2s
      retries: 15

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    networks:
      - filament
    ports:
      - "4222:4222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz > /dev/null"]
      interval: 2s
      timeout: 2s
      retries: 15

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.17.0
    profiles: ["auth"]
    command: ["start-from-init", "--masterkey", "MasterkeyNeedsToHave32Characters", "--tlsMode", "disabled"]
    networks:
      - filament
    ports:
      - "8300:8080"
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: filament
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: filament
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8300
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: t1
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: Password1!
      # Machine user + PAT for filament's boot-time app provisioning; the PAT
      # lands in ./.zitadel, which the justfile reads into AUTH_PAT.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: filament-sa
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: filament-sa
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2100-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat
    volumes:
      - ./.zitadel:/machinekey
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy

networks:
  filament:

volumes:
  postgres-data:
  nats-data:
