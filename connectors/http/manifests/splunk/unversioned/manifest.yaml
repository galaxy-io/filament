version: 1
name: splunk
display_name: Splunk
description: Ingest log events and search results from Splunk Enterprise and Splunk Cloud.
dark_logo_url: https://cdn.getgalaxy.io/sources/source-icon-splunk-dark.svg
light_logo_url: https://cdn.getgalaxy.io/sources/source-icon-splunk-light.svg

config:
  host:
    type: string
    required: true
    help: Splunk Server Base URL (HTTPS required; e.g., https://localhost:8089)
  token:
    type: secret
    required: true
    help: Splunk API Token
  search_query:
    type: string
    required: true
    help: "SPL Search Query (e.g., search index=_internal)"

connection:
  base_url: "{{ config.host }}"
  auth:
    header:
      name: Authorization
      value: "Splunk {{ config.token }}"

defaults:
  response:
    error:
      path: messages
      when_present: true
      message_path: messages.0.text

resources:
  - name: events
    mode: export
    primary_key: [_cd, _time]

    incremental:
      cursor_field: _time
      start_param: earliest_time
      inject_into: body

    export:
      start:
        method: POST
        path: /services/search/jobs
        body:
          encoding: form
          template:
            search: "{{ config.search_query }}"
            output_mode: json
        capture:
          sid: $.sid

      wait:
        type: job
        request:
          method: GET
          path: /services/search/jobs/{{ job.sid }}
          query:
            output_mode: json
        state:
          path: $.entry[0].content.dispatchState
          pending: [QUEUED, PARSING, RUNNING, FINALIZING]
          ready: [DONE]
          failed: [FAILED, FAILED_PARSING]
        interval_seconds: 5
        timeout_seconds: 600

      result:
        url: "{{ config.host }}/services/search/jobs/{{ job.sid }}/results?output_mode=json&count=0"
        auth: connection
        format: json
        records_path: results

    fields:
      _cd: { path: _cd, type: string }
      _time: { path: _time, type: timestamptz }
      _raw: string
      host: string?
      source: string?
      sourcetype: string?
      index: string?
      raw: { path: $, type: json, mode: remainder }

discovery:
  mode: static