resources:
  - name: "deposits"
    path: "/v3/company/{{ config.realm_id }}/query"
    primary_key: ["realm_id", "id"]
    restart_on_resume: true
    omit_empty_query: true
    use_fields: [identity, entity, transaction]
    field_overrides:
      updated_at: {"path": "MetaData.LastUpdatedTime", "type": "timestamptz", "nullable": false}
    fields:
      deposit_to_account_id: {"path": "DepositToAccountRef.value", "type": "string", "nullable": true}
      deposit_to_account_name: {"path": "DepositToAccountRef.name", "type": "string", "nullable": true}
      cash_back: {"path": "CashBack", "type": "json", "nullable": true}
      global_tax_calculation: {"path": "GlobalTaxCalculation", "type": "string", "nullable": true}
      total_amt:
        path: "TotalAmt"
        type: "decimal"
        nullable: true
        precision: 38
        scale: 18
      home_total_amt:
        path: "HomeTotalAmt"
        type: "decimal"
        nullable: true
        precision: 38
        scale: 18
      raw: {"path": "$", "type": "json", "mode": "remainder"}
    query: {"query": "SELECT * FROM Deposit{{ state.updated_since | default \"\" }} ORDERBY Id ASC STARTPOSITION {{ state.offset }} MAXRESULTS {{ state.page_size }}"}
    response:
      records: "$.QueryResponse.Deposit"
      required_objects: ["QueryResponse"]
      strict_records: true
      empty_object: "QueryResponse"
      pagination:
        offset:
          offset: "state.offset"
          limit: "state.page_size"
          page_size: 500
          page_size_from: "page_size"
          start: 1
    incremental:
      cursor_field: "updated_at"
      checkpoint_key: "deposits.updated_at"
      start_param: "updated_since"
      inject_into: "state"
      initial: "1970-01-01T00:00:00Z"
      comparator: "time"
      overlap_seconds: 300
      value_prefix: " WHERE MetaData.LastUpdatedTime >= '"
      value_suffix: "'"
      commit_on_complete: true
