      job_info: {"path": "JobInfo", "type": "json", "nullable": true}
      tds_enabled: {"path": "TDSEnabled", "type": "bool", "nullable": true}
      secondary_tax_identifier: {"path": "SecondaryTaxIdentifier", "type": "string", "nullable": true}
      ar_account_id: {"path": "ARAccountRef.value", "type": "string", "nullable": true}
      ar_account_name: {"path": "ARAccountRef.name", "type": "string", "nullable": true}
      primary_tax_identifier: {"path": "PrimaryTaxIdentifier", "type": "string", "nullable": true}
      tax_exemption_reason_id: {"path": "TaxExemptionReasonId", "type": "string", "nullable": true}
      is_project: {"path": "IsProject", "type": "bool", "nullable": true}
      business_number: {"path": "BusinessNumber", "type": "string", "nullable": true}
      gstin: {"path": "GSTIN", "type": "string", "nullable": true}
      gst_registration_type: {"path": "GSTRegistrationType", "type": "string", "nullable": true}
      is_cis_contractor: {"path": "IsCISContractor", "type": "bool", "nullable": true}
      client_company_id: {"path": "ClientCompanyId", "type": "string", "nullable": true}
      client_entity_id: {"path": "ClientEntityId", "type": "string", "nullable": true}
      source: {"path": "Source", "type": "string", "nullable": true}
      tax_regime: {"path": "TaxRegime", "type": "string", "nullable": true}
      raw: {"path": "$", "type": "json", "mode": "remainder"}
    query: {"query": "SELECT * FROM Customer WHERE Active IN (true, false) ORDERBY Id ASC STARTPOSITION {{ state.offset }} MAXRESULTS {{ state.page_size }}"}
    response:
      records: "$.QueryResponse.Customer"
      required_objects: ["QueryResponse"]
      strict_records: true
      empty_object: "QueryResponse"
      pagination:
        offset:
          offset: "state.offset"
          limit: "state.page_size"
          page_size: 500
          page_size_from: "page_size"
          start: 1
