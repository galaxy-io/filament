      bill_addr_lat: {"path": "BillAddr.Lat", "type": "string", "nullable": true}
      bill_addr_long: {"path": "BillAddr.Long", "type": "string", "nullable": true}
      bill_addr_tag: {"path": "BillAddr.Tag", "type": "string", "nullable": true}
      bill_addr_note: {"path": "BillAddr.Note", "type": "string", "nullable": true}
      ship_addr_id: {"path": "ShipAddr.Id", "type": "string", "nullable": true}
      ship_addr_line1: {"path": "ShipAddr.Line1", "type": "string", "nullable": true}
