resources:
  - name: "exchange_rates"
    path: "/v3/company/{{ config.realm_id }}/exchangerate"
    primary_key: ["realm_id", "id"]
    restart_on_resume: true
    omit_empty_query: true
    use_fields: [identity, entity]
    field_overrides:
      id:
        type: "string"
        tuple: ["SourceCurrencyCode", "AsOfDate"]
    fields:
      source_currency_code: {"path": "SourceCurrencyCode", "type": "string", "nullable": false}
      target_currency_code: {"path": "TargetCurrencyCode", "type": "string", "nullable": true}
      rate:
        path: "Rate"
        type: "decimal"
        nullable: false
        precision: 38
        scale: 20
      as_of_date: {"path": "AsOfDate", "type": "date", "nullable": false}
      raw: {"path": "$", "type": "json", "mode": "remainder"}
    for_each_config: "exchange_rate_currencies"
    required_config: ["exchange_rate_currencies", "exchange_rate_date"]
    query: {"sourcecurrencycode": "{{ parent.exchange_rate_currencies }}", "asofdate": "{{ config.exchange_rate_date }}"}
    response: {"records": "$.ExchangeRate", "cardinality": "one", "pagination": "none", "strict_records": true}
