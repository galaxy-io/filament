resources:
  - name: "vendor_credits"
    path: "/v3/company/{{ config.realm_id }}/query"
    primary_key: ["realm_id", "id"]
    restart_on_resume: true
    omit_empty_query: true
    use_fields: [identity, entity, transaction, purchase_by_vendor]
    field_overrides:
      updated_at: {"path": "MetaData.LastUpdatedTime", "type": "timestamptz", "nullable": false}
    fields:
      vendor_addr_id: {"path": "VendorAddr.Id", "type": "string", "nullable": true}
      vendor_addr_line1: {"path": "VendorAddr.Line1", "type": "string", "nullable": true}
      vendor_addr_line2: {"path": "VendorAddr.Line2", "type": "string", "nullable": true}
      vendor_addr_line3: {"path": "VendorAddr.Line3", "type": "string", "nullable": true}
      vendor_addr_line4: {"path": "VendorAddr.Line4", "type": "string", "nullable": true}
      vendor_addr_line5: {"path": "VendorAddr.Line5", "type": "string", "nullable": true}
      vendor_addr_city: {"path": "VendorAddr.City", "type": "string", "nullable": true}
      vendor_addr_country: {"path": "VendorAddr.Country", "type": "string", "nullable": true}
      vendor_addr_country_code: {"path": "VendorAddr.CountryCode", "type": "string", "nullable": true}
      vendor_addr_county: {"path": "VendorAddr.County", "type": "string", "nullable": true}
      vendor_addr_country_sub_division_code: {"path": "VendorAddr.CountrySubDivisionCode", "type": "string", "nullable": true}
      vendor_addr_postal_code: {"path": "VendorAddr.PostalCode", "type": "string", "nullable": true}
      vendor_addr_postal_code_suffix: {"path": "VendorAddr.PostalCodeSuffix", "type": "string", "nullable": true}
      vendor_addr_lat: {"path": "VendorAddr.Lat", "type": "string", "nullable": true}
      vendor_addr_long: {"path": "VendorAddr.Long", "type": "string", "nullable": true}
      vendor_addr_tag: {"path": "VendorAddr.Tag", "type": "string", "nullable": true}
      vendor_addr_note: {"path": "VendorAddr.Note", "type": "string", "nullable": true}
      balance:
        path: "Balance"
        type: "decimal"
        nullable: true
        precision: 38
        scale: 18
      include_in_annual_tpar: {"path": "IncludeInAnnualTPAR", "type": "bool", "nullable": true}
      raw: {"path": "$", "type": "json", "mode": "remainder"}
    query: {"query": "SELECT * FROM VendorCredit{{ state.updated_since | default \"\" }} ORDERBY Id ASC STARTPOSITION {{ state.offset }} MAXRESULTS {{ state.page_size }}"}
    response:
      records: "$.QueryResponse.VendorCredit"
      required_objects: ["QueryResponse"]
      strict_records: true
      empty_object: "QueryResponse"
      pagination:
        offset:
          offset: "state.offset"
          limit: "state.page_size"
          page_size: 500
          page_size_from: "page_size"
          start: 1
    incremental:
      cursor_field: "updated_at"
      checkpoint_key: "vendor_credits.updated_at"
      start_param: "updated_since"
      inject_into: "state"
      initial: "1970-01-01T00:00:00Z"
      comparator: "time"
      overlap_seconds: 300
      value_prefix: " WHERE MetaData.LastUpdatedTime >= '"
      value_suffix: "'"
      commit_on_complete: true
