resources:
  - name: "budgets"
    path: "/v3/company/{{ config.realm_id }}/query"
    primary_key: ["realm_id", "id"]
    restart_on_resume: true
    omit_empty_query: true
    use_fields: [identity, entity]
    fields:
      name: {"path": "Name", "type": "string", "nullable": true}
      start_date: {"path": "StartDate", "type": "date", "nullable": true}
      end_date: {"path": "EndDate", "type": "date", "nullable": true}
      budget_type: {"path": "BudgetType", "type": "string", "nullable": true}
      budget_entry_type: {"path": "BudgetEntryType", "type": "string", "nullable": true}
      budget_detail: {"path": "BudgetDetail", "type": "json", "nullable": true}
      raw: {"path": "$", "type": "json", "mode": "remainder"}
    query: {"query": "SELECT * FROM Budget ORDERBY Id ASC STARTPOSITION {{ state.offset }} MAXRESULTS {{ state.page_size }}"}
    response:
      records: "$.QueryResponse.Budget"
      required_objects: ["QueryResponse"]
      strict_records: true
      empty_object: "QueryResponse"
      pagination:
        offset:
          offset: "state.offset"
          limit: "state.page_size"
          page_size: 500
          page_size_from: "page_size"
          start: 1
