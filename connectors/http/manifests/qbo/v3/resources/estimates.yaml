resources:
  - name: "estimates"
    path: "/v3/company/{{ config.realm_id }}/query"
    primary_key: ["realm_id", "id"]
    restart_on_resume: true
    omit_empty_query: true
    use_fields: [identity, entity, transaction, sales_transaction]
    field_overrides:
      updated_at: {"path": "MetaData.LastUpdatedTime", "type": "timestamptz", "nullable": false}
    fields:
      expiration_date: {"path": "ExpirationDate", "type": "date", "nullable": true}
      accepted_by: {"path": "AcceptedBy", "type": "string", "nullable": true}
      accepted_date: {"path": "AcceptedDate", "type": "date", "nullable": true}
      raw: {"path": "$", "type": "json", "mode": "remainder"}
    query: {"query": "SELECT * FROM Estimate{{ state.updated_since | default \"\" }} ORDERBY Id ASC STARTPOSITION {{ state.offset }} MAXRESULTS {{ state.page_size }}"}
    response:
      records: "$.QueryResponse.Estimate"
      required_objects: ["QueryResponse"]
      strict_records: true
      empty_object: "QueryResponse"
      pagination:
        offset:
          offset: "state.offset"
          limit: "state.page_size"
          page_size: 500
          page_size_from: "page_size"
          start: 1
    incremental:
      cursor_field: "updated_at"
      checkpoint_key: "estimates.updated_at"
      start_param: "updated_since"
      inject_into: "state"
      initial: "1970-01-01T00:00:00Z"
      comparator: "time"
      overlap_seconds: 300
      value_prefix: " WHERE MetaData.LastUpdatedTime >= '"
      value_suffix: "'"
      commit_on_complete: true
