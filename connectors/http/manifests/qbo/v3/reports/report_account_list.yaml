resources:
  - name: "report_account_list"
    path: "/v3/company/{{ config.realm_id }}/reports/AccountList"
    primary_key: ["realm_id", "id"]
    restart_on_resume: true
    omit_empty_query: true
    use_fields: [identity, report]
    field_overrides:
      id:
        type: "string"
        tuple: ["literal:AccountList", "Header.StartPeriod", "Header.EndPeriod", "Header.ReportBasis", "Header.Currency", "query:"]
      header_report_name: {"path": "Header.ReportName", "type": "string", "nullable": false}
    fields:
      raw: {"path": "$", "type": "json", "mode": "remainder"}
    query: {}
    response:
      records: "$"
      cardinality: "one"
      pagination: "none"
      strict_records: true
      required_objects: ["Header", "Columns", "Rows"]
