version: 1
name: intercom
display_name: Intercom
description: Customer service platform that combines an AI agent, a shared inbox, and in-app messaging so support teams can answer customers across chat, email, and other channels.
dark_logo_url: https://cdn.getgalaxy.io/sources/source-icon-intercom-dark.svg
light_logo_url: https://cdn.getgalaxy.io/sources/source-icon-intercom-light.svg
api_version: "2.18"
config:
  access_token:
    type: secret
    required: true
    help: Access token from your Intercom app in the Developer Hub (Configure > Authentication).
  region:
    type: enum
    enum: [us, eu, au]
    default: us
    help: Region where your Intercom workspace is hosted.
defaults:
  method: GET
field_sets:
  # Intercom renders every timestamp as integer Unix seconds. The engine reads
  # numeric timestamptz values as epoch seconds.
  lifecycle:
    created_at: timestamptz?
    updated_at: timestamptz?
connection:
  base_url: https://api.intercom.io
  base_url_field: region
  base_urls:
    us: https://api.intercom.io
    eu: https://api.eu.intercom.io
    au: https://api.au.intercom.io
  auth:
    bearer: config.access_token
  headers:
    Accept: application/json
    # Quoted: an unquoted 2.10-style version would decode as a float.
    Intercom-Version: "2.18"
  timeout_seconds: 60
  # Private apps share 10,000 calls per minute per workspace, enforced in
  # 10-second windows. X-RateLimit-Reset is a Unix timestamp.
  rate_limit:
    requests_per_second: 10
    dynamic:
      remaining_header: X-RateLimit-Remaining
      reset_header: X-RateLimit-Reset
      reset_format: unix_seconds
      min_floor_rps: 1
resources:
  # First top-level resource, so it doubles as the connection probe.
  - name: admins
    path: /admins
    response:
      records: $.admins
      pagination: none
    primary_key: [id]
    fields:
      id: string
      name: string?
      email: string?
      job_title: string?
      away_mode_enabled: bool?
      away_mode_reassign: bool?
      away_status_reason_id: string?
      has_inbox_seat: bool?
      team_ids: json?
      role: json?
      raw: {path: $, type: json, mode: remainder}

  - name: contacts
    path: /contacts
    query:
      per_page: "150"
      escape_identity: "false"
    response:
      records: $.data
      pagination:
        cursor:
          response: pages.next.starting_after
          request: query.starting_after
          null_terminates: true
    primary_key: [id]
    use_fields: [lifecycle]
    fields:
      id: string
      external_id: string?
      workspace_id: string?
      role: string?
      email: string?
      email_domain: string?
      phone: string?
      name: string?
      owner_id: string?
      signed_up_at: timestamptz?
      last_seen_at: timestamptz?
      last_replied_at: timestamptz?
      last_contacted_at: timestamptz?
      last_email_opened_at: timestamptz?
      last_email_clicked_at: timestamptz?
      unsubscribed_from_emails: bool?
      custom_attributes: json?
      location: json?
      tags: json?
      companies: json?
      raw: {path: $, type: json, mode: remainder}

  - name: conversations
    path: /conversations
    query:
      per_page: "150"
    response:
      records: $.conversations
      pagination:
        cursor:
          response: pages.next.starting_after
          request: query.starting_after
          null_terminates: true
    primary_key: [id]
    use_fields: [lifecycle]
    fields:
      id: string
      title: string?
      state: string?
      open: bool?
      read: bool?
      priority: string?
      waiting_since: timestamptz?
      snoozed_until: timestamptz?
      admin_assignee_id: string?
      team_assignee_id: string?
      source: json?
      contacts: json?
      teammates: json?
      tags: json?
      custom_attributes: json?
      statistics: json?
      sla_applied: json?
      conversation_rating: json?
      raw: {path: $, type: json, mode: remainder}

  - name: tags
    path: /tags
    response:
      records: $.data
      pagination: none
    primary_key: [id]
    fields:
      id: string
      name: string?
      raw: {path: $, type: json, mode: remainder}

  - name: teams
    path: /teams
    response:
      records: $.teams
      pagination: none
    primary_key: [id]
    fields:
      id: string
      name: string?
      admin_ids: json?
      raw: {path: $, type: json, mode: remainder}

  - name: segments
    path: /segments
    response:
      records: $.segments
      pagination: none
    primary_key: [id]
    use_fields: [lifecycle]
    fields:
      id: string
      name: string?
      person_type: string?
      raw: {path: $, type: json, mode: remainder}

  - name: company_segments
    path: /segments
    query:
      type: company
    response:
      records: $.segments
      pagination: none
    primary_key: [id]
    use_fields: [lifecycle]
    fields:
      id: string
      name: string?
      person_type: string?
      raw: {path: $, type: json, mode: remainder}

  - name: data_attributes
    path: /data_attributes
    query:
      include_archived: "true"
    response:
      records: $.data
      pagination: none
    # Built-in attributes have no id; only custom attributes do.
    primary_key: [model, full_name]
    use_fields: [lifecycle]
    fields:
      id: string?
      model: string
      name: string?
      full_name: string
      label: string?
      data_type: string?
      custom: bool?
      archived: bool?
      raw: {path: $, type: json, mode: remainder}

  - name: ticket_types
    path: /ticket_types
    response:
      records: $.data
      pagination: none
    primary_key: [id]
    use_fields: [lifecycle]
    fields:
      id: string
      name: string?
      category: string?
      archived: bool?
      ticket_type_attributes: json?
      ticket_states: json?
      raw: {path: $, type: json, mode: remainder}

  - name: ticket_states
    path: /ticket_states
    response:
      records: $.data
      pagination: none
    primary_key: [id]
    fields:
      id: string
      category: string?
      internal_label: string?
      external_label: string?
      archived: bool?
      raw: {path: $, type: json, mode: remainder}
discovery:
  mode: static
  default_resources: [admins, contacts, conversations, tags, teams, segments]
