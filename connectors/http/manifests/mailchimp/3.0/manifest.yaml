version: 1
name: mailchimp
display_name: Mailchimp
description: Email marketing and automation platform for building customer relationships through targeted campaigns, using the Mailchimp Marketing API.
api_version: "3.0"
dark_logo_url: https://cdn.getgalaxy.io/sources/source-icon-mailchimp-dark.svg
light_logo_url: https://cdn.getgalaxy.io/sources/source-icon-mailchimp-light.svg
config:
  auth_method:
    type: enum
    enum: [api_key, oauth_access_token]
    enum_labels:
      api_key: API Key
      oauth_access_token: OAuth Access Token
    default: api_key
    help: Choose an API key or an OAuth access token obtained through external authorization.
  access_token:
    type: secret
    required: true
    visible_when: {field: auth_method, values: [oauth_access_token]}
    help: Mailchimp OAuth access token, without the Bearer prefix. Valid until revoked; no refresh token is required.
  api_key:
    visible_when: {field: auth_method, values: [api_key]}
    type: secret
    required: true
    help: Mailchimp Marketing API key. Access follows the user who created the key.
  server:
    type: string
    required: true
    help: Account data center prefix, such as us6. Use the API key suffix or the dc value from OAuth metadata.
connection:
  base_url: "https://{{ config.server }}.api.mailchimp.com"
  auth:
    select:
      field: auth_method
      cases:
        api_key:
          required: [api_key]
          auth: {bearer: config.api_key}
        oauth_access_token:
          required: [access_token]
          auth: {bearer: config.access_token}
  headers: {Accept: application/json}
  timeout_seconds: 120
defaults:
  method: GET
resources:
  - name: account
    path: /3.0/
    response:
      records: $
      cardinality: one
      pagination: none
    primary_key: [account_id]
    fields:
      account_id: string
      account_name: string?
      email: string?
      role: string?
      pricing_plan_type: string?
      total_subscribers: int64?
      raw: {path: $, type: json, mode: remainder}

  - name: lists
    path: /3.0/lists
    capture: {list_id: id}
    response:
      records: $.lists
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [id]
    fields:
      id: string
      name: string?
      date_created: string?
      contact: json?
      campaign_defaults: json?
      stats: json?
      double_optin: bool?
      raw: {path: $, type: json, mode: remainder}

  - name: members
    path: /3.0/lists/{list_id}/members
    for_each: lists
    parent: {concurrency: 2}
    params: {list_id: parent.list_id}
    query: {sort_field: last_changed, sort_dir: ASC}
    response:
      records: $.members
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    incremental:
      cursor_field: last_changed
      start_param: since_last_changed
      inject_into: query
      comparator: time
      checkpoint_key: members_last_changed
      overlap_seconds: 60
    primary_key: [list_id, id]
    fields:
      list_id: {path: parent.list_id, type: string}
      id: string
      email_address: string?
      full_name: string?
      contact_id: string?
      status: string?
      email_type: string?
      last_changed: timestamptz
      merge_fields: json?
      interests: json?
      tags: json?
      stats: json?
      marketing_permissions: json?
      raw: {path: $, type: json, mode: remainder}

  # Keep detail parents independent of the incremental member selection.
  - name: member_index
    path: /3.0/lists/{list_id}/members
    for_each: lists
    parent: {concurrency: 2}
    params: {list_id: parent.list_id}
    query: {fields: "members.id,total_items"}
    capture_only: true
    capture: {list_id: parent.list_id, subscriber_hash: id}
    response:
      records: $.members
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [list_id, id]
    fields:
      list_id: {path: parent.list_id, type: string}
      id: string

  - name: member_tags
    path: /3.0/lists/{list_id}/members/{subscriber_hash}/tags
    for_each: member_index
    parent: {concurrency: 2}
    params: {list_id: parent.list_id, subscriber_hash: parent.subscriber_hash}
    response:
      records: $.tags
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [list_id, subscriber_hash, id]
    fields:
      list_id: {path: parent.list_id, type: string}
      subscriber_hash: {path: parent.subscriber_hash, type: string}
      id: string
      name: string?
      date_added: string?
      raw: {path: $, type: json, mode: remainder}

  - name: member_notes
    path: /3.0/lists/{list_id}/members/{subscriber_hash}/notes
    for_each: member_index
    parent: {concurrency: 2}
    params: {list_id: parent.list_id, subscriber_hash: parent.subscriber_hash}
    response:
      records: $.notes
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [list_id, subscriber_hash, id]
    fields:
      list_id: {path: parent.list_id, type: string}
      subscriber_hash: {path: parent.subscriber_hash, type: string}
      id: string
      created_at: string?
      created_by: string?
      updated_at: string?
      note: string?
      email_id: string?
      contact_id: string?
      raw: {path: $, type: json, mode: remainder}

  - name: member_events
    path: /3.0/lists/{list_id}/members/{subscriber_hash}/events
    for_each: member_index
    parent: {concurrency: 2}
    params: {list_id: parent.list_id, subscriber_hash: parent.subscriber_hash}
    response:
      records: $.events
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: []
    fields:
      list_id: {path: parent.list_id, type: string}
      subscriber_hash: {path: parent.subscriber_hash, type: string}
      occurred_at: string?
      name: string?
      properties: json?
      raw: {path: $, type: json, mode: remainder}

  - name: member_activity
    path: /3.0/lists/{list_id}/members/{subscriber_hash}/activity
    for_each: member_index
    parent: {concurrency: 2}
    params: {list_id: parent.list_id, subscriber_hash: parent.subscriber_hash}
    response:
      records: $.activity
      pagination: none
    primary_key: []
    fields:
      list_id: {path: parent.list_id, type: string}
      subscriber_hash: {path: parent.subscriber_hash, type: string}
      action: string?
      timestamp: string?
      url: string?
      type: string?
      campaign_id: string?
      title: string?
      parent_campaign: string?
      raw: {path: $, type: json, mode: remainder}

  - name: member_activity_feed
    path: /3.0/lists/{list_id}/members/{subscriber_hash}/activity-feed
    for_each: member_index
    parent: {concurrency: 2}
    params: {list_id: parent.list_id, subscriber_hash: parent.subscriber_hash}
    response:
      records: $.activity
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: []
    fields:
      list_id: {path: parent.list_id, type: string}
      subscriber_hash: {path: parent.subscriber_hash, type: string}
      raw: {path: $, type: json, mode: remainder}

  - name: merge_fields
    path: /3.0/lists/{list_id}/merge-fields
    for_each: lists
    parent: {concurrency: 2}
    params: {list_id: parent.list_id}
    response:
      records: $.merge_fields
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [list_id, merge_id]
    fields:
      list_id: {path: parent.list_id, type: string}
      merge_id: string
      tag: string?
      name: string?
      type: string?
      required: bool?
      default_value: string?
      public: bool?
      display_order: int64?
      options: json?
      help_text: string?
      total_items: int64?
      merge_field_limit: int64?
      raw: {path: $, type: json, mode: remainder}

  - name: segments
    path: /3.0/lists/{list_id}/segments
    for_each: lists
    parent: {concurrency: 2}
    params: {list_id: parent.list_id}
    capture: {list_id: parent.list_id, segment_id: id}
    response:
      records: $.segments
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [list_id, id]
    fields:
      list_id: {path: parent.list_id, type: string}
      id: string
      name: string?
      member_count: int64?
      type: string?
      created_at: string?
      updated_at: string?
      options: json?
      raw: {path: $, type: json, mode: remainder}

  - name: interest_categories
    path: /3.0/lists/{list_id}/interest-categories
    for_each: lists
    parent: {concurrency: 2}
    params: {list_id: parent.list_id}
    capture: {list_id: parent.list_id, interest_category_id: id}
    response:
      records: $.categories
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [list_id, id]
    fields:
      list_id: {path: parent.list_id, type: string}
      id: string
      title: string?
      display_order: int64?
      type: string?
      raw: {path: $, type: json, mode: remainder}

  - name: list_growth_history
    path: /3.0/lists/{list_id}/growth-history
    for_each: lists
    parent: {concurrency: 2}
    params: {list_id: parent.list_id}
    response:
      records: $.history
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [list_id, month]
    fields:
      list_id: {path: parent.list_id, type: string}
      month: string
      existing: int64?
      imports: int64?
      optins: int64?
      subscribed: int64?
      unsubscribed: int64?
      reconfirm: int64?
      cleaned: int64?
      pending: int64?
      deleted: int64?
      transactional: int64?
      raw: {path: $, type: json, mode: remainder}

  - name: list_activity
    path: /3.0/lists/{list_id}/activity
    for_each: lists
    parent: {concurrency: 2}
    params: {list_id: parent.list_id}
    response:
      records: $.activity
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [list_id, day]
    fields:
      list_id: {path: parent.list_id, type: string}
      day: string
      emails_sent: int64?
      unique_opens: int64?
      recipient_clicks: int64?
      hard_bounce: int64?
      soft_bounce: int64?
      subs: int64?
      unsubs: int64?
      other_adds: int64?
      other_removes: int64?
      raw: {path: $, type: json, mode: remainder}

  - name: list_clients
    path: /3.0/lists/{list_id}/clients
    for_each: lists
    parent: {concurrency: 2}
    params: {list_id: parent.list_id}
    response:
      records: $.clients
      pagination: none
    primary_key: [list_id, client]
    fields:
      list_id: {path: parent.list_id, type: string}
      client: string
      members: int64?
      raw: {path: $, type: json, mode: remainder}

  - name: list_locations
    path: /3.0/lists/{list_id}/locations
    for_each: lists
    parent: {concurrency: 2}
    params: {list_id: parent.list_id}
    response:
      records: $.locations
      pagination: none
    primary_key: [list_id, cc]
    fields:
      list_id: {path: parent.list_id, type: string}
      country: string?
      cc: string
      percent: float64?
      total: int64?
      raw: {path: $, type: json, mode: remainder}

  - name: list_abuse_reports
    path: /3.0/lists/{list_id}/abuse-reports
    for_each: lists
    parent: {concurrency: 2}
    params: {list_id: parent.list_id}
    response:
      records: $.abuse_reports
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [list_id, id]
    fields:
      list_id: {path: parent.list_id, type: string}
      id: string
      campaign_id: string?
      email_id: string?
      email_address: string?
      merge_fields: json?
      vip: bool?
      date: string?
      raw: {path: $, type: json, mode: remainder}

  - name: list_webhooks
    path: /3.0/lists/{list_id}/webhooks
    for_each: lists
    parent: {concurrency: 2}
    params: {list_id: parent.list_id}
    response:
      records: $.webhooks
      pagination: none
    primary_key: [list_id, id]
    fields:
      list_id: {path: parent.list_id, type: string}
      id: string
      url: string?
      events: json?
      sources: json?
      raw: {path: $, type: json, mode: remainder}

  - name: signup_forms
    path: /3.0/lists/{list_id}/signup-forms
    for_each: lists
    parent: {concurrency: 2}
    params: {list_id: parent.list_id}
    response:
      records: $.signup_forms
      pagination: none
    primary_key: []
    fields:
      list_id: {path: parent.list_id, type: string}
      header: json?
      contents: json?
      styles: json?
      signup_form_url: string?
      raw: {path: $, type: json, mode: remainder}

  - name: segment_members
    path: /3.0/lists/{list_id}/segments/{segment_id}/members
    for_each: segments
    parent: {concurrency: 2}
    params: {list_id: parent.list_id, segment_id: parent.segment_id}
    query: {include_cleaned: "true", include_transactional: "true", include_unsubscribed: "true"}
    response:
      records: $.members
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [list_id, segment_id, id]
    fields:
      list_id: {path: parent.list_id, type: string}
      segment_id: {path: parent.segment_id, type: string}
      id: string
      email_address: string?
      full_name: string?
      unique_email_id: string?
      email_type: string?
      status: string?
      merge_fields: json?
      interests: json?
      stats: json?
      ip_signup: string?
      timestamp_signup: string?
      ip_opt: string?
      timestamp_opt: string?
      member_rating: int64?
      last_changed: string?
      language: string?
      vip: bool?
      email_client: string?
      location: json?
      last_note: json?
      raw: {path: $, type: json, mode: remainder}

  - name: interests
    path: /3.0/lists/{list_id}/interest-categories/{interest_category_id}/interests
    for_each: interest_categories
    parent: {concurrency: 2}
    params: {list_id: parent.list_id, interest_category_id: parent.interest_category_id}
    response:
      records: $.interests
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [list_id, interest_category_id, id]
    fields:
      list_id: {path: parent.list_id, type: string}
      interest_category_id: {path: parent.interest_category_id, type: string}
      category_id: string?
      id: string
      name: string?
      subscriber_count: string?
      display_order: int64?
      raw: {path: $, type: json, mode: remainder}

  - name: campaigns
    path: /3.0/campaigns
    capture: {campaign_id: id}
    response:
      records: $.campaigns
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [id]
    fields:
      id: string
      type: string?
      status: string?
      create_time: string?
      send_time: string?
      emails_sent: int64?
      recipients: json?
      settings: json?
      tracking: json?
      report_summary: json?
      raw: {path: $, type: json, mode: remainder}

  - name: campaign_content
    path: /3.0/campaigns/{campaign_id}/content
    for_each: campaigns
    parent: {concurrency: 2}
    params: {campaign_id: parent.campaign_id}
    response:
      records: $
      cardinality: one
      pagination: none
    primary_key: [campaign_id]
    fields:
      campaign_id: {path: parent.campaign_id, type: string}
      variate_contents: json?
      plain_text: string?
      html: string?
      archive_html: string?
      raw: {path: $, type: json, mode: remainder}

  - name: campaign_feedback
    path: /3.0/campaigns/{campaign_id}/feedback
    for_each: campaigns
    parent: {concurrency: 2}
    params: {campaign_id: parent.campaign_id}
    response:
      records: $.feedback
      pagination: none
    primary_key: [campaign_id, feedback_id]
    fields:
      campaign_id: {path: parent.campaign_id, type: string}
      feedback_id: string
      parent_id: int64?
      block_id: int64?
      message: string?
      is_complete: bool?
      created_by: string?
      created_at: string?
      updated_at: string?
      source: string?
      raw: {path: $, type: json, mode: remainder}

  - name: campaign_folders
    path: /3.0/campaign-folders
    response:
