  - name: report_clicks
    path: /3.0/reports/{campaign_id}/click-details
    for_each: reports
    parent: {concurrency: 2}
    params: {campaign_id: parent.campaign_id}
    capture: {campaign_id: parent.campaign_id, link_id: id}
    response:
      records: $.urls_clicked
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [campaign_id, id]
    fields:
      campaign_id: {path: parent.campaign_id, type: string}
      id: string
      url: string?
      total_clicks: int64?
      click_percentage: float64?
      unique_clicks: int64?
      unique_click_percentage: float64?
      last_click: string?
      ab_split: json?
      raw: {path: $, type: json, mode: remainder}

  - name: report_opens
    path: /3.0/reports/{campaign_id}/open-details
    for_each: reports
    parent: {concurrency: 2}
    params: {campaign_id: parent.campaign_id}
    response:
      records: $.members
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [campaign_id, email_id]
    fields:
      campaign_id: {path: parent.campaign_id, type: string}
      list_id: string?
      list_is_active: bool?
      contact_status: string?
      email_id: string
      email_address: string?
      merge_fields: json?
      vip: bool?
      opens_count: int64?
      proxy_excluded_opens_count: int64?
      opens: json?
      raw: {path: $, type: json, mode: remainder}

  - name: report_email_activity
    path: /3.0/reports/{campaign_id}/email-activity
    for_each: reports
    parent: {concurrency: 2}
    params: {campaign_id: parent.campaign_id}
    response:
      records: $.emails
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [campaign_id, email_id]
    fields:
      campaign_id: {path: parent.campaign_id, type: string}
      list_id: string?
      list_is_active: bool?
      email_id: string
      email_address: string?
      activity: json?
      raw: {path: $, type: json, mode: remainder}

  - name: report_recipients
    path: /3.0/reports/{campaign_id}/sent-to
    for_each: reports
    parent: {concurrency: 2}
    params: {campaign_id: parent.campaign_id}
    response:
      records: $.sent_to
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [campaign_id, email_id]
    fields:
      campaign_id: {path: parent.campaign_id, type: string}
      email_id: string
      email_address: string?
      merge_fields: json?
      vip: bool?
      status: string?
      open_count: int64?
      last_open: string?
      absplit_group: string?
      gmt_offset: int64?
      list_id: string?
      list_is_active: bool?
      raw: {path: $, type: json, mode: remainder}

  - name: report_unsubscribes
    path: /3.0/reports/{campaign_id}/unsubscribed
    for_each: reports
    parent: {concurrency: 2}
    params: {campaign_id: parent.campaign_id}
    response:
      records: $.unsubscribes
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [campaign_id, email_id]
    fields:
      campaign_id: {path: parent.campaign_id, type: string}
      email_id: string
      email_address: string?
      merge_fields: json?
      vip: bool?
      timestamp: string?
      reason: string?
      list_id: string?
      list_is_active: bool?
      raw: {path: $, type: json, mode: remainder}

  - name: report_abuse
    path: /3.0/reports/{campaign_id}/abuse-reports
    for_each: reports
    parent: {concurrency: 2}
    params: {campaign_id: parent.campaign_id}
    response:
      records: $.abuse_reports
      pagination: none
    primary_key: [campaign_id, id]
    fields:
      campaign_id: {path: parent.campaign_id, type: string}
      id: string
      list_id: string?
      list_is_active: bool?
      email_id: string?
      email_address: string?
      merge_fields: json?
      vip: bool?
      date: string?
      raw: {path: $, type: json, mode: remainder}

  - name: report_domains
    path: /3.0/reports/{campaign_id}/domain-performance
    for_each: reports
    parent: {concurrency: 2}
    params: {campaign_id: parent.campaign_id}
    response:
      records: $.domains
      pagination: none
    primary_key: [campaign_id, domain]
    fields:
      campaign_id: {path: parent.campaign_id, type: string}
      domain: string
      emails_sent: int64?
      bounces: int64?
      opens: int64?
      clicks: int64?
      unsubs: int64?
      delivered: int64?
      emails_pct: float64?
      bounces_pct: float64?
      opens_pct: float64?
      clicks_pct: float64?
      unsubs_pct: float64?
      raw: {path: $, type: json, mode: remainder}

  - name: report_locations
    path: /3.0/reports/{campaign_id}/locations
    for_each: reports
    parent: {concurrency: 2}
    params: {campaign_id: parent.campaign_id}
    response:
      records: $.locations
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: []
    fields:
      campaign_id: {path: parent.campaign_id, type: string}
      country_code: string?
      region: string?
      region_name: string?
