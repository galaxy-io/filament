      forwards: json?
      opens: json?
      clicks: json?
      facebook_likes: json?
      industry_stats: json?
      list_stats: json?
      ab_split: json?
      timewarp: json?
      timeseries: json?
      share_report: json?
      ecommerce: json?
      delivery_status: json?
