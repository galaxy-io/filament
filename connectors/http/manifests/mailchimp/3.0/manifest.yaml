      id: string
      count: int64?
      raw: {path: $, type: json, mode: remainder}

  - name: reports
    path: /3.0/reports
    capture: {campaign_id: id}
    response:
      records: $.reports
      pagination: {offset: {offset: query.offset, limit: query.count, page_size: 100}}
    primary_key: [id]
    fields:
      id: string
      campaign_title: string?
      type: string?
      list_id: string?
      list_is_active: bool?
      list_name: string?
      subject_line: string?
      preview_text: string?
      emails_sent: int64?
      abuse_reports: int64?
      unsubscribed: int64?
      send_time: string?
      rss_last_send: string?
