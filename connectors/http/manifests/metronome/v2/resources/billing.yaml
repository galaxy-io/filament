resources:
  - name: invoices
    path: "/v1/customers/{customer_id}/invoices"
    method: GET
    for_each: customers
    params:
      customer_id: parent.customer_id
    query:
      limit: '50'
      skip_zero_qty_line_items: 'false'
      include_historical_commit_invoices: 'true'
    response:
      records: "$.data"
      pagination:
        cursor:
          response: next_page
          request: query.next_page
          null_terminates: true
    primary_key:
      - id
    fields:
      id: string
      customer_id: string?
      customer_custom_fields: json?
      netsuite_sales_order_id: string?
      salesforce_opportunity_id: string?
      net_payment_terms_days: decimal?
      credit_type: json?
      line_items: json?
      start_timestamp: timestamptz?
      end_timestamp: timestamptz?
      issued_at: timestamptz?
      created_at: timestamptz?
      status: string?
      total: decimal?
      type: string?
      external_invoice: json?
      revenue_system_invoices: json?
      contract_id: string?
      contract_custom_fields: json?
      amendment_id: string?
      correction_record: json?
      reseller_royalty: json?
      custom_fields: json?
      billable_status: json?
      constituent_invoices: json?
      payer: json?
      regenerated_from_invoice_id: string?
      raw:
        path: "$"
        type: json
        mode: remainder
  - name: invoice_breakdowns
    path: "/v1/customers/{customer_id}/invoices/breakdowns"
    method: GET
    for_each: customers
    params:
      customer_id: parent.customer_id
    query:
      limit: '50'
      starting_on: "{{ config.start_date }}T00:00:00Z"
      ending_before: "{{ config.end_date }}T00:00:00Z"
      window_size: day
      skip_zero_qty_line_items: 'false'
    required_config:
      - start_date
      - end_date
    response:
      records: "$.data"
      pagination:
        cursor:
          response: next_page
          request: query.next_page
          null_terminates: true
    primary_key: []
    fields:
      id: string?
      customer_id: string?
      customer_custom_fields: json?
      netsuite_sales_order_id: string?
      salesforce_opportunity_id: string?
      net_payment_terms_days: decimal?
      credit_type: json?
      line_items: json?
      start_timestamp: timestamptz?
      end_timestamp: timestamptz?
      issued_at: timestamptz?
      created_at: timestamptz?
      status: string?
      total: decimal?
      type: string?
      external_invoice: json?
      revenue_system_invoices: json?
      contract_id: string?
      contract_custom_fields: json?
      amendment_id: string?
      correction_record: json?
      reseller_royalty: json?
      custom_fields: json?
      billable_status: json?
      constituent_invoices: json?
      payer: json?
      regenerated_from_invoice_id: string?
      breakdown_start_timestamp: timestamptz?
      breakdown_end_timestamp: timestamptz?
      raw:
        path: "$"
        type: json
        mode: remainder
  - name: usage
    path: "/v1/usage"
    method: POST
    body:
      encoding: json
      template:
        starting_on: "{{ config.start_date }}T00:00:00Z"
        ending_before: "{{ config.end_date }}T00:00:00Z"
        window_size: day
    required_config:
      - start_date
      - end_date
    response:
      records: "$.data"
      pagination:
        cursor:
          response: next_page
          request: query.next_page
          null_terminates: true
    primary_key: []
    fields:
      customer_id: string?
      billable_metric_id: string?
      billable_metric_name: string?
      start_timestamp: timestamptz?
      end_timestamp: timestamptz?
      value: decimal?
      groups: json?
      raw:
        path: "$"
        type: json
        mode: remainder
  - name: rate_card_rate_schedules
    path: "/v1/contract-pricing/rate-cards/getRateSchedule"
    method: POST
    for_each: rate_cards
    query:
      limit: '50'
    body:
      encoding: json
      template:
        rate_card_id: "{{ parent.rate_card_id }}"
        starting_at: "2000-01-01T00:00:00Z"
    response:
      records: "$.data"
      pagination:
        cursor:
          response: next_page
          request: query.next_page
          null_terminates: true
    primary_key: []
    fields:
      product_id: string?
      product_name: string?
      product_tags: json?
      product_custom_fields: json?
      pricing_group_values: json?
      starting_at: timestamptz?
      ending_before: timestamptz?
      entitled: bool?
      rate: json?
      commit_rate: json?
      billing_frequency: string?
      rate_card_id:
        path: parent.rate_card_id
        type: string
      raw:
        path: "$"
        type: json
        mode: remainder
  - name: contract_rates
    path: "/v1/contracts/getContractRateSchedule"
    method: POST
    for_each: contracts
    query:
      limit: '50'
    body:
      encoding: json
      template:
        customer_id: "{{ parent.customer_id }}"
        contract_id: "{{ parent.contract_id }}"
    response:
      records: "$.data"
      pagination:
        cursor:
          response: next_page
          request: query.next_page
          null_terminates: true
    primary_key: []
    fields:
      rate_card_id: string?
      product_id: string?
      product_name: string?
      product_tags: json?
      product_custom_fields: json?
      starting_at: timestamptz?
      ending_before: timestamptz?
      entitled: bool?
      pricing_group_values: json?
      list_rate: json?
      override_rate: json?
      commit_rate: json?
      billing_frequency: string?
      customer_id:
        path: parent.customer_id
        type: string
      contract_id:
        path: parent.contract_id
        type: string
      raw:
        path: "$"
        type: json
        mode: remainder
  - name: _customer_pricing_units
    path: "/v1/credit-types/list"
    method: GET
    for_each: customers
    query:
      limit: '50'
    response:
      records: "$.data"
      pagination:
        cursor:
          response: next_page
          request: query.next_page
          null_terminates: true
    primary_key:
      - id
    fields:
      name: string?
      id: string
      is_currency: bool?
      raw:
        path: "$"
        type: json
        mode: remainder
    capture:
      credit_type_id: id
    capture_only: true
  - name: net_balances
    path: "/v1/contracts/customerBalances/getNetBalance"
    method: POST
    for_each: _customer_pricing_units
    body:
      encoding: json
      template:
        customer_id: "{{ parent.customer_id }}"
        credit_type_id: "{{ parent.credit_type_id }}"
    response:
      records: "$.data"
      cardinality: one
      pagination: none
    primary_key:
      - customer_id
      - credit_type_id
    fields:
      balance: decimal?
      credit_type_id: string
      customer_id:
        path: parent.customer_id
        type: string
      raw:
        path: "$"
        type: json
        mode: remainder
  - name: net_quantity_balances
    path: "/v1/contracts/customerBalances/getNetBalance"
    method: POST
    for_each: customers
    body:
      encoding: json
      template:
        customer_id: "{{ parent.customer_id }}"
        access_type: QUANTITY
    response:
      records: "$.data"
      cardinality: one
      pagination: none
    primary_key:
      - customer_id
    fields:
      balance: decimal?
      credit_type_id: string?
      customer_id:
        path: parent.customer_id
        type: string
      raw:
        path: "$"
        type: json
        mode: remainder
