  fields:
    id: string
    contract: json?
    type: string?
    name: string?
    priority: decimal?
    product: json?
    access_schedule: json?
    description: string?
    recurring_credit_id: string?
    subscription_config: json?
    applicable_product_ids: json?
    applicable_product_tags: json?
    specifiers: json?
    applicable_contract_ids: json?
    netsuite_sales_order_id: string?
    salesforce_opportunity_id: string?
    ledger: json?
    balance: decimal?
    custom_fields: json?
    rate_type: string?
    uniqueness_key: string?
    hierarchy_configuration: json?
    rolled_over_from: json?
    created_at: timestamptz?
    created_by: string?
    customer_id:
      path: parent.customer_id
      type: string
    raw:
      path: "$"
      type: json
      mode: remainder
- name: balances
  path: "/v1/contracts/customerBalances/list"
  method: POST
  for_each: customers
  body:
    encoding: json
    template:
