- name: seat_balances
  path: "/v1/contracts/seatBalances/list"
  method: POST
  for_each: contracts
  body:
    encoding: json
    template:
      customer_id: "{{ parent.customer_id }}"
      contract_id: "{{ parent.contract_id }}"
      include_credits_and_commits: true
      include_ledgers: true
      limit: 25
  response:
    records: "$.data"
    pagination:
      cursor:
        response: pagination.next_page
        request: body.cursor
        null_terminates: true
  primary_key:
  - customer_id
  - contract_id
  - seat_id
  fields:
    seat_id: string
    balances: json?
    commits: json?
    credits: json?
    customer_id:
      path: parent.customer_id
      type: string
    contract_id:
      path: parent.contract_id
      type: string
    raw:
      path: "$"
      type: json
      mode: remainder
- name: subscriptions
  path: "/v2/contracts/get"
  method: POST
  for_each: contracts
  body:
    encoding: json
    template:
      customer_id: "{{ parent.customer_id }}"
      contract_id: "{{ parent.contract_id }}"
  response:
    records: "$.data.subscriptions"
    pagination: none
  primary_key:
  - customer_id
  - contract_id
  - id
  fields:
    id: string
    subscription_rate: json?
    name: string?
    description: string?
    collection_schedule: string?
    proration: json?
    quantity_schedule: json?
    billing_periods: json?
    quantity_management_mode: string?
    seat_config: json?
    created_at: timestamptz?
    starting_at: timestamptz?
    ending_before: timestamptz?
    fiat_credit_type_id: string?
    custom_credit_type_id: string?
    billing_cycle_config: json?
    custom_fields: json?
    product_custom_fields: json?
    status: string?
    paid_quantity: decimal?
    payment_gate_config: json?
    customer_id:
      path: parent.customer_id
      type: string
    contract_id:
      path: parent.contract_id
      type: string
    raw:
      path: "$"
      type: json
      mode: remainder
  capture:
    subscription_id: id
- name: subscription_quantity_history
  path: "/v1/contracts/getSubscriptionQuantityHistory"
  method: POST
  for_each: subscriptions
  body:
    encoding: json
    template:
      customer_id: "{{ parent.customer_id }}"
      contract_id: "{{ parent.contract_id }}"
      subscription_id: "{{ parent.subscription_id }}"
  response:
    records: "$.data"
    cardinality: one
    pagination: none
  primary_key:
  - customer_id
  - contract_id
  - subscription_id
  fields:
    subscription_id:
      path: parent.subscription_id
      type: string
    fiat_credit_type_id: string?
    custom_credit_type_id: string?
    history: json?
    customer_id:
      path: parent.customer_id
      type: string
    contract_id:
      path: parent.contract_id
      type: string
    raw:
      path: "$"
      type: json
      mode: remainder
- name: subscription_seats_history
  path: "/v1/contracts/getSubscriptionSeatsHistory"
  method: POST
  for_each: subscriptions
  body:
    encoding: json
    template:
      customer_id: "{{ parent.customer_id }}"
      contract_id: "{{ parent.contract_id }}"
      subscription_id: "{{ parent.subscription_id }}"
      limit: 10
  response:
    records: "$.data"
    pagination:
      cursor:
        response: next_page
        request: body.cursor
        null_terminates: true
  primary_key: []
  fields:
    starting_at: timestamptz?
    ending_before: timestamptz?
    total_quantity: int64?
    assigned_seat_ids: json?
    customer_id:
      path: parent.customer_id
      type: string
    contract_id:
      path: parent.contract_id
      type: string
    subscription_id:
      path: parent.subscription_id
      type: string
    raw:
      path: "$"
      type: json
      mode: remainder
- name: packages
  path: "/v1/packages/list"
  method: POST
  query:
    limit: '50'
  body:
    encoding: json
    template:
      archive_filter: ALL
  response:
    records: "$.data"
    pagination:
      cursor:
        response: next_page
        request: query.next_page
        null_terminates: true
  primary_key:
  - id
  fields:
    id: string
    uniqueness_key: string?
    name: string?
    rate_card_id: string?
    aliases: json?
    duration: json?
    commits: json?
    credits: json?
    overrides: json?
    scheduled_charges: json?
    scheduled_charges_on_usage_invoices: string?
    created_at: timestamptz?
    created_by: string?
    net_payment_terms_days: decimal?
    usage_statement_schedule: json?
    multiplier_override_prioritization: string?
    billing_provider: string?
    delivery_method: string?
    recurring_commits: json?
    recurring_credits: json?
    spend_threshold_configuration: json?
    prepaid_balance_threshold_configuration: json?
    spend_trackers: json?
    subscriptions: json?
    contract_name: string?
    archived_at: timestamptz?
    raw:
      path: "$"
      type: json
      mode: remainder
  capture:
    package_id: id
- name: package_contracts
  path: "/v1/packages/listContractsOnPackage"
  method: POST
  for_each: packages
  query:
    limit: '50'
  body:
    encoding: json
    template:
      package_id: "{{ parent.package_id }}"
      include_archived: true
  response:
    records: "$.data"
    pagination:
      cursor:
        response: next_page
        request: query.next_page
        null_terminates: true
  primary_key:
  - package_id
  - customer_id
  - contract_id
  fields:
    customer_id: string
    contract_id: string
    starting_at: timestamptz?
    ending_before: timestamptz?
    archived_at: timestamptz?
    package_id:
      path: parent.package_id
      type: string
    raw:
      path: "$"
      type: json
      mode: remainder
