# Metronome Contracts v2 with shared v1 endpoints and optional legacy Plans reads.
# API contract https://api.metronome.com/v1/docs/openapi
version: 1
name: metronome
display_name: Metronome
description: Usage-based billing platform that meters product usage, manages pricing and contracts, and generates invoices for subscriptions and consumption.
dark_logo_url: https://cdn.getgalaxy.io/sources/source-icon-metronome-dark.svg
light_logo_url: https://cdn.getgalaxy.io/sources/source-icon-metronome-light.svg
api_version: v2
config:
  api_token:
    type: secret
    required: true
    help: Metronome API token from Developer > API tokens with read access to selected endpoints.
  customer_archived_states:
    type: enum
    enum:
      - false,true
      - 'false'
      - 'true'
    enum_labels:
      false,true: Active and archived
      'false': Active only
      'true': Archived only
    default: false,true
    help: Customer visibility for customers and customer-dependent resources.
  start_date:
    type: string
    scope: pipeline
    default: ''
    format: date
    help: Inclusive UTC start date for usage, invoice breakdowns, and legacy costs. Use YYYY-MM-DD.
    requires:
      - end_date
    before: end_date
  end_date:
    type: string
    scope: pipeline
    default: ''
    format: date
    help: Exclusive UTC end date for usage, invoice breakdowns, and legacy costs. Use YYYY-MM-DD.
    requires:
      - start_date
connection:
  base_url: https://api.metronome.com
  auth:
    bearer: config.api_token
  headers:
    Accept: application/json
  timeout_seconds: 60
includes:
  - resources/core.yaml
  - resources/contracts.yaml
  - resources/billing.yaml
  - resources/notifications.yaml
  - resources/administration.yaml
  - resources/optional.yaml
  - resources/legacy.yaml
  - resources/webhooks.yaml
# Metronome signs each delivery with HMAC-SHA256 over X-Metronome-Date, a
# newline and the body, sent as hex in Metronome-Webhook-Signature. The
# payload id names one triggered notification and stays the same on every
# delivery attempt, so it deduplicates retries. One destination receives every
# notification type, so deliveries are routed by the body's type. Metronome
# creates each webhook's signing secret, so the connection is given it.
# https://docs.metronome.com/guides/platform-configuration/webhooks/best-practices
# https://docs.metronome.com/guides/platform-configuration/webhooks/monitor-webhooks
webhook:
  verifier:
    profile: hmac
    params:
      signature: {header: Metronome-Webhook-Signature}
      timestamp: {header: X-Metronome-Date, format: http_date}
      signed: "{timestamp}\n{body}"
      delivery_id: {body: id}
  route:
    event: {body: type}
  secret: provider
  setup: |
    In Metronome, open **Developer** > **Notifications** > **Webhooks**, choose **Add** and set the URL to {{delivery_url}}.

    Metronome creates a signing secret for each webhook. Copy it into this connection's signing key. Each Metronome webhook has its own secret, so point one webhook at each connection, and use a separate connection for each Metronome environment.

    Every notification type the destination receives is routed by its type. System and offset notifications for contracts, commits, credits, subscriptions and voided invoices go to `system_notifications_webhook`. Threshold alerts, finalized invoices, billing provider and integration errors, marketplace and payment gating notifications go to `notifications_webhook`.

discovery:
  mode: static
  default_resources:
    - billable_metrics
    - customers
    - products
    - rate_cards
    - pricing_units
    - custom_field_keys
    - billing_providers
    - customer_billing_configurations
    - contracts
    - commits
    - credits
    - packages
    - invoices
