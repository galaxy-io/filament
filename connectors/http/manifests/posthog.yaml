    params: { project_id: config.project_id, survey_id: parent.survey_id }
    for_each: surveys
    query: { exclude_archived: "false" }
    pagination:
      offset: { offset: query.offset, limit: query.limit, page_size: 100 }
    primary_key: [survey_id, uuid]
    fields:
