version: 1
name: posthog
display_name: PostHog
description: People, groups, cohorts, feature flags, experiments, saved analytics, data definitions, surveys, notebooks, and replay metadata from PostHog.
dark_logo_url: https://cdn.getgalaxy.io/sources/source-icon-posthog-dark.svg
light_logo_url: https://cdn.getgalaxy.io/sources/source-icon-posthog-light.svg

config:
  api_key:
    type: secret
    required: true
    help: Personal API key from Settings > Personal API keys, with read scopes for the resources you sync.
  project_id:
    type: string
    required: true
    help: Project ID from Settings > Project > Project ID — the digits after /project/ in the app URL.
  host:
    type: string
    default: https://us.posthog.com
    help: PostHog host — https://us.posthog.com (US Cloud), https://eu.posthog.com (EU Cloud), or a self-hosted origin. Not the us.i.posthog.com ingestion host, which does not serve /api.
  session_recordings_start_date:
    type: string
    scope: pipeline
    help: Required when selecting session_recordings. Earliest recording timestamp to read, in ISO 8601 format (for example, your project creation date). No implicit three-day window.

connection:
  # Rendered once at Configure from config.host so US Cloud, EU Cloud and
  # self-hosted instances share one manifest.
  base_url: "{{ config.host }}"
  auth:
    bearer: config.api_key
  headers:
    Accept: application/json
  # Person and session-recording pages carry large embedded property blobs.
  timeout_seconds: 120
  # PostHog enforces a per-minute and a per-hour ceiling per endpoint class.
  # The binding one is the analytics hourly bucket — 1200/hour shared by
  # persons, insights and session_recordings — i.e. 0.333 rps
  # sustained. One limiter serves the whole run, so the tightest ceiling
  # governs; 0.3 rps is 1080/hour, leaving headroom for the connection probe
  # and retries, and never approaches the 240/min burst ceiling.
  #
  # Sizing against the hourly rather than the per-minute limit is deliberate:
  # draining an hourly bucket is a run failure, not a slowdown. Retry sleeps
  # are capped at maxRetryBackoff (60s) even when Retry-After says 3600, and
  # give up after maxRetries (10), so an hour-long window cannot be waited out.
  #
  # No `dynamic:` block — PostHog documents no X-RateLimit-* response headers.
  # It does send Retry-After on 429, which the engine already honours.
  rate_limit:
    requests_per_second: 0.3

defaults:
  method: GET
  query:
    limit: "100"
  # Most lists return results and an absolute next URL. Group types and
  # replay listings override this envelope below.
  response:
    records: $.results
    pagination:
      next_url: next

field_sets:
  # Preserve both useful author columns and the complete embedded object. The two
  # promoted scalars are what anyone groups by; the object is kept whole so
  # uuid, names and role survive. Promoting through a nullable path is safe —
  # descending into a null intermediate yields a path error, which a nullable
  # field absorbs.
  authorship:
    created_at: timestamptz?
    created_by_id: { path: created_by.id, type: int64, nullable: true }
    created_by_email: { path: created_by.email, type: string, nullable: true }
    created_by: json?

  feature_flag:
    id: int64
    key: string
    name: string?
    active: bool?
    archived: bool?
    deleted: bool?
    status: string?
    evaluation_runtime: string?
    version: int64?
    ensure_experience_continuity: bool?
    has_encrypted_payloads: bool?
    is_remote_configuration: bool?
    user_access_level: string?
    last_called_at: timestamptz?
    updated_at: timestamptz?
    last_modified_by: json?
    tags: json?
    filters: json?
    raw: { path: $, type: json, mode: remainder }

  experiment:
    id: int64
    name: string?
    description: string?
    type: string?
    status: string?
    conclusion: string?
    conclusion_comment: string?
    feature_flag_key: string?
    # Join key to feature_flags.id, lifted out of the embedded object.
    feature_flag_id: { path: feature_flag.id, type: int64, nullable: true }
    feature_flag: json?
    holdout: json?
    exposure_cohort: int64?
    parameters: json?
    start_date: timestamptz?
    end_date: timestamptz?
    updated_at: timestamptz?
    archived: bool?
    deleted: bool?
    is_legacy: bool?
    metrics: json?
    metrics_secondary: json?
    saved_metrics: json?
    raw: { path: $, type: json, mode: remainder }

  property_definition:
    # Built-in virtual properties use IDs such as $builtin_$group_key.
    id: string
    name: string
    description: string?
    property_type: string?
    is_numerical: bool?
    is_seen_on_filtered_events: bool?
    updated_at: timestamptz?
    verified: bool?
    hidden: bool?
    tags: json?

# Every path keeps its trailing slash — Django's APPEND_SLASH would otherwise
# answer each request with a 301.
#
# Enum-valued columns are typed `string`, never `int`, even where PostHog's
# underlying choice is an integer (restriction_level). The asymmetry is
# decisive: a JSON number coerces cleanly into a string column, but a string
# under an int64 column fails ParseInt — and that is not a path error, so
# `nullable` does not absorb it and the whole run aborts.
resources:
  # First resource declared, so it doubles as the TestConnection probe: a bad
  # key or a wrong project_id fails here rather than mid-run.
  - name: persons
    path: /api/projects/{project_id}/persons/
    params:
      project_id: config.project_id
    primary_key: [id]
    fields:
      # Typed string, not int64, even though the response schema claims
      # `integer`: PostHog's own retrieve endpoint documents this identifier as
      # "Accepts both numeric ID and UUID", and live instances return the UUID.
      # A JSON number coerces into a string column cleanly, so string is the
      # only type that holds both shapes — int64 aborts the run on a UUID.
      id: string
      uuid: uuid
      name: string?
      distinct_ids: json?
      properties: json?
      created_at: timestamptz?
      last_seen_at: timestamptz?
      raw: { path: $, type: json, mode: remainder }
    # No incremental: the persons list filters on distinct_id, email,
    # properties and search only. There is no updated-since parameter, so
    # every run is a full snapshot.

  - name: cohorts
    capture: { cohort_id: id }
    path: /api/projects/{project_id}/cohorts/
    params:
      project_id: config.project_id
    primary_key: [id]
    use_fields: [authorship]
    fields:
      id: int64
      name: string?
      description: string?
      deleted: bool?
      is_static: bool?
      is_calculating: bool?
      cohort_type: string?
      version: int64?
      pending_version: int64?
      count: int64?
      last_calculation: timestamptz?
      errors_calculating: int64?
      last_error_message: string?
      filters: json?
      experiment_set: json?
      raw: { path: $, type: json, mode: remainder }

  - name: feature_flags
    path: /api/projects/{project_id}/feature_flags/
    params:
      project_id: config.project_id
    query: { archived: "false" }
    primary_key: [id]
    use_fields: [authorship, feature_flag]

  - name: feature_flags_archived
    path: /api/projects/{project_id}/feature_flags/
    params:
      project_id: config.project_id
    query: { archived: "true" }
    primary_key: [id]
    use_fields: [authorship, feature_flag]

  # The list serializer omits metric definitions; hydrate each experiment.
  # https://github.com/PostHog/posthog/blob/master/products/experiments/backend/presentation/views.py
  - name: experiment_ids
    path: /api/projects/{project_id}/experiments/
    params: { project_id: config.project_id }
    query: { archived: "false" }
    capture_only: true
    capture: { experiment_id: id }

  - name: experiments
    path: /api/projects/{project_id}/experiments/{experiment_id}/
    params:
      project_id: config.project_id
      experiment_id: parent.experiment_id
    for_each: experiment_ids
    primary_key: [id]
    use_fields: [authorship, experiment]
    response:
      records: $
      cardinality: one
      pagination: none

  - name: experiment_ids_archived
    path: /api/projects/{project_id}/experiments/
    params: { project_id: config.project_id }
    query: { archived: "true" }
    capture_only: true
    capture: { experiment_id: id }

  - name: experiments_archived
    path: /api/projects/{project_id}/experiments/{experiment_id}/
    params:
      project_id: config.project_id
      experiment_id: parent.experiment_id
    for_each: experiment_ids_archived
    primary_key: [id]
    use_fields: [authorship, experiment]
    response:
      records: $
      cardinality: one
      pagination: none

  - name: insights
    path: /api/projects/{project_id}/insights/
    params:
      project_id: config.project_id
    query: { order: last_modified_at }
    primary_key: [id]
    use_fields: [authorship]
    fields:
      id: int64
      short_id: string
      name: string?
      derived_name: string?
      description: string?
      favorited: bool?
      is_sample: bool?
      deleted: bool?
      order: int64?
      query: json?
      dashboards: json?
      last_refresh: timestamptz?
      last_viewed_at: timestamptz?
      last_modified_at: timestamptz
      last_modified_by: json?
      updated_at: timestamptz?
      user_access_level: string?
      tags: json?
      raw: { path: $, type: json, mode: remainder }
    # Only definition edits advance this timestamp; full reads refresh other metadata.
    incremental:
      cursor_field: last_modified_at
      start_param: date_from
      inject_into: query
      comparator: time
      checkpoint_key: insights_modified_at
      # Strict > filters must re-read timestamp ties.
      overlap_seconds: 1

  - name: dashboard_ids
    path: /api/projects/{project_id}/dashboards/
    params: { project_id: config.project_id }
    capture_only: true
    capture: { dashboard_id: id }

  - name: dashboards
    path: /api/projects/{project_id}/dashboards/{dashboard_id}/
    params:
      project_id: config.project_id
      dashboard_id: parent.dashboard_id
    for_each: dashboard_ids
    query: { refresh: force_cache }
    response: { records: $, cardinality: one, pagination: none }
    primary_key: [id]
    use_fields: [authorship]
    fields:
      id: int64
      name: string?
      description: string?
      pinned: bool?
      is_shared: bool?
      deleted: bool?
      creation_mode: string?
      restriction_level: string?
      folder: string?
      last_accessed_at: timestamptz?
      last_viewed_at: timestamptz?
      last_refresh: timestamptz?
      user_access_level: string?
      team_id: int64?
      tiles: json?
      filters: json?
      variables: json?
      tags: json?
      raw: { path: $, type: json, mode: remainder }

  - name: actions
    path: /api/projects/{project_id}/actions/
    params:
      project_id: config.project_id
    primary_key: [id]
    use_fields: [authorship]
    fields:
      id: int64
      name: string?
      description: string?
      deleted: bool?
      post_to_slack: bool?
      slack_message_format: string?
      is_action: bool?
      is_calculating: bool?
      last_calculated_at: timestamptz?
      pinned_at: timestamptz?
      creation_context: string?
      bytecode_error: string?
      team_id: int64?
      steps: json?
      tags: json?
      raw: { path: $, type: json, mode: remainder }

  - name: annotations
    path: /api/projects/{project_id}/annotations/
    params:
      project_id: config.project_id
    primary_key: [id]
    use_fields: [authorship]
    fields:
      id: int64
      content: string?
      date_marker: timestamptz?
      scope: string?
      creation_type: string?
      emoji: string?
      deleted: bool?
      updated_at: timestamptz?
      dashboard_id: int64?
      dashboard_name: string?
      # dashboard_item is PostHog's legacy name for the insight foreign key.
      dashboard_item: int64?
      insight_short_id: string?
      insight_name: string?
      raw: { path: $, type: json, mode: remainder }

  - name: surveys
    capture: { survey_id: id }
    path: /api/projects/{project_id}/surveys/
    params:
      project_id: config.project_id
    primary_key: [id]
    use_fields: [authorship]
    fields:
      id: uuid
      name: string?
      description: string?
      type: string?
      schedule: string?
      archived: bool?
      base_language: string?
      start_date: timestamptz?
      end_date: timestamptz?
      linked_flag_id: int64?
      responses_limit: int64?
      iteration_count: int64?
      current_iteration: int64?
      enable_partial_responses: bool?
      linked_flag: json?
      targeting_flag: json?
      questions: json?
      conditions: json?
      raw: { path: $, type: json, mode: remainder }

  # The live implementation differs from the generated DRF API example.
  # https://github.com/PostHog/posthog/blob/master/posthog/session_recordings/session_recording_api.py
  - name: session_recordings
    query:
      order: start_time
      order_direction: ASC
      date_from: "{{ config.session_recordings_start_date }}"
    pagination:
      cursor:
        response: next_cursor
        request: query.after
        more: has_next
        null_terminates: true
    path: /api/projects/{project_id}/session_recordings/
    params:
      project_id: config.project_id
    primary_key: [id]
    fields:
      id: string
      distinct_id: string?
      # Join key to persons.id — string for the same reason, since it is the
      # same identifier and may arrive as either a number or a UUID.
      person_id: { path: person.id, type: string, nullable: true }
      person: json?
      viewed: bool?
      ongoing: bool?
      recording_duration: int64?
      active_seconds: int64?
      inactive_seconds: int64?
      activity_score: float64?
      click_count: int64?
      keypress_count: int64?
      mouse_activity_count: int64?
      console_log_count: int64?
      console_error_count: int64?
      start_time: timestamptz
      end_time: timestamptz?
      start_url: string?
      snapshot_source: string?
      viewers: json?
      raw: { path: $, type: json, mode: remainder }

    # Session start is not an update timestamp. Re-read the maximum session
    # duration (24 hours); older uploads and metadata edits need full reads.
    incremental:
      cursor_field: start_time
      start_param: date_from
      inject_into: query
      comparator: time
      checkpoint_key: session_recordings_start_time
      overlap_seconds: 86400

  - name: group_types
    path: /api/projects/{project_id}/groups_types/
    params: { project_id: config.project_id }
    capture: { group_type_index: group_type_index }
    primary_key: [group_type_index]
    # The implementation returns a root array, despite the singleton example.
    # https://github.com/PostHog/posthog/blob/master/ee/clickhouse/views/groups.py
    response: { records: $, pagination: none }
    fields:
      group_type_index: int64
      group_type: string
      name_singular: string?
      name_plural: string?
      detail_dashboard: int64?
      default_columns: json?
      created_at: timestamptz?
      raw: { path: $, type: json, mode: remainder }

  - name: groups
    path: /api/projects/{project_id}/groups/
    params: { project_id: config.project_id }
    for_each: group_types
    query: { group_type_index: "{{ parent.group_type_index }}" }
    primary_key: [group_type_index, group_key]
    fields:
      group_type_index: int64
      group_key: string
      group_properties: json?
      created_at: timestamptz?
      raw: { path: $, type: json, mode: remainder }

  - name: cohort_members
    path: /api/projects/{project_id}/cohorts/{cohort_id}/persons/
    params:
      project_id: config.project_id
      cohort_id: parent.cohort_id
    for_each: cohorts
    primary_key: [cohort_id, person_id]
    fields:
      cohort_id: { path: parent.cohort_id, type: int64 }
      person_id: { path: id, type: string }
      uuid: uuid?
      name: string?
      distinct_ids: json?
      properties: json?
      created_at: timestamptz?
      is_identified: bool?
      raw: { path: $, type: json, mode: remainder }

  - name: event_definitions
    path: /api/projects/{project_id}/event_definitions/
    params: { project_id: config.project_id }
    primary_key: [id]
    fields:
      id: uuid
      name: string
      description: string?
      owner: int64?
      created_at: timestamptz?
      updated_at: timestamptz?
      last_seen_at: timestamptz?
      verified: bool?
      hidden: bool?
      tags: json?
      raw: { path: $, type: json, mode: remainder }

  - name: event_property_definitions
    path: /api/projects/{project_id}/property_definitions/
    params: { project_id: config.project_id }
    query: { type: event }
    primary_key: [id]
    use_fields: [property_definition]
    fields:
      raw: { path: $, type: json, mode: remainder }

  - name: person_property_definitions
    path: /api/projects/{project_id}/property_definitions/
    params: { project_id: config.project_id }
    query: { type: person }
    primary_key: [id]
    use_fields: [property_definition]
    fields:
      raw: { path: $, type: json, mode: remainder }

  - name: session_property_definitions
    path: /api/projects/{project_id}/property_definitions/
    params: { project_id: config.project_id }
    query: { type: session }
    primary_key: [id]
    use_fields: [property_definition]
    fields:
      raw: { path: $, type: json, mode: remainder }

  - name: group_property_definitions
    path: /api/projects/{project_id}/property_definitions/
    params: { project_id: config.project_id }
    for_each: group_types
    query:
      type: group
      group_type_index: "{{ parent.group_type_index }}"
    primary_key: [group_type_index, id]
    use_fields: [property_definition]
    fields:
      group_type_index: { path: parent.group_type_index, type: int64 }
      raw: { path: $, type: json, mode: remainder }

  - name: notebook_ids
    path: /api/projects/{project_id}/notebooks/
    params: { project_id: config.project_id }
    capture_only: true
    capture: { short_id: short_id }

  - name: notebooks
    path: /api/projects/{project_id}/notebooks/{short_id}/
    params:
      project_id: config.project_id
      short_id: parent.short_id
    for_each: notebook_ids
    primary_key: [id]
    use_fields: [authorship]
    response: { records: $, cardinality: one, pagination: none }
    fields:
      id: uuid
      short_id: string
      title: string?
      content: json?
      text_content: string?
      version: int64?
      deleted: bool?
      last_modified_at: timestamptz?
      last_modified_by: json?
      variables: json?
      raw: { path: $, type: json, mode: remainder }

  - name: early_access_features
    path: /api/projects/{project_id}/early_access_feature/
    params: { project_id: config.project_id }
    primary_key: [id]
    use_fields: [authorship]
    fields:
      id: uuid
      name: string?
      description: string?
      stage: string?
      documentation_url: string?
      feature_flag_id: { path: feature_flag.id, type: int64, nullable: true }
      feature_flag: json?
      payload: json?
      raw: { path: $, type: json, mode: remainder }

  - name: session_recording_playlists
    path: /api/projects/{project_id}/session_recording_playlists/
    params: { project_id: config.project_id }
    # Synthetic playlists have string IDs; short_id identifies both kinds.
    primary_key: [short_id]
    use_fields: [authorship]
    fields:
      short_id: string
      id: string?
      name: string?
      derived_name: string?
      description: string?
      pinned: bool?
      deleted: bool?
      type: string?
      is_synthetic: bool?
      filters: json?
      recordings_counts: json?
      last_modified_at: timestamptz?
      last_modified_by: json?
      raw: { path: $, type: json, mode: remainder }

  # https://posthog.com/docs/api/activity-log
  - name: activity_log
    path: /api/projects/{project_id}/activity_log/
    params: { project_id: config.project_id }
    primary_key: [id]
    fields:
      id: string
      activity: string?
      scope: string?
      item_id: string?
      user: json?
      detail: json?
      created_at: timestamptz?
      raw: { path: $, type: json, mode: remainder }

  # https://posthog.com/docs/api/alerts
  - name: alerts
    path: /api/projects/{project_id}/alerts/
    params: { project_id: config.project_id }
    primary_key: [id]
    fields:
      id: string
      name: string?
      enabled: bool?
      insight: int64?
      state: string?
      threshold: json?
      config: json?
      created_at: timestamptz?
      raw: { path: $, type: json, mode: remainder }

  # https://posthog.com/docs/api/batch-exports-2
  - name: batch_exports
    path: /api/projects/{project_id}/batch_exports/
    params: { project_id: config.project_id }
    capture: { batch_export_id: id }
    primary_key: [id]
    fields:
      id: string
      name: string?
      model: json?
      destination: json?
      interval: string?
      paused: bool?
      created_at: timestamptz?
      last_updated_at: timestamptz?
      raw: { path: $, type: json, mode: remainder }

  # https://posthog.com/docs/api/dashboard-templates
  - name: dashboard_templates
    path: /api/projects/{project_id}/dashboard_templates/
    params: { project_id: config.project_id }
    primary_key: [id]
    fields:
      id: string
      template_name: string?
      dashboard_description: string?
      dashboard_filters: json?
      tiles: json?
      variables: json?
      scope: string?
      created_at: timestamptz?
      raw: { path: $, type: json, mode: remainder }

  # https://posthog.com/docs/api/datasets
  - name: datasets
    path: /api/projects/{project_id}/datasets/
    params: { project_id: config.project_id }
    query: { archived: "false" }
    capture: { dataset_id: id }
    primary_key: [id]
    fields:
      id: string
      name: string?
      description: string?
      metadata: json?
      archived: bool?
      current_revision_id: string?
      created_at: timestamptz?
      updated_at: timestamptz?
      raw: { path: $, type: json, mode: remainder }

  # https://posthog.com/docs/api/dataset-items
  - name: dataset_items
    path: /api/projects/{project_id}/dataset_items/
    params: { project_id: config.project_id }
    query: { archived: "false" }
    capture: { dataset_item_id: id }
    primary_key: [id]
    fields:
      id: string
      dataset: string?
      version: int64?
      version_id: string?
      archived: bool?
      input: json?
      expected_output: json?
      source_output: json?
      metadata: json?
      created_at: timestamptz?
      updated_at: timestamptz?
      raw: { path: $, type: json, mode: remainder }

  # https://posthog.com/docs/api/datasets
  - name: datasets_archived
    path: /api/projects/{project_id}/datasets/
    params: { project_id: config.project_id }
    query: { archived: "true" }
    capture: { dataset_id: id }
    primary_key: [id]
    fields:
      id: string
      name: string?
      description: string?
      metadata: json?
      archived: bool?
      current_revision_id: string?
      created_at: timestamptz?
      updated_at: timestamptz?
      raw: { path: $, type: json, mode: remainder }

  # https://posthog.com/docs/api/dataset-items
  - name: dataset_items_archived
    path: /api/projects/{project_id}/dataset_items/
    params: { project_id: config.project_id }
    query: { archived: "true" }
    capture: { dataset_item_id: id }
    primary_key: [id]
    fields:
      id: string
      dataset: string?
      version: int64?
