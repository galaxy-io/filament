  - name: columns
    path: /v2
    primary_key: [ board_id, id ]
    for_each: boards
    fields:
      board_id: { path: parent.board_id, type: string }
      id: string
      title: string?
      type: string?
      description: string?
      archived: bool?
      settings: json?
      capabilities: json?
      raw: { path: $, type: json, mode: remainder }
    body:
      encoding: json
      template:
        query: |
          query Columns($board: ID!) {
            boards(ids: [$board]) {
              columns {
                id
                title
                type
                description
                archived
                width
                settings
                revision
                capabilities {
                  calculated {
                    function
                    calculated_type
                  }
                  visibility
                }
              }
            }
          }
        variables:
          board: "{{ parent.board_id }}"
    response:
      records: $.data.boards.0.columns
      pagination: none
  - name: groups
