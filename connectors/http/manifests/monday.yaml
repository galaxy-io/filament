# Read contract: https://developer.monday.com/api-reference/llms.txt
# Queries validated against https://api.monday.com/v2/get_schema?version=2026-07
# Coverage, read-mode decisions, and live-validation limits: docs/pages/connectors/sources/monday.mdx
version: 1
name: monday
display_name: monday.com
description: Read monday.com boards, items, collaboration, documents, and account data.
dark_logo_url: https://cdn.getgalaxy.io/sources/source-icon-monday-dark.svg
light_logo_url: https://cdn.getgalaxy.io/sources/source-icon-monday-light.svg
config:
  api_token:
    type: secret
    required: true
    help: Personal monday.com API token from Developers > API token
connection:
  base_url: https://api.monday.com
  auth:
    header:
      name: Authorization
      value: config.api_token
  headers:
    API-Version: 2026-07
    Accept: application/json
  timeout_seconds: 60
  rate_limit:
    requests_per_second: 2
defaults:
  method: POST
  response:
    error:
      path: errors
      when_present: true
      message_path: errors.0.message
resources:
  - name: account
    path: /v2
    primary_key: [ id ]
    fields:
      id: string
      name: string?
      slug: string?
      tier: string?
      country_code: string?
      created_at: timestamptz?
      plan: json?
      products: json?
      raw: { path: $, type: json, mode: remainder }
    body:
      encoding: json
      template:
        query: |
          query Account {
            account {
              id
              name
              slug
              tier
              country_code
              created_at
              first_day_of_the_week
              show_timeline_weekends
              active_members_count
              is_during_trial
              is_trial_expired
              sign_up_product_kind
              plan {
                max_users
                period
                tier
                version
              }
              products {
                id
                kind
                tier
                default_workspace_id
              }
            }
          }
    response:
      records: $.data.account
      pagination: none
      cardinality: one
  - name: users
    path: /v2
    primary_key: [ id ]
    fields:
      id: string
      name: string?
      email: string?
      kind: string?
      status: string?
      account_id: string?
      created_at: timestamptz?
      teams: json?
      raw: { path: $, type: json, mode: remainder }
    body:
      encoding: json
      template:
        query: |
          query Users($limit: Int!, $page: Int!) {
            users(limit: $limit, page: $page, status: [ACTIVE, INACTIVE, PENDING]) {
              id
              name
              email
              kind
              status
              account_id
              title
              phone
              mobile_phone
              location
              country_code
              time_zone_identifier
              created_at
              is_deleted
              is_email_confirmed
              teams {
                id
                name
              }
            }
          }
    response:
      records: $.data.users
      pagination:
        page:
          number: body.variables.page
          size: body.variables.limit
          page_size: 50
  - name: teams
    path: /v2
    primary_key: [ id ]
    fields:
      id: string
      name: string?
      picture_url: string?
      owners: json?
      raw: { path: $, type: json, mode: remainder }
    body:
      encoding: json
      template:
        query: |
          query Teams {
            teams {
              id
              name
              picture_url
              owners {
                id
              }
            }
          }
    response:
      records: $.data.teams
      pagination: none
  - name: workspaces
    path: /v2
    primary_key: [ id ]
    capture:
      workspace_id: id
    fields:
      id: string
      name: string?
      kind: string?
      description: string?
      state: string?
      created_at: timestamptz?
      account_product: json?
      raw: { path: $, type: json, mode: remainder }
    body:
      encoding: json
      template:
        query: |
          query Workspaces($limit: Int!, $page: Int!) {
            workspaces(limit: $limit, page: $page, membership_kind: all) {
              id
              name
              kind
              description
              state
              created_at
              is_default_workspace
              account_product {
                id
                kind
                tier
                default_workspace_id
              }
            }
          }
    response:
      records: $.data.workspaces
      pagination:
        page:
          number: body.variables.page
          size: body.variables.limit
          page_size: 50
  - name: folders
    path: /v2
    primary_key: [ id ]
    fields:
      id: string
      name: string?
      color: string?
      created_at: timestamptz?
      owner_id: string?
      parent_id: { path: parent.id, type: string, nullable: true }
      workspace_id: { path: workspace.id, type: string, nullable: true }
      children: json?
      sub_folders: json?
      raw: { path: $, type: json, mode: remainder }
    body:
      encoding: json
      template:
        query: |
          query Folders($limit: Int!, $page: Int!) {
            folders(limit: $limit, page: $page) {
              id
              name
              color
              created_at
              owner_id
              parent {
                id
              }
              workspace {
                id
              }
              children {
                id
              }
              sub_folders {
                id
              }
            }
          }
    response:
      records: $.data.folders
      pagination:
        page:
          number: body.variables.page
          size: body.variables.limit
          page_size: 50
  - name: boards
    path: /v2
