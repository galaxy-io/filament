            audit_event_catalogue {
              name
              description
              metadata_details
            }
          }
    response:
      records: $.data.audit_event_catalogue
      pagination: none
  - name: api_usage
    path: /v2
    primary_key: []
    fields:
      daily_limit: json?
      daily_analytics: json?
      raw: { path: $, type: json, mode: remainder }
    body:
      encoding: json
      template:
        query: |
          query ApiUsage {
            platform_api {
              daily_limit {
                base
                total
              }
              daily_analytics {
                last_updated
                by_day {
                  day
                  usage
                }
                by_app {
                  api_app_id
                  usage
                }
                by_user {
                  user {
                    id
                  }
                  usage
                }
              }
            }
          }
    response:
      records: $.data.platform_api
      pagination: none
      cardinality: one
