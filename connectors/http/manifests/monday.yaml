    capture:
      board_id: id
    fields:
      id: string
      name: string?
      description: string?
      state: string?
      board_kind: string?
      hierarchy_type: string?
      workspace_id: string?
      board_folder_id: string?
      created_at: timestamptz?
      updated_at: timestamptz?
      url: string?
      owners: json?
      subscribers: json?
      tags: json?
      raw: { path: $, type: json, mode: remainder }
    body:
      encoding: json
      template:
        query: |
          query Boards($limit: Int!, $page: Int!) {
            boards(
              limit: $limit
              page: $page
              state: active
              hierarchy_types: [classic, multi_level]
            ) {
              id
              name
              description
              state
              board_kind
              hierarchy_type
              workspace_id
              board_folder_id
              created_at
              updated_at
              url
              permissions
              items_count
              item_terminology
              creator {
                id
              }
              owners {
                id
              }
              subscribers {
                id
              }
              tags {
                id
                name
                color
              }
            }
          }
    response:
