  - name: items
    path: /v2
    primary_key: [ id ]
    for_each: boards
    capture:
      item_id: id
    fields:
      id: string
      name: string?
      state: string?
      created_at: timestamptz?
      updated_at: timestamptz?
      creator_id: string?
      url: string?
      board_id: { path: board.id, type: string, nullable: true }
      group_id: { path: group.id, type: string, nullable: true }
      parent_item_id: { path: parent_item.id, type: string, nullable: true }
      description: json?
      column_values: json?
      raw: { path: $, type: json, mode: remainder }
    body:
      encoding: json
      template:
        query: |
          query Items($board: ID!, $cursor: String) {
            boards(ids: [$board]) {
              items_page(limit: 100, cursor: $cursor) {
                cursor
                items {
                  id
                  name
                  state
                  created_at
                  updated_at
                  creator_id
                  url
                  board {
                    id
                  }
                  group {
                    id
                  }
                  parent_item {
                    id
                  }
                  description {
                    id
                  }
                  column_values(capabilities: [CALCULATED]) {
                    id
                    type
                    text
                    value
                    is_leaf
                    column {
                      id
                      title
                      type
                      settings
                    }
                    ... on BoardRelationValue {
                      linked_item_ids
                      display_value
                    }
                    ... on DependencyValue {
                      linked_item_ids
                      display_value
                    }
                    ... on MirrorValue {
                      display_value
                    }
                    ... on BatteryValue {
                      battery_value {
                        key
                        count
                      }
                    }
                  }
                }
              }
            }
          }
        variables:
          board: "{{ parent.board_id }}"
    response:
      records: $.data.boards.0.items_page.items
      pagination:
        cursor:
          response: data.boards.0.items_page.cursor
          request: body.variables.cursor
          null_terminates: true
