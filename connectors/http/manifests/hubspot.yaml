  # List search uses an integer body offset and count (maximum 500).
  # GET /crm/lists/2026-09 reads selected IDs, not the account-wide catalog.
  - name: lists
    path: /crm/lists/2026-09/search
    primary_key: [list_id]
    method: POST
    body:
      encoding: json
      template:
        offset: 0
        count: 500
        additionalProperties:
          - hs_list_size
          - hs_last_record_added_at
          - hs_last_record_removed_at
          - hs_folder_name
          - hs_list_reference_count
    records: $.lists
    pagination:
      offset:
        offset: body.offset
        limit: body.count
        page_size: 500
    capture:
      list_id: listId
    fields:
      list_id: { path: listId, type: string }
      name: string?
      object_type_id: { path: objectTypeId, type: string, nullable: true }
      processing_type: { path: processingType, type: string, nullable: true }
      processing_status: { path: processingStatus, type: string, nullable: true }
      created_at: { path: createdAt, type: timestamptz, nullable: true }
      updated_at: { path: updatedAt, type: timestamptz, nullable: true }
      raw: { path: $, type: json, mode: remainder }

