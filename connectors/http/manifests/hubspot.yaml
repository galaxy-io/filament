defaults:
  method: GET
  response:
    records: $.results
    pagination:
      cursor:
        response: paging.next.after
        request: query.after
field_sets:
  # Every /crm/v3/objects/* record shares this envelope. Account-specific
  # values stay in the `properties` map rather than being flattened into
  # columns — HubSpot property sets differ per portal, so a flattened schema
  # would not be stable across accounts.
  crm_object:
    id: string
    created_at: { path: createdAt, type: timestamptz }
    updated_at: { path: updatedAt, type: timestamptz }
    archived: bool?
    archived_at: { path: archivedAt, type: timestamptz, nullable: true }
    properties: json?
    associations: json?
    raw: { path: $, type: json, mode: remainder }
  # CMS content objects (blog posts, pages, tags, authors, redirects, domains)
  # use `created`/`updated` rather than createdAt/updatedAt.
  cms_lifecycle:
    id: string
    created: timestamptz?
    updated: timestamptz?
  # Site pages and landing pages share one content model.
  web_page:
    name: string?
    slug: string?
    url: string?
    state: string?
    current_state: { path: currentState, type: string, nullable: true }
    currently_published: { path: currentlyPublished, type: bool, nullable: true }
    language: string?
    domain: string?
    subcategory: string?
    author_name: { path: authorName, type: string, nullable: true }
    campaign: string?
    folder_id: { path: folderId, type: string, nullable: true }
    template_path: { path: templatePath, type: string, nullable: true }
    html_title: { path: htmlTitle, type: string, nullable: true }
    meta_description: { path: metaDescription, type: string, nullable: true }
    head_html: { path: headHtml, type: string, nullable: true }
    footer_html: { path: footerHtml, type: string, nullable: true }
    featured_image: { path: featuredImage, type: string, nullable: true }
    featured_image_alt_text: { path: featuredImageAltText, type: string, nullable: true }
    use_featured_image: { path: useFeaturedImage, type: bool, nullable: true }
    link_rel_canonical_url: { path: linkRelCanonicalUrl, type: string, nullable: true }
    ab_status: { path: abStatus, type: string, nullable: true }
    ab_test_id: { path: abTestId, type: string, nullable: true }
    publish_date: { path: publishDate, type: timestamptz, nullable: true }
    archived_at: { path: archivedAt, type: timestamptz, nullable: true }
    archived_in_dashboard: { path: archivedInDashboard, type: bool, nullable: true }
    created_by_id: { path: createdById, type: string, nullable: true }
    updated_by_id: { path: updatedById, type: string, nullable: true }
    layout_sections: { path: layoutSections, type: json, nullable: true }
    widgets: json?
    translations: json?
    raw: { path: $, type: json, mode: remainder }
  # /crm/v3/properties/{objectType} record.
  property_definition:
    name: string
    label: string
    description: string?
    type: string
    field_type: { path: fieldType, type: string }
    group_name: { path: groupName, type: string }
    display_order: { path: displayOrder, type: int64, nullable: true }
    options: json?
    calculated: bool?
    calculation_formula: { path: calculationFormula, type: string, nullable: true }
    external_options: { path: externalOptions, type: bool, nullable: true }
    has_unique_value: { path: hasUniqueValue, type: bool, nullable: true }
    hidden: bool?
    hubspot_defined: { path: hubspotDefined, type: bool, nullable: true }
    form_field: { path: formField, type: bool, nullable: true }
    data_sensitivity: { path: dataSensitivity, type: string, nullable: true }
    referenced_object_type: { path: referencedObjectType, type: string, nullable: true }
    currency_property_name: { path: currencyPropertyName, type: string, nullable: true }
    modification_metadata: { path: modificationMetadata, type: json, nullable: true }
    archived: bool?
    archived_at: { path: archivedAt, type: timestamptz, nullable: true }
    created_user_id: { path: createdUserId, type: string, nullable: true }
    updated_user_id: { path: updatedUserId, type: string, nullable: true }
    created_at: { path: createdAt, type: timestamptz, nullable: true }
    updated_at: { path: updatedAt, type: timestamptz, nullable: true }
    raw: { path: $, type: json, mode: remainder }
  # /crm/v3/pipelines/{objectType} record.
  pipeline:
    id: string
    label: string
    display_order: { path: displayOrder, type: int64 }
    stages: json?
    archived: bool
    archived_at: { path: archivedAt, type: timestamptz, nullable: true }
    created_at: { path: createdAt, type: timestamptz }
    updated_at: { path: updatedAt, type: timestamptz }
    raw: { path: $, type: json, mode: remainder }
  # /crm/v3/pipelines/{objectType}/{pipelineId}/stages record.
  pipeline_stage:
    pipeline_id: { path: parent.pipeline_id, type: string }
    id: string
    label: string
    display_order: { path: displayOrder, type: int64 }
    metadata: json?
    write_permissions: { path: writePermissions, type: string, nullable: true }
    archived: bool
    archived_at: { path: archivedAt, type: timestamptz, nullable: true }
    created_at: { path: createdAt, type: timestamptz }
    updated_at: { path: updatedAt, type: timestamptz }
    raw: { path: $, type: json, mode: remainder }
connection:
  base_url: https://api.hubapi.com
  auth:
    bearer: config.access_token
  headers:
    Accept: application/json
  # Private apps get 100 requests/10s on Free and Starter, 190/10s on
  # Professional and Enterprise. 8 rps with the limiter's 2x burst stays
  # under the lowest tier's window (16 + 80 < 100).
  rate_limit:
    requests_per_second: 8
resources:
  # ---------------------------------------------------------------- CRM core
  - name: contacts
    path: /crm/v3/objects/contacts
    primary_key: [id]
    use_fields: [crm_object]
    query:
      limit: "100"
      properties: "{{ config.contact_properties }}"
      associations: companies,deals,tickets

  - name: companies
    path: /crm/v3/objects/companies
    primary_key: [id]
    use_fields: [crm_object]
    query:
      limit: "100"
      properties: "{{ config.company_properties }}"
      associations: contacts,deals,tickets

  - name: deals
    path: /crm/v3/objects/deals
    primary_key: [id]
    use_fields: [crm_object]
    query:
      limit: "100"
      properties: "{{ config.deal_properties }}"
      associations: contacts,companies,line_items,quotes,tickets

  - name: tickets
