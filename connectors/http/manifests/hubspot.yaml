    query:
      limit: "500"
    properties:
      - hs_created_at
      - hs_last_modified_at
    primary_key: [id]
    fields:
      id: string
      createdAt: timestamptz
      updatedAt: timestamptz
      properties: json
      raw: { path: $, type: json, mode: remainder }
    response:
      records: $.results
      pagination:
        cursor:
          response: paging.next.after
