      limit: "100"
    fields:
      id: string
      name: string
      raw: { path: $, type: json, mode: remainder }

  - name: conversation_channel_accounts
    path: /conversations/v3/conversations/channel-accounts
    primary_key: [id]
    query:
      limit: "100"
    fields:
      id: string
      name: string
      channel_id: { path: channelId, type: string }
      inbox_id: { path: inboxId, type: string }
      active: bool
      authorized: bool
      archived: bool
      archived_at: { path: archivedAt, type: timestamptz, nullable: true }
      delivery_identifier: { path: deliveryIdentifier, type: json, nullable: true }
      created_at: { path: createdAt, type: timestamptz }
      raw: { path: $, type: json, mode: remainder }

  - name: conversation_threads
    path: /conversations/v3/conversations/threads
    primary_key: [id]
    query:
      limit: "100"
    fields:
      id: string
      inbox_id: { path: inboxId, type: string }
      status: string
      spam: bool
      archived: bool
      assigned_to: { path: assignedTo, type: string, nullable: true }
      associated_contact_id: { path: associatedContactId, type: string, nullable: true }
      original_channel_id: { path: originalChannelId, type: string }
      original_channel_account_id: { path: originalChannelAccountId, type: string }
      latest_message_timestamp: { path: latestMessageTimestamp, type: timestamptz, nullable: true }
      latest_message_sent_timestamp: { path: latestMessageSentTimestamp, type: timestamptz, nullable: true }
      latest_message_received_timestamp: { path: latestMessageReceivedTimestamp, type: timestamptz, nullable: true }
      thread_associations: { path: threadAssociations, type: json, nullable: true }
      closed_at: { path: closedAt, type: timestamptz, nullable: true }
      created_at: { path: createdAt, type: timestamptz }
      raw: { path: $, type: json, mode: remainder }
    capture:
      thread_id: id
    incremental:
      cursor_field: latestMessageTimestamp
      start_param: latestMessageTimestampAfter
      inject_into: query
      checkpoint_key: conversation_threads_latest_message_after
      comparator: time
      overlap_seconds: 60

  - name: conversation_messages
    path: /conversations/v3/conversations/threads/{thread}/messages
    params:
      thread: parent.thread_id
    for_each: conversation_threads
    primary_key: [thread_id, id]
    query:
      limit: "100"
    fields:
      thread_id: { path: parent.thread_id, type: string }
      id: string
      type: string?
      subject: string?
      text: string?
      rich_text: { path: richText, type: string, nullable: true }
      direction: string?
      status: json?
      channel_id: { path: channelId, type: string, nullable: true }
      channel_account_id: { path: channelAccountId, type: string, nullable: true }
      conversations_thread_id: { path: conversationsThreadId, type: string, nullable: true }
      in_reply_to_id: { path: inReplyToId, type: string, nullable: true }
      senders: json?
      recipients: json?
      attachments: json?
      client: json?
      truncation_status: { path: truncationStatus, type: string, nullable: true }
      archived: bool?
      created_by: { path: createdBy, type: string, nullable: true }
      created_at: { path: createdAt, type: timestamptz, nullable: true }
      updated_at: { path: updatedAt, type: timestamptz, nullable: true }
      raw: { path: $, type: json, mode: remainder }

