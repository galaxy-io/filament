version: 1
name: hubspot
display_name: HubSpot
description: "CRM, commerce, marketing, conversations, content, and automation data."
dark_logo_url: https://cdn.getgalaxy.io/sources/source-icon-hubspot-dark.svg
light_logo_url: https://cdn.getgalaxy.io/sources/source-icon-hubspot-light.svg
config:
  api_key:
    type: secret
    required: true
    help: "HubSpot service key or access token with read scopes for the selected resources."
  properties:
    type: string
    default: ""
    scope: pipeline
    help: "Comma-separated CRM property names, including custom properties. Empty uses the API defaults. Applies to all selected CRM object types."
  archived:
    type: bool
    default: false
    scope: pipeline
    help: "Read archived instead of active CRM records, owners, forms, and conversations. Does not include both."
  object_type:
    type: string
    default: contacts
    scope: pipeline
    help: "Object type ID or name for objects, properties, property_groups, pipelines, and the source side of associations."
  association_target_type:
    type: string
    default: companies
    scope: pipeline
    help: "Target object type ID or name for associations and association_labels."
  data_sensitivity:
    type: enum
    enum: [non_sensitive, sensitive, highly_sensitive]
    default: non_sensitive
    scope: pipeline
    help: "Property category for the properties resource. Sensitive property definitions require the corresponding scopes."
# Current stable REST endpoints where available; remaining numbered routes have
# no equivalent stable endpoint for the same account-wide read.
# Contracts: https://developers.hubspot.com/docs/api-reference/latest/overview
defaults:
  method: GET
  response:
    records: $.results
    pagination:
      cursor:
        response: paging.next.after
        request: query.after
field_sets:
  crm_record:
    id: string
    created_at: { path: createdAt, type: timestamptz, nullable: true }
    updated_at: { path: updatedAt, type: timestamptz }
    archived: bool?
    archived_at: { path: archivedAt, type: timestamptz, nullable: true }
    properties: json?
  dated_record:
    id: string
    created_at: { path: createdAt, type: timestamptz, nullable: true }
    updated_at: { path: updatedAt, type: timestamptz, nullable: true }
  content_record:
    id: string
    created_at: { path: created, type: timestamptz, nullable: true }
    updated_at: { path: updated, type: timestamptz, nullable: true }
    name: string?
    slug: string?
    url: string?
  incremental_content_record:
    id: string
    created_at: { path: created, type: timestamptz, nullable: true }
    updated_at: { path: updated, type: timestamptz }
    name: string?
    slug: string?
    url: string?
connection:
  base_url: https://api.hubapi.com
  auth:
    bearer: config.api_key
  headers:
    Accept: application/json
  timeout_seconds: 60
  # Service keys allow at least 100 requests / 10 seconds. The interval header
  # is a window in milliseconds, not a reset time; do not use dynamic.reset.
  rate_limit:
    requests_per_second: 5
resources:
  - name: owners
    path: /crm/owners/2026-09
    primary_key: [id]
    query:
      limit: "100"
      archived: "{{ config.archived }}"
    use_fields: [dated_record]
    fields:
      email: string?
      first_name: { path: firstName, type: string, nullable: true }
      last_name: { path: lastName, type: string, nullable: true }
      user_id: { path: userId, type: int64, nullable: true }
      archived: bool?
      teams: json?
      raw: { path: $, type: json, mode: remainder }

  # CRM list endpoints return API defaults unless properties are requested.
  # Incremental search advances by record ID inside a fixed update interval.
  # Each request starts a new query, avoiding Search's 10,000-result paging limit.
  - name: contacts
    path: /crm/objects/2026-09/contacts
    primary_key: [id]
    use_fields: [crm_record]
    query:
      limit: "100"
      properties: "{{ config.properties }}"
      archived: "{{ config.archived }}"
    fields:
      raw: { path: $, type: json, mode: remainder }
    incremental:
      cursor_field: updated_at
      start_param: filterGroups.0.filters.0.value
      end_param: filterGroups.0.filters.1.value
      inject_into: body
      comparator: time
      initial: "1970-01-01T00:00:00Z"
      checkpoint_key: contacts_updated_at
      overlap_seconds: 300
      checkpoint_on_complete: true
      disabled_when: archived
      request:
        path: /crm/objects/2026-09/contacts/search
        method: POST
        query: {}
        body:
          template:
            limit: 200
            sorts: [hs_object_id]
            properties: '{{ config.properties | split "," }}'
            filterGroups:
              - filters:
                  - { propertyName: lastmodifieddate, operator: GTE, value: "1970-01-01T00:00:00Z" }
                  - { propertyName: lastmodifieddate, operator: LT, value: "1970-01-01T00:00:00Z" }
                  - { propertyName: hs_object_id, operator: GT, value: "0" }
        pagination:
          cursor:
            response: results.-1.id
            request: body.filterGroups.0.filters.2.value

