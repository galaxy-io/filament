  - name: owners
    path: /crm/v3/owners
    query:
      limit: "100"
    primary_key: [id]
    fields:
      id: string
      workspace: string
      email: string
      firstName: string?
      lastName: string?
      createdAt: timestamptz
      updatedAt: timestamptz
      raw: { path: $, type: json, mode: remainder }
    response:
      records: $.results
      pagination:
        cursor:
          response: paging.next.after
          request: query._after
          null_terminates: true

  - name: custom_objects
    path: /crm/v3/schemas
    method: GET
    primary_key: [id]
    fields:
      id: string
      name: string
      label: string
      description: string?
      created: timestamptz
      updated: timestamptz
      raw: { path: $, type: json, mode: remainder }
    response:
      records: $.results
      pagination:
        offset: { offset: body.offset, limit: body.limit, page_size: 100 }

discovery:
  mode: static
