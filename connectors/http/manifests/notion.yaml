version: 1
name: notion
config:
  api_key:
    type: secret
    required: true
    help: Notion integration secret
connection:
  base_url: https://api.notion.com
  auth:
    bearer: config.api_key
  headers:
    Notion-Version: "2022-06-28"
resources:
  - name: databases
    path: /v1/search
    method: POST
    primary_key: [id]
    fields:
      id: string
      object: string
      created_time: timestamptz?
      last_edited_time: timestamptz?
      title: { path: title.0.plain_text, type: string, nullable: true }
      raw: { path: $, type: json }
    capture:
      database_id: id
    body:
      encoding: json
      template:
        filter:
          property: object
          value: database
    response:
      records: $.results
      pagination:
        cursor:
          response: next_cursor
          request: body.start_cursor
          more: has_more
  - name: pages
    path: /v1/databases/{database}/query
    params:
      database: parent.database_id
    method: POST
    primary_key: [id]
    fields:
      id: string
      database_id: { path: parent.database_id, type: string }
      object: string
      created_time: timestamptz?
      last_edited_time: timestamptz?
      archived: bool?
      url: string?
      properties: json?
      raw: { path: $, type: json }
    capture:
      block_id: id
    for_each: databases
    response:
      records: $.results
      pagination:
        cursor:
          response: next_cursor
          request: body.start_cursor
          more: has_more
  - name: users
    path: /v1/users
    method: GET
    primary_key: [id]
    fields:
      id: string
      name: string?
      type: string?
      avatar_url: string?
      person: json?
      bot: json?
      raw: { path: $, type: json, mode: remainder }
    response:
      records: $.results
      pagination:
        cursor:
          response: next_cursor
          request: query.start_cursor
          more: has_more
  - name: blocks
    path: /v1/blocks/{block}/children
    params:
      block: parent.block_id
    method: GET
    primary_key: [id]
    fields:
      id: string
      page_id: { path: parent.block_id, type: string }
      type: string
      created_time: timestamptz?
      last_edited_time: timestamptz?
      archived: bool?
      has_children: bool?
      created_by: json?
      last_edited_by: json?
      raw: { path: $, type: json, mode: remainder }
    for_each: pages
    response:
      records: $.results
      pagination:
        cursor:
          response: next_cursor
          request: query.start_cursor
          more: has_more
discovery:
  mode: static
  include: [users, databases, pages, blocks]
