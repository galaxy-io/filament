version: 1
name: ramp
config:
  client_id:
    type: string
    required: true
    help: OAuth2 client ID
  client_secret:
    type: secret
    required: true
    help: OAuth2 client secret
  field_id:
    type: string
    required: true
    help: The ID of the custom accounting field that this custom accounting field option belongs to. This is the ramp_id returned…
  account_id:
    type: string
    required: true
    help: Value for {account_id} in /developer/v1/banking/accounts/{account_id}/balance-history
  custom_table_name:
    type: string
    required: true
    help: Value for {custom_table_name} in /developer/v1/custom-records/custom-tables/{custom_table_name}/columns
  native_table_name:
    type: string
    required: true
    help: Value for {native_table_name} in /developer/v1/custom-records/native-tables/{native_table_name}/columns
  service_key:
    type: string
    required: true
    help: External approval integration key configured on the spend program's External Approval Request nodes. Returned nodes mat…
  spend_program_id:
    type: string
    required: true
    help: Value for {spend_program_id} in /developer/v1/spend-programs/{spend_program_id}/workflow-nodes
  vendor_id:
    type: string
    required: true
    help: Value for {vendor_id} in /developer/v1/vendors/{vendor_id}/accounts
defaults:
  method: GET
  response:
    records: $.data
    pagination:
      cursor:
        response: page.next
        request: query.start
connection:
  base_url: https://api.ramp.com
  auth:
    oauth2:
      # TODO: add scope if the token endpoint requires explicit scopes, e.g. scope: "transactions:read users:read"
      token_url: https://api.ramp.com/developer/v1/token
      client_id: config.client_id
      client_secret: config.client_secret
  headers:
    Accept: application/json
resources:
  - name: accounting_accounts
    path: /developer/v1/accounting/accounts
    query:
      page_size: "100"
    primary_key: [id]
    fields:
      accounting_connection_id: uuid
      classification: string?
      code: string?
      created_at: timestamptz
      entity_remote_ids: json?
      gl_account_category_info: json?
      id: string?
      is_active: bool
      name: string
      provider_name: string?
      ramp_id: uuid
      updated_at: timestamptz?
      visibility: string?
      raw: { path: $, type: json, mode: remainder }
  - name: all_connections
    path: /developer/v1/accounting/all-connections
    primary_key: [id]
    records: $.connections
    fields:
      connection_type: string
      created_at: timestamptz
      id: uuid
      is_active: bool
      is_ready_to_migrate: bool
      last_linked_at: timestamptz?
      remote_provider_name: string?
      settings: json?
      status: string
      raw: { path: $, type: json, mode: remainder }
    pagination: "none"
  - name: field_option_filter_rules
    path: /developer/v1/accounting/field-option-filter-rules
    query:
      page_size: "100"
    primary_key: [target_field_option_remote_id]
    fields:
      required_selections: json
      target_field_option_remote_id: string
      target_field_remote_id: string
      raw: { path: $, type: json, mode: remainder }
  - name: field_options
    path: /developer/v1/accounting/field-options
    query:
      page_size: "100"
      field_id: "{{ config.field_id }}"
    primary_key: [id]
    fields:
      accounting_connection_id: uuid
      code: string?
      created_at: timestamptz?
      display_name: string?
      entity_remote_ids: json?
      id: string?
      is_active: bool?
      provider_name: string?
      ramp_id: uuid?
      updated_at: timestamptz?
      value: string?
      visibility: string?
      raw: { path: $, type: json, mode: remainder }
  - name: fields
    path: /developer/v1/accounting/fields
    query:
      page_size: "100"
    primary_key: [id]
    fields:
      accounting_connection_id: uuid
      created_at: timestamptz?
      display_name: string?
      id: string?
      input_type: string
      is_active: bool?
      is_required_for: json
      is_splittable: bool?
      name: string?
      provider_name: string?
      ramp_id: uuid?
      updated_at: timestamptz?
      raw: { path: $, type: json, mode: remainder }
  - name: inventory_item_options
    path: /developer/v1/accounting/inventory-item/options
