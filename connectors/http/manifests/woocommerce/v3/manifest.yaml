version: 1
name: woocommerce
display_name: WooCommerce
description: Catalog, customers, orders, coupons, taxes, shipping, webhooks and reports from a self-hosted WooCommerce store via its REST API (wp-json/wc/v3).
dark_logo_url: https://cdn.getgalaxy.io/sources/source-icon-woocommerce-dark.svg
light_logo_url: https://cdn.getgalaxy.io/sources/source-icon-woocommerce-light.svg
api_version: "v3"
# WooCommerce is self-hosted, so the store URL is user-supplied per connection
# (unlike the fixed base_url of SaaS manifests). The REST API base is always
# <store_url>/wp-json/wc/v3. Auth is HTTP Basic with the store's consumer
# key:secret pair, which WooCommerce requires to be served over HTTPS.
config:
  store_url:
    type: string
    required: true
    help: The storefront URL, e.g. https://your-store.example.com (no trailing slash or /wp-json suffix).
  consumer_key:
    type: secret
    required: true
    help: WooCommerce REST API consumer key (WooCommerce > Settings > Advanced > REST API).
  consumer_secret:
    type: secret
    required: true
    help: WooCommerce REST API consumer secret paired with the consumer key.
defaults:
  method: GET
  response:
    # Every WooCommerce collection endpoint returns a bare JSON array; the root
    # path selects it. page/per_page is the documented pagination mechanism and
    # a page short of per_page terminates the walk (WooCommerce does not emit a
    # next-page body token, and X-WP-TotalPages is the only header signal — the
    # short-page rule is the same termination WooCommerce clients rely on).
    records: $
    pagination:
      page:
        number: page
        size: per_page
        page_size: 100
connection:
  base_url: "{{ config.store_url }}/wp-json/wc/v3"
  auth:
    basic:
      username: config.consumer_key
      password: config.consumer_secret
  headers:
    Accept: application/json
  timeout_seconds: 60
resources:
  # products is first so it doubles as the TestConnection probe: authenticated
  # and needs no parent scope.
  - name: products
    path: /products
    primary_key: [id]
    # WooCommerce returns date_modified as a naive, site-timezone datetime
    # (YYYY-MM-DDTHH:MM:SS with no UTC offset) and evaluates the modified_after
    # filter in the same site timezone. So a lex comparator on this fixed-width
    # string orders chronologically, whereas a time comparator (RFC3339) would
    # reject the naive value and fail the run. The cursor and the filter share
    # one clock, keeping the watermark consistent.
    incremental:
      cursor_field: date_modified
      start_param: modified_after
      inject_into: query
      initial: "1970-01-01T00:00:00"
      comparator: lex
      # modified_after is an exclusive, second-granularity filter: records whose
      # date_modified equals the saved watermark are omitted on the next read.
      # overlap_seconds would re-fetch that window but requires a time or
      # numeric comparator, which the naive datetimes can't satisfy — recover any
      # same-second boundary records with a periodic full read.
    capture:
      product_id: id
    fields:
      id: int64
      name: string?
      slug: string?
      permalink: string?
      date_created: timestamptz?
      date_modified: timestamptz
      type: string?
      status: string?
      featured: bool?
      catalog_visibility: string?
      description: string?
      short_description: string?
      sku: string?
      price: string?
      regular_price: string?
      sale_price: string?
      date_on_sale_from: timestamptz?
      date_on_sale_to: timestamptz?
      on_sale: bool?
      purchasable: bool?
      total_sales: int64?
      virtual: bool?
      downloadable: bool?
      download_limit: int64?
      download_expiry: int64?
      external_url: string?
      button_text: string?
      tax_status: string?
      tax_class: string?
      manage_stock: bool?
      stock_quantity: int64?
      stock_status: string?
      backorders: string?
      backorders_allowed: bool?
      backordered: bool?
      low_stock_amount: int64?
      sold_individually: bool?
      weight: string?
      dimensions: json?
      shipping_required: bool?
      shipping_taxable: bool?
      shipping_class: string?
      shipping_class_id: int64?
      reviews_allowed: bool?
      average_rating: string?
      rating_count: int64?
      upsell_ids: json?
      cross_sell_ids: json?
      parent_id: int64?
      purchase_note: string?
      categories: json?
      tags: json?
      images: json?
      attributes: json?
      default_attributes: json?
      variations: json?
      grouped_products: json?
      menu_order: int64?
      price_html: string?
      related_ids: json?
      meta_data: json?
      raw: { path: $, type: json, mode: remainder }

  # Parent-scoped sub-resource: one request per product.
  - name: product_variations
    path: /products/{product_id}/variations
    params:
      product_id: parent.product_id
    for_each: products
    primary_key: [id]
    fields:
      product_id: { path: parent.product_id, type: int64 }
      id: int64
      date_created: timestamptz?
      date_modified: timestamptz?
      description: string?
      permalink: string?
      sku: string?
      price: string?
      regular_price: string?
      sale_price: string?
      date_on_sale_from: timestamptz?
      date_on_sale_to: timestamptz?
      on_sale: bool?
      status: string?
      purchasable: bool?
      virtual: bool?
      downloadable: bool?
      download_limit: int64?
      download_expiry: int64?
      tax_status: string?
      tax_class: string?
      manage_stock: bool?
      stock_quantity: int64?
      stock_status: string?
      backorders: string?
      backorders_allowed: bool?
      backordered: bool?
      low_stock_amount: int64?
      weight: string?
      dimensions: json?
      shipping_class: string?
      shipping_class_id: int64?
      image: json?
      attributes: json?
      menu_order: int64?
      meta_data: json?
      raw: { path: $, type: json, mode: remainder }

  - name: product_categories
    path: /products/categories
    primary_key: [id]
    fields:
      id: int64
      name: string?
      slug: string?
      parent: int64?
      description: string?
      display: string?
      image: json?
      menu_order: int64?
      count: int64?
      raw: { path: $, type: json, mode: remainder }

  - name: product_tags
    path: /products/tags
    primary_key: [id]
    fields:
      id: int64
      name: string?
      slug: string?
      description: string?
      count: int64?
      raw: { path: $, type: json, mode: remainder }

  - name: product_attributes
    path: /products/attributes
    primary_key: [id]
    capture:
      attribute_id: id
    fields:
      id: int64
      name: string?
      slug: string?
      type: string?
      order_by: string?
      has_archives: bool?
      raw: { path: $, type: json, mode: remainder }

  # Parent-scoped sub-resource: one request per attribute.
  - name: product_attribute_terms
    path: /products/attributes/{attribute_id}/terms
    params:
      attribute_id: parent.attribute_id
    for_each: product_attributes
    primary_key: [id]
    fields:
      attribute_id: { path: parent.attribute_id, type: int64 }
      id: int64
      name: string?
      slug: string?
      description: string?
      menu_order: int64?
      count: int64?
      raw: { path: $, type: json, mode: remainder }

  - name: product_shipping_classes
    path: /products/shipping_classes
    primary_key: [id]
    fields:
      id: int64
      name: string?
      slug: string?
      description: string?
      count: int64?
      raw: { path: $, type: json, mode: remainder }

  - name: product_reviews
    path: /products/reviews
    primary_key: [id]
    fields:
      id: int64
      date_created: timestamptz?
      product_id: int64?
      product_name: string?
      product_permalink: string?
      status: string?
      reviewer: string?
      reviewer_email: string?
      review: string?
      rating: int64?
      verified: bool?
      meta_data: json?
      raw: { path: $, type: json, mode: remainder }

  - name: customers
    path: /customers
    primary_key: [id]
    capture:
      customer_id: id
    fields:
      id: int64
      date_created: timestamptz?
      date_modified: timestamptz?
      email: string?
      first_name: string?
      last_name: string?
      role: string?
      username: string?
      billing: json?
      shipping: json?
      is_paying_customer: bool?
      avatar_url: string?
      meta_data: json?
      raw: { path: $, type: json, mode: remainder }

  # Parent-scoped sub-resource: one request per customer.
  - name: customer_downloads
    path: /customers/{customer_id}/downloads
    params:
      customer_id: parent.customer_id
    for_each: customers
    primary_key: [download_id]
    fields:
      customer_id: { path: parent.customer_id, type: int64 }
      download_id: string
      download_url: string?
      download_name: string?
      download_remaining: string?
      access_expires: timestamptz?
      raw: { path: $, type: json, mode: remainder }

  - name: orders
    path: /orders
    primary_key: [id]
    incremental:
      cursor_field: date_modified
      start_param: modified_after
      inject_into: query
      initial: "1970-01-01T00:00:00"
      # Same naive site-timezone datetime and exclusive modified_after semantics
      # as products: lex on a fixed-width string orders chronologically; any
      # same-second boundary records need a periodic full read to recover.
      comparator: lex
      checkpoint_key: orders_date_modified
    capture:
      order_id: id
    fields:
      id: int64
      parent_id: int64?
      number: string?
      order_key: string?
      created_via: string?
      version: string?
      status: string?
      currency: string?
      date_created: timestamptz?
      date_modified: timestamptz
      discount_total: string?
      discount_tax: string?
      shipping_total: string?
      shipping_tax: string?
      cart_tax: string?
      total: string?
      total_tax: string?
      prices_include_tax: bool?
      customer_id: int64?
      customer_ip_address: string?
      customer_user_agent: string?
      customer_note: string?
      billing: json?
      shipping: json?
      payment_method: string?
      payment_method_title: string?
      transaction_id: string?
      date_paid: timestamptz?
      date_completed: timestamptz?
      cart_hash: string?
      line_items: json?
      tax_lines: json?
      shipping_lines: json?
      fee_lines: json?
      coupon_lines: json?
      refunds: json?
      meta_data: json?
      raw: { path: $, type: json, mode: remainder }

  # Parent-scoped sub-resources: one request per order.
  - name: order_notes
    path: /orders/{order_id}/notes
    params:
      order_id: parent.order_id
    for_each: orders
    primary_key: [id]
    fields:
      order_id: { path: parent.order_id, type: int64 }
      id: int64
      author: string?
      date_created: timestamptz?
      note: string?
      customer_note: bool?
      added_by_user: bool?
      raw: { path: $, type: json, mode: remainder }

  - name: order_refunds
    path: /orders/{order_id}/refunds
    params:
      order_id: parent.order_id
    for_each: orders
    primary_key: [id]
    fields:
      order_id: { path: parent.order_id, type: int64 }
      id: int64
      date_created: timestamptz?
      amount: string?
      reason: string?
      refunded_by: int64?
      meta_data: json?
      line_items: json?
      raw: { path: $, type: json, mode: remainder }

  - name: coupons
    path: /coupons
    primary_key: [id]
    fields:
      id: int64
      code: string?
      amount: string?
      date_created: timestamptz?
      date_modified: timestamptz?
      discount_type: string?
      description: string?
      date_expires: timestamptz?
      usage_count: int64?
      individual_use: bool?
      product_ids: json?
      excluded_product_ids: json?
      usage_limit: int64?
      usage_limit_per_user: int64?
      limit_usage_to_x_items: int64?
      free_shipping: bool?
      product_categories: json?
      excluded_product_categories: json?
      exclude_sale_items: bool?
      minimum_amount: string?
      maximum_amount: string?
      email_restrictions: json?
      used_by: json?
      meta_data: json?
      raw: { path: $, type: json, mode: remainder }

  - name: tax_classes
    path: /taxes/classes
    primary_key: [slug]
    fields:
      slug: string
      name: string
      raw: { path: $, type: json, mode: remainder }

  - name: tax_rates
    path: /taxes
    primary_key: [id]
    fields:
      id: int64
      country: string?
      state: string?
      postcode: string?
      city: string?
      rate: string?
      name: string?
      priority: int64?
      compound: bool?
      shipping: bool?
      order: int64?
      class: string?
      raw: { path: $, type: json, mode: remainder }

  - name: shipping_zones
    path: /shipping/zones
    primary_key: [id]
    capture:
      zone_id: id
    fields:
      id: int64
      name: string?
      order: int64?
      raw: { path: $, type: json, mode: remainder }

  # Parent-scoped sub-resources: one request per shipping zone.
  - name: shipping_zone_methods
    path: /shipping/zones/{zone_id}/methods
    params:
      zone_id: parent.zone_id
    for_each: shipping_zones
    primary_key: [instance_id]
    fields:
      zone_id: { path: parent.zone_id, type: int64 }
      id: int64?
      instance_id: int64
      title: string?
      order: int64?
      enabled: bool?
      method_id: string?
      method_title: string?
      method_description: string?
      settings: json?
      raw: { path: $, type: json, mode: remainder }

  - name: shipping_zone_locations
    path: /shipping/zones/{zone_id}/locations
    params:
      zone_id: parent.zone_id
    for_each: shipping_zones
    primary_key: [zone_id, code]
    fields:
      zone_id: { path: parent.zone_id, type: int64 }
      code: string?
      type: string?
      raw: { path: $, type: json, mode: remainder }

  - name: payment_gateways
    path: /payment_gateways
    primary_key: [id]
    fields:
      id: string
      title: string?
      description: string?
      order: int64?
      enabled: bool?
      method_title: string?
      method_description: string?
      settings: json?
      raw: { path: $, type: json, mode: remainder }

  - name: webhooks
    path: /webhooks
    primary_key: [id]
    capture:
      webhook_id: id
    fields:
      id: int64
      name: string?
      status: string?
      topic: string?
      resource: string?
      event: string?
      hooks: json?
      delivery_url: string?
      secret: string?
      date_created: timestamptz?
      date_modified: timestamptz?
      raw: { path: $, type: json, mode: remainder }

  # Parent-scoped sub-resource: one request per webhook.
  - name: webhook_deliveries
    path: /webhooks/{webhook_id}/deliveries
    params:
      webhook_id: parent.webhook_id
    for_each: webhooks
    primary_key: [id]
    fields:
      webhook_id: { path: parent.webhook_id, type: int64 }
      id: int64
      duration: string?
      summary: string?
      request_headers: json?
      request_body: string?
      response_code: string?
      response_headers: json?
      response_body: string?
      date_created: timestamptz?
      raw: { path: $, type: json, mode: remainder }

  # Report definitions endpoint.
  - name: reports
    path: /reports
    primary_key: [slug]
    fields:
      slug: string
      description: string?
      title: string?
      keywords: json?
      raw: { path: $, type: json, mode: remainder }

  # Aggregate report endpoints. These are rollup/analytics snapshots rather
  # than mutable records; they change with the period filter, so they are best
  # used as full reads.
  - name: report_sales
    path: /reports/sales
    primary_key: [date_created]
    fields:
      date_created: string
      totals: json?
      raw: { path: $, type: json, mode: remainder }

  - name: report_top_sellers
    path: /reports/top_sellers
    primary_key: [product_id]
    fields:
      product_id: int64
      name: string?
      quantity: int64?
      raw: { path: $, type: json, mode: remainder }

  - name: report_orders_totals
    path: /reports/orders/totals
    primary_key: [slug]
    fields:
      slug: string
      name: string?
      total: string?
      raw: { path: $, type: json, mode: remainder }

  - name: report_products_totals
    path: /reports/products/totals
    primary_key: [slug]
    fields:
      slug: string
      name: string?
      total: string?
      raw: { path: $, type: json, mode: remainder }

  - name: report_customers_totals
    path: /reports/customers/totals
    primary_key: [slug]
    fields:
      slug: string
      name: string?
      total: string?
      raw: { path: $, type: json, mode: remainder }

  - name: report_coupons_totals
    path: /reports/coupons/totals
    primary_key: [slug]
    fields:
      slug: string
      name: string?
      total: string?
      raw: { path: $, type: json, mode: remainder }

  - name: report_reviews_totals
    path: /reports/reviews/totals
    primary_key: [slug]
    fields:
      slug: string
      name: string?
      total: string?
      raw: { path: $, type: json, mode: remainder }

  - name: report_stock
    path: /reports/stock
    primary_key: [id]
    fields:
      id: int64
      parent_id: int64?
      name: string?
      sku: string?
      stock_status: string?
      stock_quantity: int64?
      raw: { path: $, type: json, mode: remainder }

  # Settings groups. Each returns an array of setting objects (key-value
  # configuration rather than transactional records).
  - name: settings_general
    path: /settings/general
    primary_key: [id]
    fields:
      id: string
      label: string?
      description: string?
      type: string?
      default: json?
      value: json?
      options: json?
      group_id: string?
      raw: { path: $, type: json, mode: remainder }

  - name: settings_products
    path: /settings/products
    primary_key: [id]
    fields:
      id: string
      label: string?
      description: string?
      type: string?
      default: json?
      value: json?
      options: json?
      group_id: string?
      raw: { path: $, type: json, mode: remainder }

  - name: settings_tax
    path: /settings/tax
    primary_key: [id]
    fields:
      id: string
      label: string?
      description: string?
      type: string?
      default: json?
      value: json?
      options: json?
      group_id: string?
      raw: { path: $, type: json, mode: remainder }

  - name: settings_shipping
    path: /settings/shipping
    primary_key: [id]
    fields:
      id: string
      label: string?
      description: string?
      type: string?
      default: json?
      value: json?
      options: json?
      group_id: string?
      raw: { path: $, type: json, mode: remainder }

  - name: settings_advanced
    path: /settings/advanced
    primary_key: [id]
    fields:
      id: string
      label: string?
      description: string?
      type: string?
      default: json?
      value: json?
      options: json?
      group_id: string?
      raw: { path: $, type: json, mode: remainder }

discovery:
  mode: static
  include:
    - products
    - product_variations
    - product_categories
    - product_tags
    - product_attributes
    - product_attribute_terms
    - product_shipping_classes
    - product_reviews
    - customers
    - customer_downloads
    - orders
    - order_notes
    - order_refunds
    - coupons
    - tax_classes
    - tax_rates
    - shipping_zones
    - shipping_zone_methods
    - shipping_zone_locations
    - payment_gateways
    - webhooks
    - webhook_deliveries
    - reports
    - report_sales
    - report_top_sellers
    - report_orders_totals
    - report_products_totals
    - report_customers_totals
    - report_coupons_totals
    - report_reviews_totals
    - report_stock
    - settings_general
    - settings_products
    - settings_tax
    - settings_shipping
    - settings_advanced
