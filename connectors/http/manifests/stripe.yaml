      parent: json?
      payment_settings: json?
      payments: json?
      receipt_number: string?
      rendering: json?
      shipping_cost: json?
      shipping_details: json?
      statement_descriptor: string?
      status_transitions: json?
      test_clock: string?
      threshold_reason: json?
