version: 1
name: stripe
config:
  api_key:
    type: secret
    required: true
    help: Stripe secret or restricted API key (sk_live_…, sk_test_…, rk_live_…). A restricted key needs read access to every enabled resource.
  api_version:
    type: string
    default: "2026-07-29.dahlia"
    help: Stripe API version sent as the Stripe-Version header. Pinning keeps the extracted schema stable when the account's default version changes.
defaults:
  method: GET
  response:
    records: $.data
    # Stripe returns no next-page token: the cursor is the id of the last
    # object on the page, echoed back as starting_after. has_more is the
    # authoritative terminator, so a short final page ends the walk before
    # data.-1 is ever read.
    pagination:
      cursor:
        response: data.-1.id
        request: query.starting_after
        more: has_more
field_sets:
  identity:
    id: string
    object: string
connection:
  base_url: https://api.stripe.com
  auth:
    basic:
      username: config.api_key
  headers:
    Accept: application/json
    Stripe-Version: "{{ config.api_version }}"
  timeout_seconds: 60
  # Sandbox accounts cap the global rate at 25 rps and every individual
  # endpoint at 25 rps; live accounts get 100 rps globally. One limiter is
  # shared across all concurrently extracting resources, so stay under the
  # tighter of the two. 429s are retried with Retry-After on top of this.
  rate_limit:
    requests_per_second: 20
resources:
  # ---------------------------------------------------------------- account
  - name: account
    path: /v1/account
    use_fields: [identity]
    primary_key: [id]
    fields:
      business_type: string?
      country: string?
      default_currency: string?
      email: string?
      type: string?
      charges_enabled: bool?
      payouts_enabled: bool?
      details_submitted: bool?
      created: int64?
      business_profile: json?
      capabilities: json?
      company: json?
      controller: json?
      groups: json?
      individual: json?
      requirements: json?
      future_requirements: json?
      settings: json?
      tos_acceptance: json?
      external_accounts: json?
      metadata: json?
      raw: { path: $, type: json, mode: remainder }
    response:
      records: $
      cardinality: one
      pagination: none

  - name: accounts
    path: /v1/accounts
    query:
      limit: "100"
    use_fields: [identity]
    primary_key: [id]
    fields:
      business_type: string?
      country: string?
      default_currency: string?
      email: string?
      type: string?
      charges_enabled: bool?
      payouts_enabled: bool?
      details_submitted: bool?
      created: int64?
      business_profile: json?
      capabilities: json?
      company: json?
      controller: json?
      groups: json?
      individual: json?
      requirements: json?
      future_requirements: json?
      settings: json?
      tos_acceptance: json?
      external_accounts: json?
      metadata: json?
      raw: { path: $, type: json, mode: remainder }

  # ------------------------------------------------------------ money in/out
  - name: balance_transactions
    path: /v1/balance_transactions
    query:
      limit: "100"
    use_fields: [identity]
    primary_key: [id]
    fields:
      amount: int64?
      net: int64?
      fee: int64?
      fee_details: json?
      currency: string?
      created: int64?
      available_on: int64?
      balance_type: string?
      description: string?
      exchange_rate: float64?
      reporting_category: string?
      source: string?
      status: string?
      type: string?
      raw: { path: $, type: json, mode: remainder }
    incremental:
      cursor_field: created
      start_param: created[gte]
      inject_into: query
      checkpoint_key: balance_transactions_created
      comparator: numeric

  - name: charges
    path: /v1/charges
    query:
      limit: "100"
    use_fields: [identity]
    primary_key: [id]
    fields:
