version: 1
name: zoho
display_name: Zoho CRM
description: CRM platform that automates sales processes and brings customer interactions across channels together to help teams manage relationships and close deals.
dark_logo_url: https://cdn.getgalaxy.io/sources/source-icon-zoho-dark.svg
light_logo_url: https://cdn.getgalaxy.io/sources/source-icon-zoho-light.svg
api_version: "v8"
config:
  auth_method:
    type: enum
    enum: [access_token, client_credentials, refresh_token]
    enum_labels:
      access_token: Access Token
      client_credentials: Client Credentials
      refresh_token: Refresh Token
    default: access_token
    help: Authentication method. Use refresh_token for ongoing integrations, or client_credentials for one-time tasks.
  client_id:
    required: true
    visible_when: {field: auth_method, values: [client_credentials, refresh_token]}
    type: string
    help: OAuth client ID. Required for client_credentials and refresh_token.
  client_secret:
    required: true
    visible_when: {field: auth_method, values: [client_credentials, refresh_token]}
    type: secret
    help: OAuth client secret. Required for client_credentials and refresh_token.
  refresh_token:
    required: true
    visible_when: {field: auth_method, values: [refresh_token]}
    type: secret
    help: Previously authorized refresh token. Required for refresh_token authentication.
  accounts_url:
    visible_when: {field: auth_method, values: [client_credentials, refresh_token]}
    type: string
    default: https://accounts.zoho.com
    help: Zoho Accounts origin for your data center, such as https://accounts.zoho.eu. Used to obtain tokens.
  oauth_scope:
    required: true
    visible_when: {field: auth_method, values: [client_credentials]}
    type: list
    enum:
      - ZohoCRM.modules.READ
      - ZohoCRM.settings.READ
      - ZohoCRM.users.READ
      - ZohoCRM.org.READ
      - ZohoCRM.templates.email.READ
      - ZohoCRM.templates.inventory.READ
      - ZohoCRM.settings.currencies.READ
      - ZohoCRM.settings.fiscal_year.READ
      - ZohoCRM.settings.recycle_bin.READ
      - ZohoCRM.settings.audit_logs.READ
      - ZohoCRM.share.READ
      - ZohoCRM.Zia.enrichment.READ
      - ZohoCRM.bulk.backup.READ
      - ZohoCRM.notifications.READ
    help: Select OAuth read scopes. Include ZohoCRM.users.READ for connection testing; select all to test the connector's full resource set. Account permissions and enabled features still apply.
  soid:
    required: true
    visible_when: {field: auth_method, values: [client_credentials]}
    type: string
    help: Required for client_credentials. Use ZohoCRM.<organization ID>; find the Org ID in your Zoho profile menu.
  access_token:
    required: true
    visible_when: {field: auth_method, values: [access_token]}
    type: secret
    help: Required for access_token authentication. Expires after one hour; obtain and replace it externally.
  host:
    type: string
    default: https://www.zohoapis.com
    help: The api_domain returned with your OAuth token, without /crm/v8. Must match your data center and environment.
  module_api_name:
    type: string
    default: Leads
    scope: pipeline
    help: Module API name for module_* resources. Supports standard, custom, subform, and linking modules where the selected endpoint supports them.
  related_list_api_name:
    type: string
    default: Notes
    scope: pipeline
    help: Related list API name for module_related_records; use module_related_lists to find available relations.
  related_fields:
    type: string
    default: id
    scope: pipeline
    help: Comma-separated field API names for module_related_records, up to 50. Default reads membership IDs only.
  report_from:
    type: string
    scope: pipeline
    help: Start date (YYYY-MM-DD) required for workflow_usage. Zoho supports the last 90 days.
  report_to:
    type: string
    scope: pipeline
    help: End date (YYYY-MM-DD) required for workflow_usage.
  notification_channel_id:
    type: string
    scope: pipeline
    help: Existing channel ID required for notification_subscriptions. This connector does not create channels or receive events.
  wizard_id:
    type: string
    scope: pipeline
    help: Wizard ID required for wizard_layout_details. Read wizards to find IDs.
  wizard_layout_id:
    type: string
    scope: pipeline
    help: Layout ID required for wizard_layout_details. Read the wizard containers to find associated layouts.
defaults:
  method: GET
  response:
    records: $.data
    pagination:
      cursor:
        response: info.next_page_token
        request: query.page_token
        more: info.more_records
        null_terminates: true
field_sets:
  record:
    id: string
    owner: {path: Owner, type: json, nullable: true}
    created_time: {path: Created_Time, type: timestamptz, nullable: true}
    modified_time: {path: Modified_Time, type: timestamptz, nullable: true}
  incremental_record:
    id: string
    owner: {path: Owner, type: json, nullable: true}
    created_time: {path: Created_Time, type: timestamptz, nullable: true}
    modified_time: {path: Modified_Time, type: timestamptz}
  field_definition:
    id: string
    api_name: string?
    field_label: string?
    data_type: string?
    custom_field: bool?
    pick_list_values: json?
    lookup: json?
    raw: {path: $, type: json, mode: remainder}
connection:
  base_url: "{{ config.host }}"
  auth:
    select:
      field: auth_method
      cases:
        access_token:
          required: [access_token]
          auth:
            header:
              name: Authorization
              value: "Zoho-oauthtoken {{ config.access_token }}"
        client_credentials:
          required: [client_id, client_secret, accounts_url, oauth_scope, soid]
          auth:
            oauth2:
              token_url: "{{ config.accounts_url }}/oauth/v2/token"
              client_id: config.client_id
              client_secret: config.client_secret
              scope: "{{ config.oauth_scope }}"
              header_prefix: Zoho-oauthtoken
              params:
                soid: "{{ config.soid }}"
        refresh_token:
          required: [client_id, client_secret, accounts_url, refresh_token]
          auth:
            oauth2:
              token_url: "{{ config.accounts_url }}/oauth/v2/token"
              grant_type: refresh_token
              client_id: config.client_id
              client_secret: config.client_secret
              refresh_token: config.refresh_token
              header_prefix: Zoho-oauthtoken
  headers: {Accept: application/json}
  timeout_seconds: 60
resources:
  # Probe users rather than requiring access to a particular CRM module.
  - name: users
    path: /crm/v8/users
    capture: {user_id: id}
    query: {type: AllUsers}
    response:
      records: $.users
      pagination:
        page: {number: query.page, size: query.per_page, page_size: 200, more: info.more_records}
    primary_key: [id]
    fields:
      id: string
      full_name: string?
      email: string?
      status: string?
      role: json?
      profile: json?
      created_time: timestamptz?
      modified_time: {path: Modified_Time, type: timestamptz, nullable: true}
      raw: {path: $, type: json, mode: remainder}

  # Incremental core reads scan IDs/timestamps, then hydrate only changed records.
  # Detail requests retain custom fields and use the same modified-since floor.
  - name: leads_index
    path: /crm/v8/Leads
    query: {fields: "id,Modified_Time", per_page: "200", converted: both}
    capture_only: true
    capture: {record_id: id, modified_time: Modified_Time}
    primary_key: [id]
    fields: {id: string}

  - name: leads
    path: /crm/v8/Leads/{record_id}
    params: {record_id: parent.record_id}
    for_each: leads_index
    parent: {since: modified_time}
    incremental:
      cursor_field: modified_time
      start_param: If-Modified-Since
      inject_into: header
      comparator: time
      checkpoint_key: leads_modified_time
      overlap_seconds: 60
    response: {records: $.data, pagination: none}
    capture: {record_id: id}
    primary_key: [id]
    use_fields: [incremental_record]
    fields:
      first_name: {path: First_Name, type: string, nullable: true}
      last_name: {path: Last_Name, type: string, nullable: true}
      company: {path: Company, type: string, nullable: true}
      email: {path: Email, type: string, nullable: true}
      phone: {path: Phone, type: string, nullable: true}
      lead_status: {path: Lead_Status, type: string, nullable: true}
      lead_source: {path: Lead_Source, type: string, nullable: true}
      converted: {path: Converted__s, type: bool, nullable: true}
      converted_date_time: {path: Converted_Date_Time, type: timestamptz, nullable: true}
      raw: {path: $, type: json, mode: remainder}

  - name: accounts_index
    path: /crm/v8/Accounts
    query: {fields: "id,Modified_Time", per_page: "200"}
    capture_only: true
    capture: {record_id: id, modified_time: Modified_Time}
