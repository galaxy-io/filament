      pagination: none
    primary_key: [id]
    fields:
      id: string
      raw: {path: $, type: json, mode: remainder}

  - name: scoring_rule_details
    path: /crm/v8/settings/automation/scoring_rules/{id}
    for_each: scoring_rules
    params:
      id: 'parent.scoring_rules_id'
    response:
      records: $.scoring_rules
      pagination: none
    primary_key: [id]
    fields:
      id: string
      raw: {path: $, type: json, mode: remainder}

  - name: assignment_rule_details
    path: /crm/v8/settings/automation/assignment_rules/{id}
    for_each: assignment_rules
    params:
      id: 'parent.assignment_rules_id'
    query:
      module: '{{ parent.module_api_name }}'
    response:
      records: $.assignment_rules
      pagination: none
    primary_key: [id]
    fields:
      id: string
      raw: {path: $, type: json, mode: remainder}

  - name: field_update_details
    path: /crm/v8/settings/automation/field_updates/{id}
    for_each: field_updates
    params:
      id: 'parent.field_updates_id'
    response:
      records: $.field_updates
      pagination: none
    primary_key: [id]
    fields:
      id: string
      raw: {path: $, type: json, mode: remainder}

  - name: automation_task_details
    path: /crm/v8/settings/automation/tasks/{id}
    for_each: automation_tasks
    params:
      id: 'parent.automation_tasks_id'
    response:
      records: $.tasks
      pagination: none
    primary_key: [id]
    fields:
      id: string
      raw: {path: $, type: json, mode: remainder}

  - name: module_custom_view_details
    path: /crm/v8/settings/custom_views/{id}
    for_each: module_custom_views
    params:
      id: 'parent.view_id'
    query:
      module: '{{ config.module_api_name }}'
    response:
      records: $.custom_views
      pagination: none
    primary_key: [id]
    fields:
      id: string
      raw: {path: $, type: json, mode: remainder}

  - name: module_blueprint_index
    path: /crm/v8/{module}
    params: {module: config.module_api_name}
    query: {fields: 'id,$process_flow', per_page: "200", converted: both}
    response:
      records: '$.data.#($process_flow==true)#'
    capture_only: true
    capture: {record_id: id}
    primary_key: [id]
    fields: {id: string}

  - name: global_picklist_options
    path: /crm/v8/settings/global_picklists/{picklist_id}
    params: {picklist_id: parent.global_picklists_id}
    for_each: global_picklists
    response: {records: $.global_picklists.0.pick_list_values, pagination: none}
    capture_only: true
    capture: {picklist_id: parent.global_picklists_id, option_id: id}
    primary_key: [id]
    fields: {id: string}

  - name: global_picklist_option_associations
    path: /crm/v8/settings/global_picklists/{picklist_id}/actions/pick_list_values_associations
    for_each: global_picklist_options
    params:
      picklist_id: 'parent.picklist_id'
    query:
      picklist_value_id: '{{ parent.option_id }}'
    response:
      records: $.pick_list_values_associations
      pagination: none
    primary_key: []
    fields:
      picklist_id: {path: parent.picklist_id, type: string}
      option_id: {path: parent.option_id, type: string}
      raw: {path: $, type: json, mode: remainder}

  - name: unconverted_leads_index
    path: /crm/v8/Leads
    query: {fields: id, per_page: "200", converted: "false"}
    capture_only: true
    capture: {record_id: id}
    primary_key: [id]
    fields: {id: string}

  - name: lead_conversion_options
    path: /crm/v8/Leads/{record_id}/__conversion_options
    for_each: unconverted_leads_index
    params:
      record_id: 'parent.record_id'
    response:
      records: $.__conversion_options
      cardinality: one
      pagination: none
    primary_key: [lead_id]
    fields:
      lead_id: {path: parent.record_id, type: string}
      raw: {path: $, type: json, mode: remainder}

  - name: wizard_layout_details
    path: /crm/v8/settings/wizards/{wizard_id}
    params: {wizard_id: config.wizard_id}
    query: {layout_id: "{{ config.wizard_layout_id }}"}
    response: {records: $.wizards, pagination: none}
    primary_key: [id]
    fields:
      id: string
      raw: {path: $, type: json, mode: remainder}

  # Optional administrative and relationship reads.
  - name: features
    path: "/crm/v8/__features"
    method: "GET"
    response: {"records": "$.__features", "pagination": {"page": {"number": "query.page", "size": "query.per_page", "page_size": 200, "more": "info.more_records"}}}
    primary_key: []
    fields:
      api_name: "string?"
      components: "json?"
      details: "json?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: user_licenses
    path: "/crm/v8/__features/user_licenses"
    method: "GET"
    response: {"records": "$.__features", "pagination": "none"}
    primary_key: ["api_name"]
    fields:
      api_name: "string"
      details: "json?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: available_apis
    path: "/crm/v8/__apis"
    method: "GET"
    response: {"records": "$.__apis", "pagination": "none"}
    primary_key: ["path"]
    fields:
      path: "string"
      operation_types: "json?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: module_enrichment_fields
    path: "/crm/v8/settings/zia/data_enrichment/allowed_field_mappings"
    method: "GET"
    query: {"module": "{{ config.module_api_name }}", "type": "organization"}
    response: {"records": "$.allowed_field_mappings", "pagination": "none", "cardinality": "one"}
    primary_key: []
    fields:
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: module_locking_information
    path: "/crm/v8/{module}/{record_id}/Locking_Information__s"
    method: "GET"
    for_each: "module_record_index"
    params: {"module": "config.module_api_name", "record_id": "parent.record_id"}
    query: {"fields": "Locked_For__s,Locked_Reason__s,Lock_Source__s,Locked_Time__s,Locked_By__s,Record_Locking_Rule_Id__s,Record_Locking_Configuration_Id__s,Owner,Parent_Id", "per_page": "200"}
    response: {"records": "$.data", "pagination": {"cursor": {"response": "info.next_page_token", "request": "query.page_token", "more": "info.more_records", "null_terminates": true}}}
    primary_key: ["record_id", "id"]
    fields:
      record_id: {"path": "parent.record_id", "type": "string"}
      id: "string"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: user_group_associations
    path: "/crm/v8/settings/user_groups/{group_id}/actions/associations"
    method: "GET"
    for_each: "user_groups"
    params: {"group_id": "parent.user_groups_id"}
    response: {"records": "$.associations", "pagination": "none"}
    primary_key: []
    fields:
      group_id: {"path": "parent.user_groups_id", "type": "string"}
      type: "string?"
      resource: "json?"
      details: "json?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: user_associated_groups
    path: "/crm/v8/users/{user_id}/actions/associated_groups"
    method: "GET"
    for_each: "users"
    params: {"user_id": "parent.user_id"}
    response: {"records": "$.user_groups", "pagination": {"page": {"number": "query.page", "size": "query.per_page", "page_size": 200, "more": "info.more_records"}}}
    primary_key: ["user_id", "id"]
    fields:
      user_id: {"path": "parent.user_id", "type": "string"}
      id: "string"
      name: "string?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: child_territories
    path: "/crm/v8/settings/territories/{territory_id}/__child_territories"
    method: "GET"
    for_each: "territories"
    params: {"territory_id": "parent.territories_id"}
    response: {"records": "$.territories", "pagination": {"page": {"number": "query.page", "size": "query.per_page", "page_size": 200, "more": "info.more_records"}}}
    primary_key: ["parent_territory_id", "id"]
    fields:
      parent_territory_id: {"path": "parent.territories_id", "type": "string"}
      id: "string"
      name: "string?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: user_group_source_counts
    path: "/crm/v8/settings/user_groups/{group_id}/actions/sources_count"
    method: "GET"
    for_each: "user_groups"
    params: {"group_id": "parent.user_groups_id"}
    response: {"records": "$.sources_count", "pagination": "none"}
    primary_key: []
    fields:
      group_id: {"path": "parent.user_groups_id", "type": "string"}
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: territory_user_counts
    path: "/crm/v8/settings/territories/actions/associated_users_count"
    method: "GET"
    response: {"records": "$.associated_users_count", "pagination": {"page": {"number": "query.page", "size": "query.per_page", "page_size": 200, "more": "info.more_records"}}}
    primary_key: ["territory_id"]
    fields:
      territory_id: {"path": "territory.id", "type": "string"}
      count: "int64?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: user_group_user_counts
    path: "/crm/v8/settings/user_groups/actions/associated_users_count"
    method: "GET"
    response: {"records": "$.associated_users_count", "pagination": {"page": {"number": "query.page", "size": "query.per_page", "page_size": 200, "more": "info.more_records"}}}
    primary_key: ["group_id"]
    fields:
      group_id: {"path": "user_group.id", "type": "string"}
      count: "int64?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: user_count
    path: "/crm/v8/users/actions/count"
    method: "GET"
    response: {"records": "$", "pagination": "none", "cardinality": "one"}
    primary_key: []
    fields:
      count: "int64"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: module_record_count
    path: "/crm/v8/{module}/actions/count"
    method: "GET"
    params: {"module": "config.module_api_name"}
    response: {"records": "$", "pagination": "none", "cardinality": "one"}
    primary_key: []
    fields:
      count: "int64"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: workflow_action_counts
    path: "/crm/v8/settings/automation/workflow_rules/actions/actions_count"
    method: "GET"
    for_each: "workflow_rules"
    query: {"ids": "{{ parent.workflow_rules_id }}"}
    response: {"records": "$.workflow_rules", "pagination": "none"}
    primary_key: ["id"]
    fields:
      id: "string"
      conditions: "json?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: workflow_module_counts
    path: "/crm/v8/settings/automation/workflow_rules/actions/module_specific_count"
    method: "GET"
    response: {"records": "$.module_specific_count", "pagination": "none"}
    primary_key: ["module_id"]
    fields:
      module_id: {"path": "module.id", "type": "string"}
      active_rules_configured: "int64?"
      total_rules_configured: "int64?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: connected_workflow_action_counts
    path: "/crm/v8/settings/connected_workflows/{workflow_id}/rules/actions/actions_count"
    method: "GET"
    for_each: "module_connected_workflow_rules"
    params: {"workflow_id": "parent.workflow_id"}
    query: {"ids": "{{ parent.rule_id }}"}
    response: {"records": "$.rules", "pagination": "none"}
    primary_key: ["workflow_id", "id"]
    fields:
      workflow_id: {"path": "parent.workflow_id", "type": "string"}
      id: "string"
      conditions: "json?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: module_related_record_counts
    path: "/crm/v8/{module}/{record_id}/actions/get_related_records_count"
    method: "POST"
    for_each: "module_record_index"
    params: {"module": "config.module_api_name", "record_id": "parent.record_id"}
    body: {"encoding": "json", "template": {"get_related_records_count": [{"related_list": {"api_name": "{{ config.related_list_api_name }}"}}]}}
    response: {"records": "$.get_related_records_count", "pagination": "none"}
    primary_key: ["record_id", "related_list_id"]
    fields:
      record_id: {"path": "parent.record_id", "type": "string"}
      related_list_id: {"path": "related_list.id", "type": "string"}
      count: "int64"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: module_recycle_index
    path: "/crm/v8/{module}/deleted"
    method: "GET"
    params: {"module": "config.module_api_name"}
    query: {"type": "recycle"}
    capture: {"record_id": "id"}
    capture_only: true
    response: {"records": "$.data", "pagination": {"page": {"number": "query.page", "size": "query.per_page", "page_size": 200, "more": "info.more_records"}}}
    primary_key: ["id"]
    fields:
      id: "string"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: module_deleted_related_records
    path: "/crm/v8/{module}/deleted/{record_id}/{related_list}"
    method: "GET"
    for_each: "module_recycle_index"
    params: {"module": "config.module_api_name", "record_id": "parent.record_id", "related_list": "config.related_list_api_name"}
    query: {"fields": "{{ config.related_fields }}"}
    response: {"records": "$.data", "pagination": {"page": {"number": "query.page", "size": "query.per_page", "page_size": 200, "more": "info.more_records"}}}
    primary_key: ["record_id", "id"]
    fields:
      record_id: {"path": "parent.record_id", "type": "string"}
      id: "string"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: module_tag_counts
    path: "/crm/v8/settings/tags/{tag_id}/actions/records_count"
    method: "GET"
    for_each: "module_tags"
    params: {"tag_id": "parent.tag_id"}
    query: {"module": "{{ config.module_api_name }}"}
    response: {"records": "$", "pagination": "none", "cardinality": "one"}
    primary_key: ["tag_id"]
    fields:
      tag_id: {"path": "parent.tag_id", "type": "string"}
      count: "int64"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

discovery:
  mode: static
  default_resources:
    - users
    - leads
    - accounts
    - contacts
    - deals
    - tasks
    - events
    - calls
    - campaigns
    - products
