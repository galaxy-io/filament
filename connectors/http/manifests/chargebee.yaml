  - name: events
    # The account audit feed, and the only immutable resource here: an event is
    # never updated, so it cursors on occurred_at rather than updated_at.
    # `content` is rendered at the API version current when the event was
    # created, so its shape varies across old rows.
    path: /events
    primary_key: [id]
    fields:
      id: { path: event.id, type: string }
      occurred_at: { path: event.occurred_at, type: int64, nullable: true }
