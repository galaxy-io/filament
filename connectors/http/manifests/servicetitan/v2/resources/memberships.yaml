resources:
  - name: membership_types
    path: /memberships/v2/tenant/{{ config.tenant_id }}/export/membership-types
    primary_key: [id]
    fields:
      id: int64
      name: string?
      active: bool?
      discount: decimal?
      importId: string?
      createdOn: string?
      modifiedOn: string?
      createdById: int64?
      displayName: string?
      discountMode: string?
      locationTarget: string?
      billingTemplateId: int64?
      durationBilling: json?
      discounts: json?
      recurringServices: json?
      tagTypeIds: json?
      revenueRecognitionMode: string?
      autoCalculateInvoiceTemplates: bool?
      useMembershipPricingTable: bool?
      showMembershipSavings: bool?
      raw: {path: $, type: json, mode: remainder}
    query:
      includeRecentChanges: "false"
    response:
      pagination:
        cursor:
          strict: true
          response: continueFrom
          request: query.from
          more: hasMore
    incremental:
      response_cursor: continueFrom
      start_param: from
      inject_into: query
      checkpoint_key: membership_types_export_token
