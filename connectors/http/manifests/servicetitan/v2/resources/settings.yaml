resources:
  - name: employees
    path: /settings/v2/tenant/{{ config.tenant_id }}/export/employees
    primary_key: [id]
    fields:
      id: int64
      name: string?
      role: string?
      email: string?
      active: bool?
      userId: int64?
      roleIds: json?
      lastName: string?
      createdOn: string?
      firstName: string?
      loginName: string?
      managerId: int64?
      startDate: string?
      hourlyRate: decimal?
      modifiedOn: string?
      phoneNumber: string?
      customFields: json?
      businessUnitId: int64?
      terminationDate: string?
      overtimeProfileId: int64?
      aadUserId: string?
      accountLocked: bool?
      agentId: int64?
      businessUnitAccessIds: json?
      home: json?
      permissions: json?
      raw: {path: $, type: json, mode: remainder}
    query:
      includeRecentChanges: "false"
    response:
      pagination:
        cursor:
          strict: true
          response: continueFrom
          request: query.from
          more: hasMore
    incremental:
      response_cursor: continueFrom
      start_param: from
      inject_into: query
      checkpoint_key: employees_export_token
