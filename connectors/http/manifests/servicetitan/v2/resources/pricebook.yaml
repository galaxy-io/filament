resources:
  - name: pricebook_categories
    path: /pricebook/v2/tenant/{{ config.tenant_id }}/export/categories
    primary_key: [id]
    fields:
      description: string?
      id: int64
      name: string?
      image: string?
      active: bool?
      source: string?
      parentId: int64?
      position: int64?
      createdOn: string?
      externalId: string?
      modifiedOn: string?
      categoryType: string?
      hideInMobile: bool?
      subcategories: json?
      businessUnitIds: json?
      skuImages: json?
      skuVideos: json?
      raw: {path: $, type: json, mode: remainder}
    query:
      includeRecentChanges: "false"
    response:
      pagination:
        cursor:
          strict: true
          response: continueFrom
          request: query.from
          more: hasMore
    incremental:
      response_cursor: continueFrom
      start_param: from
      inject_into: query
      checkpoint_key: pricebook_categories_export_token
