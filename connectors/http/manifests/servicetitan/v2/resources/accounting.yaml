resources:
  - name: gl_accounts
    path: /accounting/v2/tenant/{{ config.tenant_id }}/gl-accounts
    primary_key: [id]
    fields:
      id: int64
      name: string?
      number: string?
      externalId: string?
      description: string?
      type: string?
      subtype: string?
      active: bool?
      isIntacctGroup: bool?
      isIntacctBankAccount: bool?
      source: string?
      defaultAccountType: string?
      isIntacctGlGroup: bool?
      createdOn: string?
      modifiedOn: string?
      raw: {path: $, type: json, mode: remainder}
    query:
      active: "Any"
      includeTotal: "true"
    response:
      pagination:
        page:
          number: query.page
          size: query.pageSize
          page_size: 1000
          more: hasMore
  - name: journal_entries
    path: /accounting/v2/tenant/{{ config.tenant_id }}/journal-entries
    primary_key: []
    fields:
      id: string?
      createdOn: string
      modifiedOn: string
      number: int32
      name: string?
      source: string
      status: string
      syncStatus: string
      versionId: int32
      lastSyncVersionId: int32?
      message: string?
      postDate: string?
      exportedOn: string?
      exportedBy: json?
      customFields: json?
      url: string?
      isEmpty: bool
      raw: {path: $, type: json, mode: remainder}
    capture: {journal_entry_id: id}
    query:
      includeTotal: "true"
    response:
      pagination:
        page:
          number: query.page
          size: query.pageSize
          page_size: 500
          more: hasMore
  - name: journal_entry_details
    path: /accounting/v2/tenant/{{ config.tenant_id }}/journal-entries/{journal_entry_id}/details
    params: {journal_entry_id: parent.journal_entry_id}
