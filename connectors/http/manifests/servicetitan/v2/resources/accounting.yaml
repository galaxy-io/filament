    primary_key: []
    fields:
      journalEntryId: {path: parent.journal_entry_id, type: string}
      postDate: string?
      account: json
      debit: string
      credit: string
      memo: string?
      quantity: string?
      unitAmount: string?
      externalObjects: json?
      transaction: json?
      businessUnit: json?
      customer: json?
      vendor: json?
      inventoryLocation: json?
      job: json?
      customerLocation: json?
      paymentType: json?
      project: json?
