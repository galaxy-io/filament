resources:
  - name: customers
    path: /crm/v2/tenant/{{ config.tenant_id }}/export/customers
    primary_key: [id]
    fields:
      type: string?
      id: int64
      name: string?
      active: bool?
      address: json?
      balance: decimal?
      createdOn: string?
      doNotMail: bool?
      taxExempt: bool?
      mergedToId: int64?
      modifiedOn: string?
      tagTypeIds: json?
      createdById: int64?
      creditLimit: decimal?
      customFields: json?
      doNotService: bool?
      externalData: json?
      paymentTermId: int64?
      nationalAccount: bool?
      creditLimitBalance: decimal?
      raw: {path: $, type: json, mode: remainder}
    query:
      includeRecentChanges: "false"
    response:
      pagination:
        cursor:
          strict: true
          response: continueFrom
          request: query.from
          more: hasMore
    incremental:
      response_cursor: continueFrom
      start_param: from
      inject_into: query
      checkpoint_key: customers_export_token
