# API contract: https://developer.servicetitan.io/docs/apis
version: 1
name: servicetitan
api_version: v2
display_name: ServiceTitan
description: ServiceTitan operations, customers, accounting, inventory, memberships, and payroll.
dark_logo_url: https://cdn.getgalaxy.io/sources/source-icon-servicetitan-dark.svg
light_logo_url: https://cdn.getgalaxy.io/sources/source-icon-servicetitan-light.svg
config:
  tenant_id:
    type: string
    required: true
    help: ServiceTitan tenant ID
  client_id:
    type: string
    required: true
    help: OAuth client ID for this tenant and environment
  client_secret:
    type: secret
    required: true
    help: OAuth client secret
  app_key:
    type: secret
    required: true
    help: Application key with read scopes for selected resources
  environment_suffix:
    type: enum
    enum: ["", "-integration"]
    default: ""
    help: Leave empty for production, or choose -integration for the integration environment
connection:
  base_url: https://api{{ config.environment_suffix }}.servicetitan.io
  auth:
    oauth2:
      token_url: https://auth{{ config.environment_suffix }}.servicetitan.io/connect/token
      client_id: config.client_id
      client_secret: config.client_secret
  headers:
    ST-App-Key: "{{ config.app_key }}"
    Accept: application/json
  timeout_seconds: 120
  rate_limit:
    requests_per_second: 30
    burst: 1
defaults:
  method: GET
  response:
    records: $.data
resources:
  - name: jobs
    path: /jpm/v2/tenant/{{ config.tenant_id }}/export/jobs
    primary_key: [id]
    fields:
      id: int64
      total: decimal?
      active: bool?
      summary: string?
      noCharge: bool?
      priority: string?
      soldById: int64?
      bookingId: int64?
      createdOn: string?
      invoiceId: int64?
      jobNumber: string?
      jobStatus: string?
      jobTypeId: int64?
      projectId: int64?
      campaignId: int64?
      customerId: int64?
      customerPo: string?
      leadCallId: int64?
      locationId: int64?
      modifiedOn: string?
      tagTypeIds: json?
      warrantyId: int64?
      completedOn: string?
      createdById: int64?
      estimateIds: json?
      recallForId: int64?
      customFields: json?
      businessUnitId: int64?
      appointmentCount: int64?
      lastAppointmentId: int64?
      firstAppointmentId: int64?
      notificationsEnabled: bool?
      createdFromEstimateId: int64?
      jobGeneratedLeadSource: json?
      equipmentIds: json?
      externalData: json?
      isAutoDispatched: bool?
      membershipId: int64?
      partnerLeadCallId: int64?
      summaryOfWork: string?
      raw: { path: $, type: json, mode: remainder }
    query:
      includeRecentChanges: "false"
    response:
      pagination:
        cursor:
          strict: true
          response: continueFrom
          request: query.from
          more: hasMore
    incremental:
      response_cursor: continueFrom
      start_param: from
      inject_into: query
      checkpoint_key: jobs_export_token
  - name: appointments
    path: /jpm/v2/tenant/{{ config.tenant_id }}/export/appointments
