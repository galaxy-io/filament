# API contract: https://developer.servicetitan.io/docs/apis
version: 1
name: servicetitan
api_version: v2
display_name: ServiceTitan
description: Field service management software for commercial and residential trades, connecting office operations with technicians in the field from scheduling through job completion.
dark_logo_url: https://cdn.getgalaxy.io/sources/source-icon-servicetitan-dark.svg
light_logo_url: https://cdn.getgalaxy.io/sources/source-icon-servicetitan-light.svg
config:
  tenant_id:
    type: string
    required: true
    help: ServiceTitan tenant ID
  client_id:
    type: string
    required: true
    help: OAuth client ID for this tenant and environment
  client_secret:
    type: secret
    required: true
    pattern: '^[\x21-\x7e]+\z'
    help: OAuth client secret without spaces or line breaks
  app_key:
    type: secret
    required: true
    pattern: '^[\x21-\x7e]+\z'
    help: Application key with read scopes for selected resources, without spaces or line breaks
  environment_suffix:
    type: enum
    enum: ["", "-integration"]
    enum_labels: {"": Production, "-integration": Integration}
    default: ""
    help: Choose the environment that issued the client ID and secret
connection:
  base_url: https://api{{ config.environment_suffix }}.servicetitan.io
  auth:
    oauth2:
      token_url: https://auth{{ config.environment_suffix }}.servicetitan.io/connect/token
      grant_type: client_credentials
      client_id: config.client_id
      client_secret: config.client_secret
  headers:
    ST-App-Key: "{{ config.app_key }}"
    Accept: application/json
  timeout_seconds: 120
  rate_limit:
    requests_per_second: 45
    burst: 1
defaults:
  method: GET
  response:
    records: $.data
discovery:
  mode: static
  default_resources:
    - appointment_assignments
    - appointments
    - bookings
    - business_units
    - calls
    - campaign_categories
    - campaign_costs
    - campaigns
    - customer_contacts
    - customers
    - employees
    - equipment_systems
    - estimates
    - gl_accounts
    - gross_pay_items
    - installed_equipment
    - inventory_adjustments
    - inventory_returns
    - inventory_templates
    - inventory_transfers
    - invoice_items
    - invoice_templates
    - invoices
    - job_history
    - job_notes
    - job_splits
    - job_timesheets
    - job_types
    - jobs
    - journal_entries
    - journal_entry_details
    - leads
    - location_contacts
    - locations
    - membership_status_changes
    - membership_types
    - memberships
    - non_job_appointments
    - non_job_timesheets
    - payments
    - payroll_adjustments
    - payrolls
    - pricebook_categories
    - pricebook_equipment
    - pricebook_materials
    - pricebook_services
    - projects
    - purchase_orders
    - recurring_service_events
    - recurring_service_types
    - recurring_services
    - tag_types
    - technician_shifts
    - technicians
    - timesheet_activities
    - timesheet_codes
    - vendors
# Resources are grouped by ServiceTitan API family.
includes:
  - resources/jpm.yaml
  - resources/crm.yaml
  - resources/customerinteractions.yaml
  - resources/accounting.yaml
  - resources/inventory.yaml
  - resources/equipmentsystems.yaml
  - resources/pricebook.yaml
  - resources/settings.yaml
  - resources/marketing.yaml
  - resources/telecom.yaml
  - resources/timesheets.yaml
  - resources/payroll.yaml
  - resources/dispatch.yaml
  - resources/memberships.yaml
  - resources/sales.yaml
  - resources/serviceagreements.yaml
