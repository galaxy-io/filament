version: 1
name: "pylon"
display_name: "Pylon"
description: "B2B customer support platform that brings customer conversations across Slack, Microsoft Teams, email, and chat into one workspace."
dark_logo_url: "https://cdn.getgalaxy.io/sources/source-icon-pylon-dark.svg"
light_logo_url: "https://cdn.getgalaxy.io/sources/source-icon-pylon-light.svg"
config:
  api_token: {"type": "secret", "required": true, "help": "Pylon API token from Settings > Integrations & dev > API tokens."}
  region: {"type": "enum", "enum": ["us", "eu"], "default": "us", "help": "Region of your Pylon organization."}
  custom_object_types: {"type": "string", "scope": "pipeline", "default": "", "help": "Comma-separated custom object type slugs. Required for custom_objects. Types cannot be discovered through the API."}
  notebook_account_id: {"type": "string", "scope": "pipeline", "default": "", "help": "Account ID or external ID for notebook_notes."}
  notebook_block_ids: {"type": "string", "scope": "pipeline", "default": "", "help": "Comma-separated Notes block IDs copied from the account notebook UI. Required for notebook_notes."}
  feature_request_ids: {"type": "string", "scope": "pipeline", "default": "", "help": "Comma-separated feature request IDs. Required for feature_requests, which includes evidence. Search returns at most 1000 records."}
  article_language: {"type": "string", "scope": "pipeline", "default": "", "help": "Language code for articles. Empty uses each knowledge base default language. Use separate pipelines and destinations for translations."}
  theme_knowledge_base_id: {"type": "string", "scope": "pipeline", "default": "", "help": "Knowledge base ID for themes. active_themes discovers active themes without this setting."}
  theme_ids: {"type": "string", "scope": "pipeline", "default": "", "help": "Comma-separated theme IDs for themes. The API cannot enumerate inactive themes."}
defaults:
  method: "GET"
field_sets:
  custom_field:
    created_at: "timestamptz?"
    default_value: "string?"
    default_values: "json?"
    description: "string?"
    id: "string"
    is_read_only: "bool?"
    label: "string?"
    number_metadata: "json?"
    object_type: "string?"
    select_metadata: "json?"
    slug: "string?"
    source: "string?"
    type: "string?"
    updated_at: "timestamptz?"
    raw: {"path": "$", "type": "json", "mode": "remainder"}
connection:
  base_url: "https://api.usepylon.com"
  base_url_field: "region"
  base_urls: {"us": "https://api.usepylon.com", "eu": "https://api.eu.usepylon.com"}
  auth:
    bearer: "config.api_token"
  headers: {"Accept": "application/json"}
  timeout_seconds: 60
  rate_limit:
    requests_per_second: 2
    burst: 1
resources:
  - name: "organization"
    path: "/me"
    response:
      records: "$.data"
      pagination: "none"
      strict_records: true
      cardinality: "one"
    primary_key: ["id"]
    fields:
      id: "string"
      name: "string?"
      user: "json?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: "accounts"
    path: "/accounts"
    query: {"limit": "100"}
    response:
      records: "$.data"
      pagination:
        cursor:
          response: "pagination.cursor"
          request: "query.cursor"
          more: "pagination.has_next_page"
          null_terminates: true
      strict_records: true
    primary_key: ["id"]
    fields:
      associated_account_ids: "json?"
      channels: "json?"
      created_at: "timestamptz?"
      crm_settings: "json?"
      custom_fields: "json?"
      domain: "string?"
      domains: "json?"
      external_ids: "json?"
      id: "string"
      is_disabled: "bool?"
      latest_customer_activity_time: "string?"
      latest_vendor_activity_time: "string?"
      logo_url: "string?"
      name: "string?"
      owner: "json?"
      parent_account_id: "string?"
      primary_domain: "string?"
      subaccount_ids: "json?"
      tags: "json?"
      type: "string?"
      updated_at: "timestamptz?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}
    capture: {"account_id": "id"}

  - name: "contacts"
    path: "/contacts"
    query: {"limit": "100"}
    response:
      records: "$.data"
      pagination:
        cursor:
          response: "pagination.cursor"
          request: "query.cursor"
          more: "pagination.has_next_page"
          null_terminates: true
      strict_records: true
    primary_key: ["id"]
    fields:
      account: "json?"
      avatar_url: "string?"
      custom_fields: "json?"
      email: "string?"
      emails: "json?"
      external_ids: "json?"
      id: "string"
      integration_user_ids: "json?"
      name: "string?"
      phone_numbers: "json?"
      portal_role: "string?"
      portal_role_id: "string?"
      primary_phone_number: "string?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: "issues"
    path: "/issues/search"
    method: "POST"
    body:
      encoding: "json"
      template:
        limit: 100
    response:
      records: "$.data"
      pagination:
        cursor:
          response: "pagination.cursor"
          request: "body.cursor"
          more: "pagination.has_next_page"
          null_terminates: true
      strict_records: true
    primary_key: ["id"]
    fields:
      account: "json?"
      active_time_by_user: "json?"
      active_time_seconds: "int64?"
      assignee: "json?"
      attachment_urls: "json?"
      author_unverified: "bool?"
      body_html: "string?"
      business_hours_active_time_seconds: "int64?"
      business_hours_first_response_seconds: "int64?"
      business_hours_resolution_seconds: "int64?"
      business_hours_time_in_status_seconds: "json?"
      chat_widget_info: "json?"
      child_issues: "json?"
      created_at: "timestamptz?"
      csat_responses: "json?"
      custom_fields: "json?"
      customer_portal_visible: "bool?"
      external_incidents: "json?"
      external_issues: "json?"
      first_resolution_time: "timestamptz?"
      first_response_assignee_id_at_breach: "string?"
      first_response_breach_time: "timestamptz?"
      first_response_resolving_user_id: "string?"
      first_response_seconds: "int64?"
      first_response_time: "timestamptz?"
      follow_up: "json?"
      id: "string"
      is_issue_group: "bool?"
      latest_message_time: "timestamptz?"
      link: "string?"
      next_reply: "json?"
      number: "int64?"
      number_of_touches: "int64?"
      parent_issue_group: "json?"
      requester: "json?"
      resolution_assignee_id_at_breach: "string?"
      resolution_breach_time: "timestamptz?"
      resolution_resolving_user_id: "string?"
      resolution_seconds: "int64?"
      resolution_time: "timestamptz?"
      slack: "json?"
      snoozed_until_time: "timestamptz?"
      source: "string?"
      state: "string?"
      tags: "json?"
      team: "json?"
      team_slas: "json?"
      time_in_status_seconds: "json?"
      title: "string?"
      type: "string?"
      updated_at: "timestamptz?"
      workspace_email: "string?"
      workspace_phone_number: "string?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}
    capture: {"issue_id": "id"}

  - name: "users"
    path: "/users"
    query: {"include_deactivated": "true"}
    response:
      records: "$.data"
      pagination: "none"
      strict_records: true
    primary_key: ["id"]
    fields:
      avatar_url: "string?"
      email: "string?"
      emails: "json?"
      id: "string"
      is_deactivated: "bool?"
      name: "string?"
      role: "json?"
      role_id: "string?"
      role_ids: "json?"
      roles: "json?"
      skills: "json?"
      status: "string?"
      raw: {"path": "$", "type": "json", "mode": "remainder"}

  - name: "teams"
    path: "/teams"
    response:
      records: "$.data"
      pagination: "none"
      strict_records: true
    primary_key: ["id"]
    fields:
