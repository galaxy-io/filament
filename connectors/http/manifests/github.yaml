  - name: discussions
    path: /graphql
    method: POST
    for_each: repositories
    primary_key: [id]
    use_fields: [repository_scope]
    fields:
      id: string
      body: string?
      created_at: { path: createdAt, type: timestamptz }
      updated_at: { path: updatedAt, type: timestamptz }
      url: string?
      author: json?
      upvote_count: { path: upvoteCount, type: int64, nullable: true }
      number: int64
      title: string
      closed: bool?
      closed_at: { path: closedAt, type: timestamptz, nullable: true }
      locked: bool?
      category: json?
      answer: json?
      answer_chosen_at: { path: answerChosenAt, type: timestamptz, nullable: true }
      raw: { path: $, type: json, mode: remainder }
    capture: { discussion_id: id, discussion_number: number }
    body:
      encoding: json
      template:
        query: |
          query Discussions($owner: String!, $name: String!, $after: String) {
            repository(owner: $owner, name: $name) {
              discussions(first: 100, after: $after) {
                nodes { id number title body createdAt updatedAt url closed closedAt locked upvoteCount author { login url avatarUrl } category { id name slug } answer { id } answerChosenAt }
                pageInfo { hasNextPage endCursor }
              }
            }
          }
        variables: { owner: '{{ config.organization }}', name: '{{ parent.repository }}' }
    response:
      records: $.data.repository.discussions.nodes
      error: { path: errors, when_present: true, message_path: errors.0.message }
      pagination:
        cursor:
          response: data.repository.discussions.pageInfo.endCursor
          request: body.variables.after
          more: data.repository.discussions.pageInfo.hasNextPage
          null_terminates: true
  - name: discussion_comments
    path: /graphql
    method: POST
    for_each: discussions
    primary_key: [id]
    use_fields: [repository_scope]
    fields:
      id: string
      body: string?
      created_at: { path: createdAt, type: timestamptz }
      updated_at: { path: updatedAt, type: timestamptz }
      url: string?
      author: json?
      upvote_count: { path: upvoteCount, type: int64, nullable: true }
      discussion_id: { path: parent.discussion_id, type: string }
      discussion_number: { path: parent.discussion_number, type: int64 }
      is_answer: { path: isAnswer, type: bool, nullable: true }
      raw: { path: $, type: json, mode: remainder }
    capture: { discussion_comment_id: id }
    body:
      encoding: json
      template:
        query: 'query DiscussionComments($id: ID!, $after: String) { node(id: $id) { ... on Discussion { comments(first: 100, after: $after) { nodes { id body createdAt updatedAt url isAnswer upvoteCount author { login url avatarUrl } } pageInfo { hasNextPage endCursor } } } } }'
        variables: { id: '{{ parent.discussion_id }}' }
    response:
      records: $.data.node.comments.nodes
      error: { path: errors, when_present: true, message_path: errors.0.message }
      pagination:
        cursor:
          response: data.node.comments.pageInfo.endCursor
          request: body.variables.after
          more: data.node.comments.pageInfo.hasNextPage
          null_terminates: true
  - name: discussion_replies
