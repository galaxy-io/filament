version: 1
name: fhir
display_name: FHIR
description: Healthcare interoperability standard for exchanging clinical and administrative information between systems, using the HL7 FHIR R4 API.
dark_logo_url: https://cdn.getgalaxy.io/sources/source-icon-fhir-dark.svg
light_logo_url: https://cdn.getgalaxy.io/sources/source-icon-fhir-light.svg
api_version: "r4"
config:
  base_url:
    type: string
    default: https://hapi.fhir.org/baseR4
    help: FHIR base URL, e.g. https://hapi.fhir.org/baseR4
connection:
  base_url: "{{ config.base_url }}"
  auth:
    none: {}
  headers:
    Accept: application/fhir+json
  timeout_seconds: 60
  rate_limit:
    requests_per_second: 5
defaults:
  method: GET
  query:
    _count: "100"
  response:
    # A searchset Bundle can carry an OperationOutcome entry (search.mode:
    # "outcome") alongside matches; only match entries project to rows.
    records: '$.entry.#(search.mode=="match")#'
  # FHIR Bundle.link is an array of {"relation","url"} objects; follow the
  # entry whose relation is "next".
  pagination:
    next_url: link[relation=next].url
resources:
  - name: patients
    path: /Patient
    primary_key: ["id"]
    incremental:
      cursor_field: last_updated
      checkpoint_key: patients_last_updated
      start_param: _lastUpdated
      inject_into: query
      comparator: time
      # Re-read a small window: resources updated while the scan runs would
      # otherwise fall behind the advancing watermark.
      overlap_seconds: 300
      # FHIR date search needs the comparator as a value prefix
      # (_lastUpdated=ge<ts>); a bare timestamp means "equal".
      value_prefix: "ge"
    fields:
      id:
        path: resource.id
        type: string
      last_updated:
        path: resource.meta.lastUpdated
        type: timestamptz
      resource:
        path: resource
        type: json
  - name: observations
    path: /Observation
    primary_key: ["id"]
    incremental:
      cursor_field: last_updated
      checkpoint_key: observations_last_updated
      start_param: _lastUpdated
      inject_into: query
      comparator: time
      overlap_seconds: 300
      value_prefix: "ge"
    fields:
      id:
        path: resource.id
        type: string
      last_updated:
        path: resource.meta.lastUpdated
        type: timestamptz
      resource:
        path: resource
        type: json
  - name: conditions
    path: /Condition
    primary_key: ["id"]
    incremental:
      cursor_field: last_updated
      checkpoint_key: conditions_last_updated
      start_param: _lastUpdated
      inject_into: query
      comparator: time
      overlap_seconds: 300
      value_prefix: "ge"
    fields:
      id:
        path: resource.id
        type: string
      last_updated:
        path: resource.meta.lastUpdated
        type: timestamptz
      resource:
        path: resource
        type: json
  - name: encounters
    path: /Encounter
    primary_key: ["id"]
    incremental:
      cursor_field: last_updated
      checkpoint_key: encounters_last_updated
      start_param: _lastUpdated
      inject_into: query
      comparator: time
      overlap_seconds: 300
      value_prefix: "ge"
    fields:
      id:
        path: resource.id
        type: string
      last_updated:
        path: resource.meta.lastUpdated
        type: timestamptz
      resource:
        path: resource
        type: json
  - name: medication_requests
    path: /MedicationRequest
    primary_key: ["id"]
    incremental:
      cursor_field: last_updated
      checkpoint_key: medication_requests_last_updated
      start_param: _lastUpdated
      inject_into: query
      comparator: time
      overlap_seconds: 300
      value_prefix: "ge"
    fields:
      id:
        path: resource.id
        type: string
      last_updated:
        path: resource.meta.lastUpdated
        type: timestamptz
      resource:
        path: resource
        type: json
  - name: allergy_intolerance
    path: /AllergyIntolerance
    primary_key: ["id"]
    incremental:
      cursor_field: last_updated
      checkpoint_key: allergy_intolerance_last_updated
      start_param: _lastUpdated
      inject_into: query
      comparator: time
      overlap_seconds: 300
      value_prefix: "ge"
    fields:
      id:
        path: resource.id
        type: string
      last_updated:
        path: resource.meta.lastUpdated
        type: timestamptz
      resource:
        path: resource
        type: json
  - name: immunizations
    path: /Immunization
    primary_key: ["id"]
    incremental:
      cursor_field: last_updated
      checkpoint_key: immunizations_last_updated
      start_param: _lastUpdated
      inject_into: query
