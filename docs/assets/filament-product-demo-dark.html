        + '<div class="node-island"><div class="node-head">' + tile('postgres') + '<span class="nm">prod-postgres</span></div></div>'
        + '<div class="node-island"><div class="node-tables" data-tables>' + TABLES.map(function (t) { return '<div class="trow"><span class="tname">' + t + '</span><span class="port-slot"><span class="port"></span></span></div>'; }).join('') + '</div></div></div>'
        + '<div class="node"><div class="kindrow"><span class="chip pink">Sink</span><span class="acts"><span class="act">' + svg(IC.trash) + '</span></span></div>'
        + '<div class="node-island"><div class="node-head"><span class="port-slot"><span class="port" data-sink-port></span></span>' + tile('clickhouse') + '<span class="nm">clickhouse</span></div></div></div>'
        + '</div></div><div class="minimap"><i style="left:26px;top:22px;width:44px;height:48px"></i><i style="left:96px;top:38px;width:40px;height:16px"></i></div>'
        + '<div class="controls"><span>' + svg(IC.plus) + '</span><span>' + svg(IC.minus) + '</span><span>' + svg(IC.reset) + '</span></div></div></div></div>';
      logos(canvasScene);
      stopActivity();
      panelEl = null;
      canvasEl = canvasScene.querySelector('[data-canvas]');
      edgesSvg = canvasScene.querySelector('[data-edges]');
      tablesEl = canvasScene.querySelector('[data-tables]');
      pipeActs = canvasScene.querySelector('[data-pipe-actions]');
      edgePaths = [];
      fitStage();
    }
    function runEvents() {
      var out = [['run.requested', '', ''], ['run.started', '', '']];
      var totalRec = 0, totalBytes = 0, cpu = 0.9, mem = 486539264;
      TABLES.forEach(function (t, i) {
        var pages = 5 + (i % 3), rec = 0, bytes = 0;
        out.push(['resource.started', t, '']);
        if (i === 2) out.push(['resource.fan_out_started', t, '']);
        for (var p = 0; p < pages; p++) {
          var r = 1480000 + ((i * 421103 + p * 373907) % 420000), by = r * 178;
          rec += r; bytes += by;
          out.push(['resource.page_fetched', t, 'records=' + r.toLocaleString('en-US') + ' bytes=' + by.toLocaleString('en-US')]);
          if (p === 2) {
            cpu += 2.4 + i * 0.6;
            mem += 92274688;
            out.push(['run.heartbeat', '', 'cpuSeconds=' + cpu.toFixed(1) + ' memoryBytes=' + mem.toLocaleString('en-US')]);
          }
        }
        out.push(['resource.completed', t, 'records=' + rec.toLocaleString('en-US') + ' bytes=' + bytes.toLocaleString('en-US')]);
        totalRec += rec; totalBytes += bytes;
      });
      out.push(['run.completed', '', 'records=' + totalRec.toLocaleString('en-US') + ' bytes=' + totalBytes.toLocaleString('en-US')]);
      return out;
    }
    function openPanel() {
      var wrap = document.createElement('div');
      wrap.className = 'panel';
      wrap.innerHTML = '<div class="panel-tabs"><span class="tabs"><span class="tab">Overview</span><span class="tab is-on">Activity</span></span><span class="btn secondary sm" style="padding:0 6px">' + svg(IC.x) + '</span></div><div class="hr"></div><div class="activity" data-activity></div>';
      canvasEl.appendChild(wrap);
      panelEl = wrap;
      activityEl = wrap.querySelector('[data-activity]');
      canvasEl.classList.add('is-panel');
      requestAnimationFrame(function () { wrap.classList.add('is-in'); });
      fitStage();
      trackEdges(fitMs());
    }
    function streamActivity() {
      var evs = runEvents(), t = new Date(), i = 0;
      t.setSeconds(t.getSeconds() - 1);
      activityEl.innerHTML = '<span class="listening">Listening...</span>';
      var tail = activityEl.querySelector('.listening');
      (function push() {
        if (i >= evs.length) { tail.remove(); activityEl.scrollTop = activityEl.scrollHeight; return; }
        var e = evs[i++];
        t.setSeconds(t.getSeconds() + (i % 3 === 0 ? 1 : 0));
        var stamp = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
        var detail = [e[1], e[2]].filter(Boolean).join(' ');
        var cls = e[0] === 'run.completed' ? ' ok' : (e[0] === 'run.heartbeat' ? ' dim' : '');
        var line = document.createElement('div');
        line.className = 'aline';
        line.innerHTML = '<span class="ts">' + stamp + '</span><span class="ev' + cls + '">' + e[0] + (detail ? ' ' + detail : '') + '</span>';
        activityEl.insertBefore(line, tail);
        activityEl.scrollTop = activityEl.scrollHeight;
        logT.push(setTimeout(push, (62 + (i % 5) * 22) / SPEED));
      })();
    }
    function stopActivity() { logT.forEach(clearTimeout); logT = []; }
    function portAt(el) {
      var c = canvasEl.getBoundingClientRect(), b = el.getBoundingClientRect();
      return { x: b.left - c.left + b.width / 2, y: b.top - c.top + b.height / 2, r: b.width / 2 };
    }
    function edgeAt(i) {
      var p = edgePaths[i];
      if (!p) {
        p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('class', 'edge');
        edgesSvg.appendChild(p);
        edgePaths[i] = p;
      }
      return p;
    }
    function drawEdges() {
      if (!canvasEl || !edgesSvg || !tablesEl) return;
      var c = canvasEl.getBoundingClientRect();
      if (edgesSvg.getAttribute('width') !== String(c.width)) {
        edgesSvg.setAttribute('viewBox', '0 0 ' + c.width + ' ' + c.height);
        edgesSvg.setAttribute('width', c.width);
        edgesSvg.setAttribute('height', c.height);
      }
      var sink = portAt(canvasScene.querySelector('[data-sink-port]'));
      var rows = tablesEl.querySelectorAll('.trow.is-conn');
      rows.forEach(function (row, i) {
        var p = portAt(row.querySelector('.port'));
        var sx = p.x + p.r + 1, sy = p.y, tx = sink.x - sink.r - 1, ty = sink.y, dx = Math.max(18, (tx - sx) * 0.55);
        edgeAt(i).setAttribute('d', 'M' + sx + ',' + sy + ' C' + (sx + dx) + ',' + sy + ' ' + (tx - dx) + ',' + ty + ' ' + tx + ',' + ty);
      });
      while (edgePaths.length > rows.length) edgePaths.pop().remove();
    }
    function fitStage() {
      var stage = canvasScene.querySelector('.stage'), graph = canvasScene.querySelector('[data-graph]');
      if (!stage || !graph) return;
      var cv = getComputedStyle(canvasEl);
      var padR = parseFloat(cv.getPropertyValue('--pad-r')) || 24, gap = parseFloat(cv.getPropertyValue('--graph-gap')) || 0;
      var nodes = graph.querySelectorAll('.node'), need = gap * (nodes.length - 1);
      nodes.forEach(function (n) { need += n.offsetWidth; });
      var avail = stage.clientWidth - 24 - padR;
      if (avail <= 0 || need <= 0) return;
      graph.style.setProperty('--zoom', Math.max(0.62, Math.min(1, avail / need)).toFixed(3));
    }
    function fitMs() {
      var el = canvasScene.querySelector('[data-graph]');
      var d = el ? parseFloat(getComputedStyle(el).transitionDuration) * 1000 : 0;
      return (d > 0 ? d : 340) + 120;
    }
    function trackEdges(ms) {
      if (trackRaf) cancelAnimationFrame(trackRaf);
      var t0 = Date.now();
      (function frame() {
        drawEdges();
        trackRaf = Date.now() - t0 < ms ? requestAnimationFrame(frame) : null;
      })();
    }
    function setScene(name) {
      setupScene.classList.toggle('is-on', name === 'setup');
      canvasScene.classList.toggle('is-on', name === 'canvas');
      if (name === 'canvas') { fitStage(); drawEdges(); }
    }
    function closeModal() {
      overlay.classList.remove('is-on');
      return wait(260).then(function () { overlay.innerHTML = ''; });
    }
    function connectionFlow(kind, spec, fields) {
      return click(stepsEl.querySelector('[data-step="' + kind + '"]'))
        .then(function () { return openSelector(kind); })
        .then(function () { return wait(420); })
        .then(function () {
          var card = overlay.querySelector('[data-connector="' + spec.n + '"]');
          card.classList.add('is-hot');
          return click(card.querySelector('.btn'));
        })
        .then(closeModal)
        .then(function () { return openConfigure(kind, spec, fields); })
        .then(function () { return wait(340); })
        .then(function () {
          var chain = Promise.resolve();
          fields.forEach(function (f) {
            chain = chain.then(function () {
              var el = overlay.querySelector('[data-field="' + f.key + '"]');
              return click(el).then(function () { el.classList.add('is-focus'); return type(el, f.value); }).then(function () { return wait(180); });
            });
          });
          return chain;
        })
        .then(function () { return wait(240); })
        .then(function () { return click(overlay.querySelector('[data-create]')); })
        .then(closeModal)
        .then(function () { done++; renderSteps(); return wait(1500); });
    }
    function pipelineFlow() {
      return click(stepsEl.querySelector('[data-step="pipeline"]'))
        .then(function () {
          buildCanvas();
          setScene('canvas');
          pipeActs.innerHTML = RUN_BTN;
          var rows = tablesEl.querySelectorAll('.trow');
          for (var i = 0; i < rows.length - 1; i++) {
            rows[i].classList.add('is-conn');
            rows[i].querySelector('.port').classList.add('is-conn');
          }
          canvasScene.querySelector('[data-sink-port]').classList.add('is-conn');
          drawEdges();
          return wait(1100);
        })
        .then(function () {
          var rows = tablesEl.querySelectorAll('.trow'), last = rows[rows.length - 1];
          return moveTo(last.querySelector('.port'))
            .then(function () { return tap(); })
            .then(function () { return moveTo(canvasScene.querySelector('[data-sink-port]')); })
            .then(function () {
              last.classList.add('is-conn');
              last.querySelector('.port').classList.add('is-conn');
              drawEdges();
              pipeActs.innerHTML = SAVE_BTN;
              return wait(600);
            });
        })
        .then(function () { return click(pipeActs.querySelector('[data-save]')); })
        .then(function () { pipeActs.innerHTML = RUN_BTN; return wait(1000); })
        .then(function () { return click(pipeActs.querySelector('[data-run]')); })
        .then(function () {
          pipeActs.innerHTML = RUNNING;
          canvasEl.classList.add('is-running');
          openPanel();
          streamActivity();
          return wait(8000);
        })
        .then(function () {
          canvasEl.classList.remove('is-running');
          stopActivity();
          pipeActs.innerHTML = COMPLETED;
          return wait(4200);
        });
    }
    function loop() {
      var g = gen;
      done = 0;
      renderSteps();
      setScene('setup');
      wait(1000)
        .then(function () {
          return connectionFlow('source', byName(SOURCES, 'postgres'), [
            { key: 'name', label: 'Name', value: 'prod-postgres' },
            { key: 'dsn', label: 'DSN', value: 'postgresql://app@db.acme.io:5432/shop?sslmode=require' }
          ]);
        })
        .then(function () {
          return connectionFlow('sink', byName(SINKS, 'clickhouse'), [
            { key: 'name', label: 'Name', value: 'clickhouse' },
            { key: 'dsn', label: 'DSN', value: 'clickhouse://default@acme.clickhouse.cloud:8443/analytics' }
          ]);
        })
        .then(pipelineFlow)
        .then(function () { if (g.alive) loop(); })
        .catch(function () {});
    }
    function start() {
      stop();
      gen = { alive: true };
      overlay.classList.remove('is-on');
      overlay.innerHTML = '';
      cursor.style.transform = 'translate(160px, 420px)';
      loop();
    }
    function stop() {
      gen.alive = false;
      stopActivity();
      if (trackRaf) { cancelAnimationFrame(trackRaf); trackRaf = null; }
    }
    if (window.ResizeObserver) new ResizeObserver(function () {
      if (canvasEl && canvasScene.classList.contains('is-on')) { fitStage(); drawEdges(); }
    }).observe(app);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && gen.alive) start(); });
    if (window.IntersectionObserver) {
      new IntersectionObserver(function (es) {
        if (es[0].isIntersecting) { if (!gen.alive) start(); } else stop();
      }, { threshold: 0.12 }).observe(root);
    } else {
      start();
    }
  }
  function scan() {
    var f = document.querySelectorAll('[data-gx="' + SLUG + '"]');
    for (var i = 0; i < f.length; i++) boot(f[i]);
    return f.length > 0;
  }
  if (!scan()) {
    var tries = 0, t = setInterval(function () { if (scan() || ++tries > 100) clearInterval(t); }, 50);
    document.addEventListener('DOMContentLoaded', scan);
  }
})();
</script>
</div>
