      return moveTo(toEl).then(function () {
        live = false;
        cancelAnimationFrame(raf);
        cursor.classList.remove('is-drag');
        fromPort.classList.remove('is-live');
        draftFrom = null;
      });
    }
    function openPanel() {
      var wrap = document.createElement('div');
      wrap.className = 'panel';
      wrap.innerHTML = '<div class="grab"><i></i></div><div class="panel-tabs"><span class="tabs"><span class="tab">Overview</span><span class="tab is-on">Activity</span></span></div><div class="hr"></div><div class="activity" data-activity></div>';
      canvasScreen.appendChild(wrap);
      panelEl = wrap;
      activityEl = wrap.querySelector('[data-activity]');
      canvasEl.classList.add('is-panel');
      requestAnimationFrame(function () { wrap.classList.add('is-in'); });
      trackEdges(fitMs());
    }
    function runEvents() {
      var out = [['run.requested', '', ''], ['run.started', '', '']];
      var totalRec = 0, totalBytes = 0, cpu = 0.9, mem = 486539264;
      TABLES.forEach(function (t, i) {
        var pages = 5 + (i % 3), rec = 0, bytes = 0;
        out.push(['resource.started', t, '']);
        if (i === 2) out.push(['resource.fan_out_started', t, '']);
        for (var p = 0; p < pages; p++) {
          var r = 1480000 + ((i * 421103 + p * 373907) % 420000), by = r * 178;
          rec += r; bytes += by;
          out.push(['resource.page_fetched', t, 'records=' + r.toLocaleString('en-US') + ' bytes=' + by.toLocaleString('en-US')]);
          if (p === 2) {
            cpu += 2.4 + i * 0.6;
            mem += 92274688;
            out.push(['run.heartbeat', '', 'cpuSeconds=' + cpu.toFixed(1) + ' memoryBytes=' + mem.toLocaleString('en-US')]);
          }
        }
        out.push(['resource.completed', t, 'records=' + rec.toLocaleString('en-US') + ' bytes=' + bytes.toLocaleString('en-US')]);
        totalRec += rec; totalBytes += bytes;
      });
      out.push(['run.completed', '', 'records=' + totalRec.toLocaleString('en-US') + ' bytes=' + totalBytes.toLocaleString('en-US')]);
      return out;
    }
    function streamActivity() {
      var evs = runEvents(), t = new Date(), i = 0;
      t.setSeconds(t.getSeconds() - 1);
      activityEl.innerHTML = '<span class="listening">Listening...</span>';
      var tail = activityEl.querySelector('.listening');
      (function push() {
        if (i >= evs.length) { tail.remove(); activityEl.scrollTop = activityEl.scrollHeight; return; }
        var e = evs[i++];
        t.setSeconds(t.getSeconds() + (i % 3 === 0 ? 1 : 0));
        var stamp = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
        var cls = e[0] === 'run.completed' ? ' ok' : (e[0] === 'run.heartbeat' ? ' dim' : '');
        var line = document.createElement('div');
        line.className = 'aline';
        line.innerHTML = '<span class="ahead"><span class="ts">' + stamp + '</span><span class="ev' + cls + '">' + e[0] + (e[1] ? ' ' + e[1] : '') + '</span></span>' + (e[2] ? '<span class="det' + cls + '">' + e[2] + '</span>' : '');
        activityEl.insertBefore(line, tail);
        activityEl.scrollTop = activityEl.scrollHeight;
        logT.push(setTimeout(push, (76 + (i % 5) * 24) / SPEED));
      })();
    }
    function stopActivity() { logT.forEach(clearTimeout); logT = []; }
    function connectionFlow(kind, spec, query, fields) {
      return click(stepsEl.querySelector('[data-step="' + kind + '"]'))
        .then(function () { return openSheet(kind); })
        .then(function () { return wait(420); })
        .then(function () {
          var s = sheet.querySelector('[data-search]');
          return click(s).then(function () { s.classList.add('is-focus'); return typeInto(s.querySelector('.val'), query, filterList); });
        })
        .then(function () { return wait(560); })
        .then(function () {
          var row = sheet.querySelector('[data-connector="' + spec.n + '"]');
          row.classList.add('is-hot');
          return click(row);
        })
        .then(function () { return pushConfigure(kind, spec, fields); })
        .then(function () { return wait(280); })
        .then(function () {
          var chain = Promise.resolve();
          fields.forEach(function (f) {
            chain = chain.then(function () {
              var el = sheet.querySelector('[data-field="' + f.key + '"]');
              return click(el).then(function () { el.classList.add('is-focus'); return type(el, f.value); }).then(function () { return wait(200); });
            });
          });
          return chain;
        })
        .then(function () { return wait(280); })
        .then(function () { return click(sheet.querySelector('[data-create]')); })
        .then(closeSheet)
        .then(function () { done++; renderSteps(); return wait(1500); });
    }
    function pipelineFlow() {
      return click(stepsEl.querySelector('[data-step="pipeline"]'))
        .then(function () {
          buildCanvas();
          canvasScreen.classList.add('is-on');
          mainScreen.classList.add('is-under');
          pipeActs.innerHTML = RUN_BTN;
          return wait(520);
        })
        .then(function () {
          var rows = tablesEl.querySelectorAll('.trow');
          for (var i = 0; i < rows.length - 1; i++) {
            rows[i].classList.add('is-conn');
            rows[i].querySelector('.port').classList.add('is-conn');
          }
          canvasScreen.querySelector('[data-sink-port]').classList.add('is-conn');
          drawEdges();
          return wait(1000);
        })
        .then(function () {
          var rows = tablesEl.querySelectorAll('.trow'), last = rows[rows.length - 1], port = last.querySelector('.port');
          return moveTo(port)
            .then(function () { return tap(); })
            .then(function () { return dragWire(port, canvasScreen.querySelector('[data-sink-port]')); })
            .then(function () {
              last.classList.add('is-conn');
              port.classList.add('is-conn');
              drawEdges();
              pipeActs.innerHTML = SAVE_BTN;
              return wait(620);
            });
        })
        .then(function () { return click(pipeActs.querySelector('[data-save]')); })
        .then(function () { pipeActs.innerHTML = RUN_BTN; return wait(950); })
        .then(function () { return click(pipeActs.querySelector('[data-run]')); })
        .then(function () {
          pipeActs.innerHTML = RUNNING;
          canvasEl.classList.add('is-running');
          openPanel();
          streamActivity();
          return wait(8600);
        })
        .then(function () {
          canvasEl.classList.remove('is-running');
          stopActivity();
          pipeActs.innerHTML = COMPLETED;
          return wait(4200);
        })
        .then(function () {
          canvasScreen.classList.remove('is-on');
          mainScreen.classList.remove('is-under');
          return wait(460);
        });
    }
    function loop() {
      var g = gen;
      done = 0;
      renderSteps();
      wait(1100)
        .then(function () {
          return connectionFlow('source', byName(SOURCES, 'postgres'), 'post', [
            { key: 'name', label: 'Name', ph: 'prod-db', value: 'prod-postgres' },
            { key: 'dsn', label: 'DSN', ph: 'postgresql://…', value: 'postgresql://app@db.acme.io:5432/shop?sslmode=require' }
          ]);
        })
        .then(function () {
          return connectionFlow('sink', byName(SINKS, 'clickhouse'), 'click', [
            { key: 'name', label: 'Name', ph: 'warehouse', value: 'clickhouse' },
            { key: 'dsn', label: 'DSN', ph: 'clickhouse://…', value: 'clickhouse://default@acme.clickhouse.cloud:8443/analytics' }
          ]);
        })
        .then(pipelineFlow)
        .then(function () { if (g.alive) loop(); })
        .catch(function () {});
    }
    function start() {
      stop();
      gen = { alive: true };
      if (sheet) sheet.remove();
      sheet = null; stackEl = null;
      scrim.classList.remove('is-on');
      canvasScreen.classList.remove('is-on');
      canvasScreen.innerHTML = '';
      mainScreen.classList.remove('is-under');
      cursor.style.transform = 'translate(196px, 520px)';
      loop();
    }
    function stop() {
      gen.alive = false;
      stopActivity();
      if (trackRaf) { cancelAnimationFrame(trackRaf); trackRaf = null; }
    }
    if (window.ResizeObserver) new ResizeObserver(drawEdges).observe(app);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && gen.alive) start(); });
    if (window.IntersectionObserver) {
      new IntersectionObserver(function (es) {
        if (es[0].isIntersecting) { if (!gen.alive) start(); } else stop();
      }, { threshold: 0.12 }).observe(root);
    } else {
      start();
    }
  }
  function scan() {
    var f = document.querySelectorAll('[data-gx="' + SLUG + '"]');
    for (var i = 0; i < f.length; i++) boot(f[i]);
    return f.length > 0;
  }
  if (!scan()) {
    var tries = 0, t = setInterval(function () { if (scan() || ++tries > 100) clearInterval(t); }, 50);
    document.addEventListener('DOMContentLoaded', scan);
  }
})();
</script>
</div>
