<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Filament for mobile — onboarding, in three steps</title>
<!-- ══════════════════════════════════════════════════════════════════════
     FILAMENT — the onboarding checklist, animated. MOBILE.

     The phone edition of gx-filament-walkthrough.html. Same story, same
     data, same Filament palette — re-laid out as a native mobile app rather
     than a squeezed desktop page:

       · a top app bar + a four-item bottom tab bar
         (Observability / Pipelines / Sources / Sinks — the real
         MainLayoutNavbar items)
       · the connector picker is a bottom sheet you SEARCH rather than a
         900px three-column grid you scan, and choosing a connector
         pushes the configure form in as a second pane while the sheet
         drops to a shorter detent
       · the pipeline canvas is a screen push, tab bar hidden, graph
         rotated to flow top-to-bottom with the wires running down the
         right-hand gutter
       · the last wire is DRAGGED into place with a touch point
       · Run opens the Activity panel as a bottom sheet, the canvas
         zooms out to clear it the way fitView would, and every event
         wraps to two lines so the record counts stay readable

     Self-contained — only the two webfonts are fetched.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
@font-face{font-family:"ABC Diatype";src:url("https://cdn.getgalaxy.io/fonts/Diatype/ABCDiatype-Regular.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"ABC Diatype";src:url("https://cdn.getgalaxy.io/fonts/Diatype/ABCDiatype-Medium.otf") format("opentype");font-weight:500;font-display:swap}
@font-face{font-family:"Berkeley Mono";src:url("https://cdn.getgalaxy.io/fonts/BerkeleyMono/BerkeleyMono-Regular.otf") format("opentype");font-weight:400;font-display:swap}

:root {
  /* FILAMENT palette — the same tokens as gx-card-replicate-canvas;
     muted tones are tints of #fdfefc */
  --bg-base:      #1c1c1c;   /* window + canvas      */
  --bg-primary:   #202020;   /* islands              */
  --bg-secondary: #282828;   /* tiles, cards, inputs */
  --bg-tertiary:  #242424;   /* active rail item     */
  --bg-success:   #1d3329;
  --bg-lime:      #2b3619;
  --bg-pink:      #3a1f2e;

  --bd-primary:   #282828;   /* hairline + idle edge */
  --bd-secondary: rgba(253, 254, 252, 0.10);
  --bd-tertiary:  rgba(253, 254, 252, 0.18);

  --tx-primary:   #fdfefc;
  --tx-secondary: rgba(253, 254, 252, 0.62);
  --tx-tertiary:  rgba(253, 254, 252, 0.40);
  --tx-disabled:  rgba(253, 254, 252, 0.28);
  --tx-success:   #6ee4b0;
  --tx-error:     #ff6881;
  --tx-lime:      #d5f2a7;
  --tx-pink:      #f3a8e5;

  --galaxy:       #015fff;   /* accent               */
  --galaxy-rgb:   1, 95, 255;
  --galaxy-alt:   #4c9eff;   /* drag / draft wire    */
  --ic-success:   #6ee4b0;   /* success              */
  --beacon:       #4c9eff;
  --dot:          #282828;   /* dot grid = border    */

  --sans: "ABC Diatype", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Berkeley Mono", ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  --ease: cubic-bezier(.22,1,.36,1);
  --fit:  360ms;                /* the Activity move: sheet up, canvas insets */
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #121212;
  color: var(--tx-primary);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 15px;
  letter-spacing: 0.13px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}

/* ── the device viewport ────────────────────────────────────────────── */
/* full-bleed on a phone; a centred 390×844 column anywhere wider, with
   the app's own corner radius — no bezel, no fake status bar */
.page {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #121212;
}
.app {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 390px;
  max-height: 844px;
  background: var(--bg-base);
  overflow: hidden;
}
@media (min-width: 431px) { .app { border-radius: 26px; } }

.hr { width: 100%; height: 0.5px; background: var(--bd-primary); flex-shrink: 0; }

/* ── screens, pushed like a nav stack ───────────────────────────────── */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg-base);
  overflow: hidden;
}
/* the screen behind a sheet settles back a touch, the way a presented
   sheet scales its presenter — never shifts, so nothing clips off-edge */
.screen.main { transition: transform 400ms var(--ease); transform-origin: 50% 0; }
.screen.main.is-under { transform: scale(0.955) translateY(8px); }
.screen.canvas-screen {
  z-index: 10;
  transform: translateX(100%);
  transition: transform 400ms var(--ease);
}
.screen.canvas-screen.is-on { transform: none; }

/* ── app bar ────────────────────────────────────────────────────────── */
.topbar {
  height: 52px;
  flex-shrink: 0;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-base);
}
.topbar .wm { display: block; width: auto; height: 17px; }
.topbar .l { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.topbar .r { flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
.topbar .pname {
  flex: 1; min-width: 0;
  font-size: 14px; font-weight: 500; letter-spacing: 0.14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
  width: 30px; height: 30px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  margin-left: -6px;
  border-radius: 7px;
  color: var(--tx-secondary);
}
.icon-btn svg { width: 17px; height: 17px; display: block; }

/* ── the setup checklist ────────────────────────────────────────────── */
.content {
  flex: 1;
  min-height: 0;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 18px;
  overflow-y: auto;
}
.lede { display: flex; flex-direction: column; gap: 5px; padding: 0 2px; }
.lede h1 { font-size: 18px; line-height: 21px; letter-spacing: 0.18px; font-weight: 500; }
.lede p { color: var(--tx-secondary); font-size: 13px; line-height: 16px; }

.card {
  width: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg-secondary);
  border: 0.5px solid var(--galaxy);
  border-radius: 10px;
  overflow: hidden;
}
.card .count { padding: 12px 14px; font-size: 12px; color: var(--tx-secondary); }

.step {
  width: 100%;
  padding: 13px 14px;
  display: flex;
  align-items: flex-start;
  gap: 11px;
  transition: opacity 300ms ease;
}
.step.upcoming { opacity: 0.55; }
.step .marker { flex-shrink: 0; height: 17px; display: flex; align-items: center; }
.step .marker svg { width: 18px; height: 18px; display: block; }
.step.upcoming .marker { color: var(--tx-tertiary); }
.step.active   .marker { color: var(--tx-primary); }
.step.done     .marker { color: var(--ic-success); }
.step .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.step .hdr { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.step .txt b { font-size: 14px; line-height: 17px; letter-spacing: 0.14px; font-weight: 500; }
.step.done .txt b { color: var(--tx-secondary); }
.step .txt p { font-size: 12px; line-height: 15px; color: var(--tx-tertiary); }
.step.done .txt p { color: var(--tx-disabled); }
/* on a phone the action is a full-width target under its own step */
.step .act { margin-top: 9px; }

.progress { width: 100%; height: 4px; border-radius: 2px; background: var(--bg-secondary); overflow: hidden; }
.progress i {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--galaxy);
  border-radius: 2px;
  transition: width 520ms var(--ease);
}

/* ── DLS primitives, scaled up for thumbs ───────────────────────────── */
.btn {
  height: 30px;
  padding: 0 11px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 0.5px solid transparent;
  border-radius: 6px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.13px;
  white-space: nowrap;
  transition: transform 120ms var(--ease);
}
.btn svg { width: 13px; height: 13px; flex-shrink: 0; }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12px; }
.btn.lg { height: 40px; padding: 0 14px; font-size: 14px; border-radius: 8px; }
.btn.primary   { background: var(--galaxy); color: #fdfefc; }
.btn.alt       { background: var(--tx-primary); color: #1c1c1c; }
.btn.secondary { background: var(--bg-secondary); border-color: var(--bd-primary); color: var(--tx-primary); }
.btn.tertiary  { background: transparent; color: var(--tx-secondary); }
.btn.full      { width: 100%; justify-content: center; }
.btn.is-press  { transform: scale(0.965); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 19px;
  padding: 0 6px;
  border-radius: 4px;
  font-size: 11px;
  line-height: 13px;
  letter-spacing: 0.11px;
  white-space: nowrap;
  flex-shrink: 0;
}
.chip svg { width: 10px; height: 10px; }
.chip.lime    { background: var(--bg-lime);    color: var(--tx-lime); }
.chip.pink    { background: var(--bg-pink);    color: var(--tx-pink); }
.chip.success { background: var(--bg-success); color: var(--tx-success); }

.tile {
  width: 26px; height: 26px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-secondary);
  border: 0.5px solid var(--bd-tertiary);
  border-radius: 6px;
  overflow: hidden;
}
.tile img { width: 17px; height: 17px; display: block; object-fit: contain; }
.tile .fb { font-family: var(--mono); font-size: 13px; color: var(--tx-secondary); }
.tile.sm { width: 22px; height: 22px; border-radius: 5px; }
.tile.sm img { width: 14px; height: 14px; }
.tile.lg { width: 38px; height: 38px; border-radius: 9px; }
.tile.lg img { width: 25px; height: 25px; }
.tile.lg .fb { font-size: 15px; }

.input {
  height: 40px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--bg-secondary);
  border: 0.5px solid var(--bd-primary);
  border-radius: 8px;
  color: var(--tx-tertiary);
  font-size: 14px;
  overflow: hidden;
  transition: border-color 140ms ease;
}
.input svg { width: 15px; height: 15px; color: var(--tx-tertiary); flex-shrink: 0; }
/* the value never wraps — the field scrolls as it fills, the way a real
   text input does, so a long DSN stays on one line */
.input .val { flex: 0 0 auto; color: var(--tx-primary); white-space: nowrap; }
.input .val.ph { color: var(--tx-tertiary); }
.input.is-focus { border-color: var(--bd-tertiary); }

.txt-sm { font-size: 12px; line-height: 15px; }
.t2 { color: var(--tx-secondary); }
.t3 { color: var(--tx-tertiary); }
.med { font-weight: 500; }

/* ── bottom sheet ───────────────────────────────────────────────────── */
.scrim {
  position: absolute;
  inset: 0;
  z-index: 60;
  background: rgba(0, 0, 0, 0.55);
  opacity: 0;
  pointer-events: none;
  transition: opacity 260ms ease;
}
.scrim.is-on { opacity: 1; }

.sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 70;
  height: 640px;
  max-height: 86%;
  display: flex;
  flex-direction: column;
  background: var(--bg-primary);
  border-top: 0.5px solid var(--bd-secondary);
  border-radius: 16px 16px 0 0;
  overflow: hidden;
  transform: translateY(101%);
  transition: transform 340ms var(--ease), height 340ms var(--ease);
}
.sheet.is-in  { transform: none; }
.sheet.is-cfg { height: 372px; }

.grab { flex-shrink: 0; height: 18px; display: flex; align-items: center; justify-content: center; }
.grab i { display: block; width: 34px; height: 4px; border-radius: 2px; background: var(--bd-tertiary); }

/* two panes on one rail — picking pushes to configuring */
.stack { flex: 1; min-height: 0; display: flex; width: 200%; transition: transform 340ms var(--ease); }
.stack.is-2 { transform: translateX(-50%); }
.pane { width: 50%; min-width: 0; display: flex; flex-direction: column; }

.s-head { flex-shrink: 0; padding: 4px 16px 12px; display: flex; align-items: center; gap: 11px; }
.s-head .titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.s-head .titles b { font-size: 17px; line-height: 20px; letter-spacing: 0.17px; font-weight: 500; }
.s-search { flex-shrink: 0; padding: 0 16px 12px; }

.s-list {
  flex: 1; min-height: 0;
  overflow-y: auto;
  background: var(--bg-base);
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
}
.c-row {
  padding: 11px 16px;
  display: flex;
  align-items: center;
  gap: 11px;
  border-bottom: 0.5px solid var(--bd-primary);
  transition: background-color 140ms ease;
}
.c-row:last-child { border-bottom: none; }
.c-row.is-off { display: none; }
.c-row.is-hot { background: var(--bg-secondary); }
.c-row .c-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.c-row .c-nm { font-size: 14px; line-height: 17px; font-weight: 500; letter-spacing: 0.14px; }
.c-row .c-desc {
  font-size: 12px; line-height: 15px; color: var(--tx-tertiary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.c-row .caret { width: 13px; height: 13px; flex-shrink: 0; color: var(--tx-disabled); }
.c-row .caret svg { width: 100%; height: 100%; display: block; }

.s-body { flex: 1; min-height: 0; padding: 16px 12px; background: var(--bg-base); overflow-y: auto; }
.field + .field { margin-top: 16px; }
.field .lab { display: block; margin-bottom: 7px; font-size: 12px; line-height: 14px; color: var(--tx-secondary); }
.s-foot { flex-shrink: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }

/* ── pipeline canvas ────────────────────────────────────────────────── */
.canvas-wrap { flex: 1; min-height: 0; width: 100%; padding: 0 12px 12px; display: flex; }
.canvas {
  position: relative;
  flex: 1;
  min-width: 0;
  background:
    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0) 0 0 / 14px 14px,
    var(--bg-base);
  border: 0.5px solid var(--bd-primary);
  border-radius: 10px;
  overflow: hidden;
}
.edges { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.edge { fill: none; stroke: var(--bd-primary); stroke-width: 2; }
.edge.draft { stroke: var(--galaxy-alt); stroke-dasharray: 4 4; }
.is-running .edge { stroke: var(--galaxy); stroke-dasharray: 5 5; animation: dashdraw 0.5s linear infinite; }
@keyframes dashdraw { from { stroke-dashoffset: 10; } to { stroke-dashoffset: 0; } }

/* zoom controls sit bottom-right, where a thumb reaches. No minimap —
   at 366px it would eat half the canvas. */
.controls {
  position: absolute;
  bottom: 12px; right: 12px;
  z-index: 30;
  display: flex;
  flex-direction: column;
  background: var(--bg-primary);
  border: 0.5px solid var(--bd-primary);
  border-radius: 8px;
  overflow: hidden;
}
.controls span {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-bottom: 0.5px solid var(--bd-primary);
  color: var(--tx-tertiary);
}
.controls span:last-child { border-bottom: none; }
.controls svg { width: 14px; height: 14px; display: block; }

/* the graph is a window onto a bigger canvas, not a diagram scaled to fit:
   full-size nodes staggered on a diagonal, running off the frame the way a
   panned canvas does. Wires that leave the island get clipped — fine. */
.stage {
  position: absolute; inset: 0;
  transition: bottom var(--fit) var(--ease), transform var(--fit) var(--ease);
}
/* the Activity sheet takes the bottom half, so the window shortens to the
   strip that's left and the graph re-centres in it — the canvas pans, it
   doesn't shrink the type down to fit */
.canvas.is-panel .stage { bottom: 55%; }
/* both nodes hang off the stage's midline, so the pair stays vertically
   centred in whatever height the stage has: -120 is half the cluster,
   +50 puts the sink 170px below the source */
.node {
  position: absolute;
  top: 50%;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 20;
}
.node.source { left: -4px; width: 58%; margin-top: -120px; }
.node.sink   { left: 62%;  width: 70%; margin-top: 50px; }
.node .kindrow { display: flex; align-items: center; justify-content: space-between; }
.node .acts { display: flex; align-items: center; gap: 4px; }
.node .act {
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-primary); border-radius: 5px; color: var(--tx-tertiary);
}
.node .act svg { width: 13px; height: 13px; display: block; }
.node-island {
  padding: 8px;
  background: var(--bg-primary);
  border: 0.5px solid var(--bd-primary);
  border-radius: 8px;
  outline: 0 solid var(--galaxy);
  outline-offset: -1px;
  transition: border-color 140ms ease, outline-width 140ms ease;
}
.is-running .node-island { border-color: var(--galaxy); outline-width: 1px; }
.node-head { display: flex; align-items: center; gap: 7px; }
.node-head .nm { flex: 1; min-width: 0; font-size: 13px; line-height: 16px; font-weight: 500;
  letter-spacing: 0.12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .tile { width: 24px; height: 24px; border-radius: 5px; }
.node .tile img { width: 16px; height: 16px; }
.node-tables { display: flex; flex-direction: column; gap: 2px; }
.trow { display: flex; align-items: center; justify-content: space-between; gap: 4px; height: 26px; }
.trow .tname { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12px; color: var(--tx-tertiary); }
.trow.is-conn .tname { color: var(--tx-primary); }
.port-slot { width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.port {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--tx-tertiary);
  border: 0 solid var(--galaxy);
  transition: width 140ms ease, height 140ms ease, background-color 140ms ease, border-width 140ms ease;
}
.port.is-conn { width: 12px; height: 12px; background: transparent; border-width: 2px; }
.port.is-live { background: var(--galaxy-alt); }

.beacon { position: relative; width: 8px; height: 8px; flex-shrink: 0; }
.beacon i { position: absolute; inset: 0; border-radius: 50%; background: var(--beacon); }
.beacon i.ring { animation: ping 1.6s cubic-bezier(0, 0, .2, 1) infinite; }
@keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(2.4); opacity: 0; } }

/* ── the Activity panel ─────────────────────────────────────────────── */
/* the same bottom sheet the connector picker uses: edge to edge, sitting
   on the app's bottom rather than inset inside the canvas island */
.panel {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  height: 52%;
  display: flex;
  flex-direction: column;
  background: var(--bg-primary);
  border-top: 0.5px solid var(--bd-secondary);
  border-radius: 16px 16px 0 0;
  overflow: hidden;
  transform: translateY(101%);
  transition: transform var(--fit) var(--ease);
}
.panel.is-in { transform: none; }
.panel-tabs {
  flex-shrink: 0;
  height: 40px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-tabs .tabs { height: 100%; display: flex; align-items: stretch; gap: 4px; }
.panel-tabs .tab {
  display: flex;
  align-items: center;
  padding: 0 10px;
  opacity: 0.5;
  border-bottom: 2px solid transparent;
  font-size: 13px;
  color: var(--tx-primary);
}
.panel-tabs .tab.is-on { opacity: 1; border-bottom-color: #fdfefc; }

.activity {
  flex: 1;
  min-height: 0;
  padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 13px;
  letter-spacing: 0.11px;
}
/* one event, two lines: the type on top, its numbers indented beneath —
   so a 3M-records page still reads at phone width */
.aline { display: flex; flex-direction: column; gap: 1px; }
.aline .ahead { display: flex; align-items: baseline; gap: 8px; }
.aline .ts { flex-shrink: 0; color: var(--tx-tertiary); }
.aline .ev { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--tx-secondary); }
.aline .det { padding-left: 61px; overflow-wrap: anywhere; color: var(--tx-secondary); }
.aline .ev.ok,  .aline .det.ok  { color: var(--tx-success); }
.aline .ev.err, .aline .det.err { color: var(--tx-error); }
.aline .ev.dim, .aline .det.dim { color: var(--tx-tertiary); }
.listening { color: var(--tx-tertiary); animation: flash 1.6s ease-in-out infinite; }
@keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

/* ── the touch point ────────────────────────────────────────────────── */
/* a phone has no hover, so the dot rides dim between taps and lights up
   on contact — a guided finger, not a cursor */
.cursor {
  position: absolute;
  z-index: 90;
  left: 0; top: 0;
  width: 26px; height: 26px;
  margin: -13px 0 0 -13px;
  border-radius: 50%;
  background: rgba(253, 254, 252, 0.14);
  border: 1.5px solid rgba(253, 254, 252, 0.85);
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);

      var n = r.getAttribute("data-connector");
      var nm = r.querySelector(".c-nm").textContent.toLowerCase();
      r.classList.toggle("is-off", !(nm.indexOf(q) === 0 || n.indexOf(q) === 0));
    });
  }

  /* picking a connector pushes the form in and drops the sheet to a
     shorter detent, the way a native sheet changes size between steps */
  function pushConfigure(kind, spec, fields) {
    var chip = kind === "source" ? "lime" : "pink";
    var label = kind === "source" ? "Source" : "Sink";
    sheet.querySelector("[data-cfg]").innerHTML =
      '<div class="s-head">' +
        '<span class="icon-btn" style="margin-left:0">' + svg(IC.arrowLeft) + '</span>' +
        tile(spec.n, "lg") +
        '<span class="titles"><b>' + spec.d + '</b>' +
          '<span class="chip ' + chip + '" style="align-self:flex-start">' + label + '</span>' +
        '</span>' +
      '</div>' +
      '<div class="hr"></div>' +
      '<div class="s-body">' +
        fields.map(function (f) {
          return '<div class="field">' +
            '<span class="lab">' + f.label + '</span>' +
            '<span class="input" data-field="' + f.key + '"><span class="val ph">' + f.ph + '</span></span>' +
          '</div>';
        }).join("") +
      '</div>' +
      '<div class="s-foot">' +
        '<span class="btn primary lg full" data-create>' + svg(IC.check) + 'Create</span>' +
      '</div>';
    stackEl.classList.add("is-2");
    sheet.classList.add("is-cfg");
    return wait(420);
  }

  function closeSheet() {
    if (!sheet) return wait(1);
    var s = sheet;
    s.classList.remove("is-in");
    scrim.classList.remove("is-on");
    mainScreen.classList.remove("is-under");
    sheet = null; stackEl = null;
    return wait(340).then(function () { if (s.parentNode) s.parentNode.removeChild(s); });
  }

  /* ── the pipeline canvas ───────────────────────────────────────────── */
  var canvasEl, edgesSvg, tablesEl, pipeActs, draftFrom = null;

  function buildCanvas() {
    canvasScreen.innerHTML =
      '<div class="topbar">' +
        '<span class="l">' +
          '<span class="icon-btn">' + svg(IC.arrowLeft) + '</span>' +
          '<span class="pname">prod-postgres → clickhouse</span>' +
        '</span>' +
        '<span class="r" data-pipe-actions></span>' +
      '</div>' +
      '<div class="canvas-wrap"><div class="canvas" data-canvas>' +
        '<svg class="edges" data-edges></svg>' +
        '<div class="stage">' +
          '<div class="node source">' +
            '<div class="kindrow"><span class="chip lime">Source</span>' +
              '<span class="acts"><span class="act">' + svg(IC.refresh) + '</span>' +
              '<span class="act">' + svg(IC.trash) + '</span></span></div>' +
            '<div class="node-island"><div class="node-head">' +
              tile("postgres") + '<span class="nm">prod-postgres</span>' +
            '</div></div>' +
            '<div class="node-island"><div class="node-tables" data-tables>' +
              TABLES.map(function (t) {
                return '<div class="trow"><span class="tname">' + t + '</span>' +
                  '<span class="port-slot"><span class="port"></span></span></div>';
              }).join("") +
            '</div></div>' +
          '</div>' +
          '<div class="node sink">' +
            '<div class="kindrow"><span class="chip pink">Sink</span>' +
              '<span class="acts"><span class="act">' + svg(IC.trash) + '</span></span></div>' +
            '<div class="node-island"><div class="node-head">' +
              '<span class="port-slot"><span class="port" data-sink-port></span></span>' +
              tile("clickhouse") + '<span class="nm">clickhouse</span>' +
            '</div></div>' +
          '</div>' +
        '</div>' +
        '<div class="controls">' +
          '<span>' + svg(IC.plus) + '</span>' +
          '<span>' + svg(IC.minus) + '</span>' +
          '<span>' + svg(IC.reset) + '</span>' +
        '</div>' +
      '</div></div>';

    stopActivity();
    panelEl = null;
    draftFrom = null;
    canvasEl = canvasScreen.querySelector("[data-canvas]");
    edgesSvg = canvasScreen.querySelector("[data-edges]");
    edgePaths = [];
    tablesEl = canvasScreen.querySelector("[data-tables]");
    pipeActs = canvasScreen.querySelector("[data-pipe-actions]");
  }

  function portAt(el) {
    var c = canvasEl.getBoundingClientRect(), b = el.getBoundingClientRect();
    return { x: b.left - c.left + b.width / 2, y: b.top - c.top + b.height / 2, r: b.width / 2 };
  }
  function cursorPt() {
    var c = canvasEl.getBoundingClientRect(), b = cursor.getBoundingClientRect();
    return { x: b.left - c.left + b.width / 2, y: b.top - c.top + b.height / 2 };
  }

  /* right handle out, left handle in — ReactFlow's horizontal bezier, the
     same one the desktop canvas draws */
  function wire(sx, sy, tx, ty) {
    /* the drop is much longer than the run at this width, so the control
       points lean on the vertical distance too — otherwise every wire
       leaves sideways and then plunges */
    var dx = Math.max(36, (tx - sx) * 0.6, Math.abs(ty - sy) * 0.35);
    return "M" + sx + "," + sy + " C" + (sx + dx) + "," + sy + " " + (tx - dx) + "," + ty + " " + tx + "," + ty;
  }

  /* The paths are created once and only their `d` is rewritten after that.
     Rebuilding the SVG every frame is what made the move look choppy: new
     elements restart the marching-dash animation on each one, so the wires
     stuttered instead of flowing while the graph was moving. */
  var edgePaths = [];

  function edgeAt(i, cls, d) {
    var p = edgePaths[i];
    if (!p) {
      p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      edgesSvg.appendChild(p);
      edgePaths[i] = p;
    }
    if (p.getAttribute("class") !== cls) p.setAttribute("class", cls);
    p.setAttribute("d", d);
  }

  function drawEdges() {
    if (!canvasEl || !edgesSvg || !tablesEl) return;
    var c = canvasEl.getBoundingClientRect();
    if (edgesSvg.getAttribute("width") !== String(c.width)) {
      edgesSvg.setAttribute("viewBox", "0 0 " + c.width + " " + c.height);
      edgesSvg.setAttribute("width", c.width);
      edgesSvg.setAttribute("height", c.height);
    }

    var sink = portAt(canvasScreen.querySelector("[data-sink-port]"));
    var n = 0;
    tablesEl.querySelectorAll(".trow.is-conn").forEach(function (row) {
      /* the 2px stroke is centred on the path, so starting a pixel clear of
         the ring puts its inner edge exactly on the circle */
      var p = portAt(row.querySelector(".port"));
      edgeAt(n++, "edge", wire(p.x + p.r + 1, p.y, sink.x - sink.r - 1, sink.y));
    });

    if (draftFrom) {
      var f = portAt(draftFrom), q = cursorPt();
      edgeAt(n++, "edge draft", wire(f.x + f.r + 1, f.y, q.x, q.y));
    }

    while (edgePaths.length > n) edgePaths.pop().remove();
  }

  /* how long the layout takes to settle, straight from the CSS clock — so
     the tracker can never fall short of the transition it is following */
  function fitMs() {
    var v = getComputedStyle(document.documentElement).getPropertyValue("--fit");
    return (parseFloat(v) || 340) + 120;
  }

  /* the wires stay glued to the ports for every frame of the move */
  var trackRaf = null;
  function trackEdges(ms) {
    if (trackRaf) cancelAnimationFrame(trackRaf);
    var t0 = Date.now();
    (function frame() {
      drawEdges();
      trackRaf = Date.now() - t0 < ms ? requestAnimationFrame(frame) : null;
    })();
  }

  /* drag a wire from a port to the sink, live under the touch point */
  function dragWire(fromPort, toEl) {
    var raf, live = true;
    draftFrom = fromPort;
    cursor.classList.add("is-drag");
    fromPort.classList.add("is-live");
    (function frame() { if (!live) return; drawEdges(); raf = requestAnimationFrame(frame); })();
    return moveTo(toEl).then(function () {
      live = false;
      cancelAnimationFrame(raf);
      cursor.classList.remove("is-drag");
      fromPort.classList.remove("is-live");
      draftFrom = null;
    });
  }

  /* ── the Activity sheet ────────────────────────────────────────────── */
  var panelEl, activityEl, logT = [];

  function openPanel() {
    var wrap = document.createElement("div");
    wrap.className = "panel";
    wrap.innerHTML =
      '<div class="grab"><i></i></div>' +
      '<div class="panel-tabs">' +
        '<span class="tabs"><span class="tab">Overview</span>' +
          '<span class="tab is-on">Activity</span></span>' +
      '</div>' +
      '<div class="hr"></div>' +
      '<div class="activity" data-activity></div>';
    /* a sibling of the canvas, not a child — so it runs the full width */
    canvasScreen.appendChild(wrap);
    panelEl = wrap;
    activityEl = wrap.querySelector("[data-activity]");
    /* the canvas zooms out to clear the sheet, the way fitView insets */
    canvasEl.classList.add("is-panel");
    requestAnimationFrame(function () { wrap.classList.add("is-in"); });
    trackEdges(fitMs());
  }

  /* the run's event stream, in the shapes events/catalog.go emits */
  function runEvents() {
    var out = [
      ["run.requested", "", ""],
      ["run.started", "", ""]
    ];
    var totalRec = 0, totalBytes = 0;
    var cpu = 0.9, mem = 486539264;
    /* pages land at roughly 3M records/second of wall clock — the clock
       below advances a second every third line, so the arithmetic holds */
    TABLES.forEach(function (t, i) {
      var pages = 5 + (i % 3);
      var rec = 0, bytes = 0;
      out.push(["resource.started", t, ""]);
      if (i === 2) out.push(["resource.fan_out_started", t, ""]);
      for (var pgi = 0; pgi < pages; pgi++) {
        var r = 1480000 + ((i * 421103 + pgi * 373907) % 420000);
        var by = r * 178;
        rec += r; bytes += by;
        out.push(["resource.page_fetched", t,
                  "records=" + r.toLocaleString("en-US") + " bytes=" + by.toLocaleString("en-US")]);
        if (pgi === 2) {
          cpu += 2.4 + i * 0.6;
          mem += 92274688;
          out.push(["run.heartbeat", "",
                    "cpuSeconds=" + cpu.toFixed(1) +
                    " memoryBytes=" + mem.toLocaleString("en-US")]);
        }
      }
      out.push(["resource.completed", t,
                "records=" + rec.toLocaleString("en-US") +
                " bytes=" + bytes.toLocaleString("en-US")]);
      totalRec += rec; totalBytes += bytes;
    });
    out.push(["run.completed", "",
              "records=" + totalRec.toLocaleString("en-US") +
              " bytes=" + totalBytes.toLocaleString("en-US")]);
    return out;
  }

  function eventClass(type, detail) {
    if (type.indexOf(".failed") >= 0 || detail.indexOf("error") >= 0) return "err";
    if (type === "run.completed") return "ok";
    if (type === "run.heartbeat") return "dim";
    return "";
  }

  /* every event is two lines here: the type, then its numbers indented
     underneath, so nothing clips at phone width */
  function streamActivity() {
    var evs = runEvents();
    var t = new Date();
    t.setSeconds(t.getSeconds() - 1);
    var i = 0;

    activityEl.innerHTML = '<span class="listening">Listening...</span>';
    var tail = activityEl.querySelector(".listening");

    function push() {
      if (i >= evs.length) {
        if (tail && tail.parentNode) tail.parentNode.removeChild(tail);
        activityEl.scrollTop = activityEl.scrollHeight;
        return;
      }
      var e = evs[i++];
      t.setSeconds(t.getSeconds() + (i % 3 === 0 ? 1 : 0));
      var stamp = ("0" + t.getHours()).slice(-2) + ":" +
                  ("0" + t.getMinutes()).slice(-2) + ":" +
                  ("0" + t.getSeconds()).slice(-2);
      var cls = eventClass(e[0], e[2]);
      var line = document.createElement("div");
      line.className = "aline";
      line.innerHTML =
        '<span class="ahead"><span class="ts">' + stamp + '</span>' +
          '<span class="ev ' + cls + '">' + e[0] + (e[1] ? " " + e[1] : "") + '</span></span>' +
        (e[2] ? '<span class="det ' + cls + '">' + e[2] + '</span>' : '');
      activityEl.insertBefore(line, tail);
      activityEl.scrollTop = activityEl.scrollHeight;
      logT.push(setTimeout(push, 76 + (i % 5) * 24));
    }
    push();
  }

  function stopActivity() {
    logT.forEach(clearTimeout);
    logT = [];
  }

  /* ── flows ─────────────────────────────────────────────────────────── */
  function connectionFlow(kind, spec, query, fields) {
    return click(stepsEl.querySelector('[data-step="' + kind + '"]'))
      .then(function () { return openSheet(kind); })
      .then(function () { return wait(420); })
      .then(function () {
        var s = sheet.querySelector("[data-search]");
        return click(s).then(function () {
          s.classList.add("is-focus");
          return typeInto(s.querySelector(".val"), query, filterList);
        });
      })
      .then(function () { return wait(560); })
      .then(function () {
        var row = sheet.querySelector('[data-connector="' + spec.n + '"]');
        row.classList.add("is-hot");
        return click(row);
      })
      .then(function () { return pushConfigure(kind, spec, fields); })
      .then(function () { return wait(280); })
      .then(function () {
        var chain = Promise.resolve();
        fields.forEach(function (f) {
          chain = chain.then(function () {
            var el = sheet.querySelector('[data-field="' + f.key + '"]');
            return click(el).then(function () {
              el.classList.add("is-focus");
              return type(el, f.value);
            }).then(function () { return wait(200); });
          });
        });
        return chain;
      })
      .then(function () { return wait(280); })
      .then(function () { return click(sheet.querySelector("[data-create]")); })
      .then(closeSheet)
      .then(function () {
        done++;
        renderSteps();
        return wait(1500);
      });
  }

  function pipelineFlow() {
    return click(stepsEl.querySelector('[data-step="pipeline"]'))
      .then(function () {
        /* the checklist pushes straight to the canvas — and the tab bar
           goes with the screen it belongs to */
        buildCanvas();
        canvasScreen.classList.add("is-on");
        mainScreen.classList.add("is-under");
        pipeActs.innerHTML = RUN_BTN;
        return wait(520);
      })
      .then(function () {
        /* the pipeline arrives with most resources already wired — only
           the last one gets connected on camera */
        var rows = tablesEl.querySelectorAll(".trow");
        for (var i = 0; i < rows.length - 1; i++) {
          rows[i].classList.add("is-conn");
          rows[i].querySelector(".port").classList.add("is-conn");
        }
        canvasScreen.querySelector("[data-sink-port]").classList.add("is-conn");
        drawEdges();
        return wait(1000);
      })
      .then(function () {
        var rows = tablesEl.querySelectorAll(".trow");
        var last = rows[rows.length - 1];
        var port = last.querySelector(".port");
        var sinkPort = canvasScreen.querySelector("[data-sink-port]");
        return moveTo(port)
          .then(function () { return tap(); })
          .then(function () { return dragWire(port, sinkPort); })
          .then(function () {
            last.classList.add("is-conn");
            port.classList.add("is-conn");
            drawEdges();
            pipeActs.innerHTML = SAVE_BTN;
            return wait(620);
          });
      })
      .then(function () { return click(pipeActs.querySelector("[data-save]")); })
      .then(function () {
        pipeActs.innerHTML = RUN_BTN;
        return wait(950);
      })
      .then(function () { return click(pipeActs.querySelector("[data-run]")); })
      .then(function () {
        /* handleRun calls showActivity(): the panel opens on Activity */
        pipeActs.innerHTML = RUNNING;
        canvasEl.classList.add("is-running");
        openPanel();
        streamActivity();
        return wait(8600);
      })
      .then(function () {
        canvasEl.classList.remove("is-running");
        stopActivity();
        pipeActs.innerHTML = COMPLETED;
        return wait(4200);
      })
      .then(function () {
        /* pop back to getting started */
        canvasScreen.classList.remove("is-on");
        mainScreen.classList.remove("is-under");
        return wait(460);
      });
  }

  function loop() {
    var g = gen;
    done = 0;
    renderSteps();

    wait(1100)
      .then(function () {
        return connectionFlow("source", byName(SOURCES, "postgres"), "post", [
          { key: "name", label: "Name", ph: "prod-db", value: "prod-postgres" },
          { key: "dsn",  label: "DSN",  ph: "postgresql://…",
            value: "postgresql://app@db.acme.io:5432/shop?sslmode=require" }
        ]);
      })
      .then(function () {
        return connectionFlow("sink", byName(SINKS, "clickhouse"), "click", [
          { key: "name", label: "Name", ph: "warehouse", value: "clickhouse" },
          { key: "dsn",  label: "DSN",  ph: "clickhouse://…",
            value: "clickhouse://default@acme.clickhouse.cloud:8443/analytics" }
        ]);
      })
      .then(pipelineFlow)
      .then(function () { if (g.alive) loop(); })
      .catch(function () { /* cancelled */ });
  }

  function start() {
    gen.alive = false;
    gen = { alive: true };
    stopActivity();
    if (sheet && sheet.parentNode) sheet.parentNode.removeChild(sheet);
    sheet = null; stackEl = null;
    scrim.classList.remove("is-on");
    canvasScreen.classList.remove("is-on");
    canvasScreen.innerHTML = "";
    mainScreen.classList.remove("is-under");
    cursor.style.transform = "translate(196px, 520px)";
    loop();
  }

  document.addEventListener("visibilitychange", function () { if (!document.hidden) start(); });
  window.addEventListener("resize", function () { drawEdges(); });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { setTimeout(start, 60); });
  } else {
    start();
  }
})();
</script>
</body>
</html>
