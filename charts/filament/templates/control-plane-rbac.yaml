apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "filament.control.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "filament.control.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "filament.control.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "filament.control.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "filament.control.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "filament.control.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
