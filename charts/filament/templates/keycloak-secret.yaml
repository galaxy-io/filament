{{- if and (or .Values.keycloak.enabled (and .Values.auth.enabled (eq .Values.auth.type "keycloak"))) (not .Values.keycloak.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "filament.keycloak.secretName" (dict "Values" .Values.keycloak "Release" .Release) }}
  namespace: {{ include "filament.namespace" . }}
  labels:
    {{- include "filament.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and .Values.auth.enabled (eq .Values.auth.type "keycloak") }}
  AUTH_CLIENT_SECRET: {{ required "set auth.keycloak.clientSecret or keycloak.existingSecret" .Values.auth.keycloak.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.keycloak.enabled }}
  AUTH_ADMIN_PASSWORD: {{ required "set auth.keycloak.adminPassword or keycloak.existingSecret for vendored Keycloak" .Values.auth.keycloak.adminPassword | b64enc | quote }}
  {{- else }}
  {{- with .Values.auth.keycloak.adminPassword }}
  AUTH_ADMIN_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.auth.keycloak.bootstrap.clientSecret }}
  AUTH_BOOTSTRAP_CLIENT_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.bootstrap.adminPassword }}
  AUTH_BOOTSTRAP_ADMIN_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
