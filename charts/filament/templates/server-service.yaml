apiVersion: v1
kind: Service
metadata:
  name: {{ include "filament.server.fullname" . }}
  labels:
    {{- include "filament.server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "filament.server.selectorLabels" . | nindent 4 }}
