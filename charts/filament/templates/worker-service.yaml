apiVersion: v1
kind: Service
metadata:
  name: {{ include "filament.worker.fullname" . }}
  namespace: {{ include "filament.namespace" . }}
  labels:
    {{- include "filament.worker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.worker.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "filament.worker.selectorLabels" . | nindent 4 }}
