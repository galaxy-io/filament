apiVersion: v1
kind: Service
metadata:
  name: {{ include "filament.control.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "filament.control.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "filament.control.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.control.service.port }}
      targetPort: http
      protocol: TCP
