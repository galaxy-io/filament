apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "filament.server.fullname" . }}
  namespace: {{ include "filament.namespace" . }}
  labels:
    {{- include "filament.server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "filament.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/server-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if and .Values.auth.enabled (eq .Values.auth.type "keycloak") }}
        checksum/keycloak-secret: {{ include (print $.Template.BasePath "/keycloak-secret.yaml") . | sha256sum }}
        {{- else if and .Values.auth.enabled (eq .Values.auth.type "zitadel") }}
        checksum/zitadel-secret: {{ include (print $.Template.BasePath "/zitadel-secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "filament.server.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "filament.server.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.server.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ .Values.server.image.repository }}:{{ .Values.server.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          envFrom:
            - configMapRef:
                name: {{ include "filament.server.fullname" . }}
            - secretRef:
                name: {{ include "filament.secretName" . }}
            {{- if and .Values.auth.enabled (eq .Values.auth.type "keycloak") }}
            - secretRef:
                name: {{ include "filament.keycloak.secretName" (dict "Values" .Values.keycloak "Release" .Release) }}
            {{- end }}
          {{- if and .Values.auth.enabled (eq .Values.auth.type "zitadel") }}
          env:
            - name: AUTH_PAT
              valueFrom:
                secretKeyRef:
                  name: {{ include "filament.auth.mintedPatSecret" . | default (.Values.auth.zitadel.existingSecret | default (printf "%s-zitadel-auth" .Release.Name)) }}
                  key: {{ ternary "pat" "AUTH_PAT" .Values.zitadel.enabled }}
            {{- if .Values.auth.bootstrap.adminEmail }}
            - name: AUTH_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.zitadel.existingSecret | default (printf "%s-zitadel-auth" .Release.Name) }}
                  key: AUTH_BOOTSTRAP_ADMIN_PASSWORD
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
