apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "filament.server.fullname" . }}
  namespace: {{ include "filament.namespace" . }}
data:
  # Persistence
  PERSISTENCE_PROVIDER: {{ .Values.persistence.type | quote }}

  # Metrics
  {{- if ne .Values.metrics.type "datastore" }}
  METRICSSTORE_PROVIDER: {{ .Values.metrics.type | quote }}
  {{- end }}

  # Event bus
  EVENTBUS_PROVIDER: {{ .Values.eventBus.type | quote }}
  NATS_STREAM: {{ .Values.eventBus.nats.stream | quote }}
  NATS_SUBJECTS: {{ .Values.eventBus.nats.subjects | quote }}
  NATS_TTL_SECONDS: {{ .Values.eventBus.nats.ttlSeconds | quote }}

  # Ingestion
  SERVER_ADDR: ":{{ .Values.server.service.port }}"

  # Worker
  WORKER_URL: "http://{{ include "filament.worker.fullname" . }}:{{ .Values.worker.service.port }}"

  # Auth
  {{- if .Values.auth.enabled }}
  AUTH_PROVIDER: {{ .Values.auth.type | quote }}
  {{- if eq .Values.auth.type "zitadel" }}
  AUTH_ISSUER: {{ .Values.auth.zitadel.issuer | quote }}
  {{- end }}
  {{- if eq .Values.auth.type "keycloak" }}
  {{- if .Values.keycloak.enabled }}
  AUTH_ISSUER: {{ .Values.auth.keycloak.issuer | default (printf "%s/realms/filament" (.Values.keycloak.hostname | trimSuffix "/")) | quote }}
  {{- else }}
  AUTH_ISSUER: {{ required "auth.keycloak.issuer is required for external Keycloak" .Values.auth.keycloak.issuer | quote }}
  {{- end }}
  AUTH_CLIENT_ID: {{ .Values.auth.keycloak.clientId | quote }}
  {{- with ternary .Values.keycloak.adminUser .Values.auth.keycloak.adminUser .Values.keycloak.enabled }}
  AUTH_ADMIN_USERNAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.keycloak.bootstrap.clientId }}
  AUTH_BOOTSTRAP_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.auth.bootstrap.tenant }}
  AUTH_BOOTSTRAP_TENANT: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.bootstrap.adminEmail }}
  AUTH_BOOTSTRAP_ADMIN_EMAIL: {{ . | quote }}
  {{- end }}
  AUTH_UI_ORIGIN: {{ .Values.auth.uiOrigin | quote }}
  {{- end }}

  # Observability
  LOG_LEVEL: {{ .Values.server.logLevel | quote }}
  {{- with .Values.observability.otel.endpoint }}
  OTEL_SERVICE_NAME: {{ include "filament.server.fullname" $ | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  {{- with $.Values.observability.otel.protocol }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ . | quote }}
  {{- end }}
  {{- end }}

  # Secrets
  {{- if eq .Values.secrets.type "datastore" }}
  {{- with .Values.secrets.datastore.encryptionKeyId }}
  ENCRYPTION_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- else }}
  SECRET_PROVIDER: {{ .Values.secrets.type | quote }}
  {{- with .Values.secrets.prefix }}
  SECRETS_PREFIX: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.secrets.type "aws-secrets-manager" }}
  {{- with .Values.secrets.aws.region }}
  AWS_REGION: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.secrets.type "gcp-secret-manager" }}
  GCP_PROJECT_ID: {{ required "secrets.gcp.projectId is required for gcp-secret-manager" .Values.secrets.gcp.projectId | quote }}
  GCP_REGION: {{ required "secrets.gcp.region is required for gcp-secret-manager" .Values.secrets.gcp.region | quote }}
  {{- end }}
