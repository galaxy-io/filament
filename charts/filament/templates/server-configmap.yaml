apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "filament.server.fullname" . }}
  namespace: {{ include "filament.namespace" . }}
data:
  # Persistence
  PERSISTENCE_PROVIDER: {{ .Values.persistence.type | quote }}

  # Metrics
  METRICSSTORE_PROVIDER: {{ .Values.metrics.type | quote }}

  # Event bus
  EVENTBUS_PROVIDER: {{ .Values.eventBus.type | quote }}
  NATS_STREAM: {{ .Values.eventBus.nats.stream | quote }}
  NATS_SUBJECTS: {{ .Values.eventBus.nats.subjects | quote }}

  # Ingestion
  SERVER_ADDR: ":{{ .Values.server.service.port }}"

  # Observability
  {{- if or .Values.observability.otel.endpoint .Values.observability.otel.metricsEndpoint .Values.observability.otel.tracesEndpoint }}
  OTEL_SERVICE_NAME: {{ include "filament.server.fullname" . | quote }}
  {{- with .Values.observability.otel.endpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.observability.otel.metricsEndpoint }}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.observability.otel.tracesEndpoint }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.observability.otel.protocol }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ . | quote }}
  {{- end }}
  {{- end }}

  # Secrets
  SECRET_PROVIDER: {{ .Values.secrets.type | quote }}
  {{- if eq .Values.secrets.type "postgres" }}
  {{- with .Values.secrets.postgres.encryptionKeyId }}
  ENCRYPTION_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- else }}
  {{- with .Values.secrets.prefix }}
  SECRETS_PREFIX: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.secrets.type "aws-secrets-manager" }}
  {{- with .Values.secrets.aws.region }}
  AWS_REGION: {{ . | quote }}
  {{- end }}
  {{- end }}
