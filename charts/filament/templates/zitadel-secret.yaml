{{- if and .Values.auth.enabled (eq .Values.auth.type "zitadel") (not .Values.zitadel.enabled) (not .Values.auth.zitadel.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-zitadel-auth" .Release.Name }}
  namespace: {{ include "filament.namespace" . }}
  labels:
    {{- include "filament.labels" . | nindent 4 }}
type: Opaque
data:
  AUTH_PAT: {{ required "set auth.zitadel.pat or auth.zitadel.existingSecret" .Values.auth.zitadel.pat | b64enc | quote }}
{{- end }}
