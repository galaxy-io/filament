{{- if and .Values.auth.enabled (eq .Values.auth.type "zitadel") (not .Values.auth.zitadel.existingSecret) (or (not .Values.zitadel.enabled) .Values.auth.bootstrap.adminPassword) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-zitadel-auth" .Release.Name }}
  namespace: {{ include "filament.namespace" . }}
  labels:
    {{- include "filament.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.zitadel.enabled }}
  AUTH_PAT: {{ required "set auth.zitadel.pat or auth.zitadel.existingSecret" .Values.auth.zitadel.pat | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.bootstrap.adminPassword }}
  AUTH_BOOTSTRAP_ADMIN_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
