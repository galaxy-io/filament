{{- if .Values.controlPlane.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "filament.controlPlane.fullname" . }}
  namespace: {{ include "filament.namespace" . }}
data:
  # Persistence
  PERSISTENCE_PROVIDER: {{ .Values.persistence.type | quote }}

  # Event bus
  EVENTBUS_PROVIDER: {{ .Values.eventBus.type | quote }}
  NATS_STREAM: {{ .Values.eventBus.nats.stream | quote }}
  NATS_SUBJECTS: {{ .Values.eventBus.nats.subjects | quote }}

  # Dispatch
  DISPATCH_MODE: {{ .Values.controlPlane.dispatch.mode | quote }}

  # Observability
  {{- with .Values.observability.otel.endpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  OTEL_SERVICE_NAME: {{ include "filament.controlPlane.fullname" $ | quote }}
  {{- with $.Values.observability.otel.protocol }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ . | quote }}
  {{- end }}
  {{- end }}

  # Secrets
  SECRET_PROVIDER: {{ .Values.secrets.type | quote }}
  {{- if eq .Values.secrets.type "postgres" }}
  {{- with .Values.secrets.postgres.encryptionKeyId }}
  ENCRYPTION_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- else }}
  {{- with .Values.secrets.prefix }}
  SECRETS_PREFIX: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.secrets.type "aws-secrets-manager" }}
  {{- with .Values.secrets.aws.region }}
  AWS_REGION: {{ . | quote }}
  {{- end }}
  {{- end }}

  # Worker
  K8S_NAMESPACE: {{ include "filament.namespace" . }}
  K8S_WORKER_IMAGE: {{ .Values.controlPlane.dispatch.worker.image.repository }}:{{ .Values.controlPlane.dispatch.worker.image.tag | default .Chart.AppVersion }}
  K8S_WORKER_IMAGE_PULL_POLICY: {{ .Values.controlPlane.dispatch.worker.image.pullPolicy | quote }}
  K8S_WORKER_SERVICE_ACCOUNT: {{ include "filament.worker.serviceAccountName" . | quote }}
  K8S_WORKER_RESTART_POLICY: {{ .Values.controlPlane.dispatch.worker.restartPolicy | quote }}
  K8S_WORKER_SECRET_NAME: {{ include "filament.secretName" . | quote }}
  {{- with .Values.controlPlane.dispatch.worker.terminationGraceSeconds }}
  K8S_WORKER_TERMINATION_GRACE_SECONDS: {{ . | quote }}
  {{- end }}
  {{- with .Values.controlPlane.dispatch.worker.activeDeadlineSeconds }}
  K8S_WORKER_ACTIVE_DEADLINE_SECONDS: {{ . | quote }}
  {{- end }}

  # Jobs
  K8S_JOB_NAME_PREFIX: {{ .Values.controlPlane.dispatch.job.namePrefix | quote }}
  K8S_JOB_BACKOFF_LIMIT: {{ .Values.controlPlane.dispatch.job.backoffLimit | quote }}
  K8S_JOB_TTL_SECONDS_AFTER_FINISHED: {{ .Values.controlPlane.dispatch.job.ttlSecondsAfterFinished | quote }}
{{- end }}
