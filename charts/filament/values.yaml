# Default values for the Filament Helm chart.
#
# This file is intentionally production-safe: connection strings and
# encryption keys must be supplied by the installer or by an existing Secret.

# -- Provide a name in place of `filament`.
nameOverride: ""

# -- String to fully override the generated release name.
fullnameOverride: ""

# -- Override the namespace used in rendered manifests.
namespaceOverride: ""

# -- Labels added to all Filament resources.
commonLabels: {}

# -- Name of an existing Secret containing `PERSISTENCE_DSN`, `ENCRYPTION_KEY`, and `NATS_URL`.
# When set, the chart does not create its own Secret.
existingSecret: ""

server:
  image:
    # -- Server image repository.
    repository: ghcr.io/galaxy-io/filament/server
    # -- Server image tag.
    # @default -- `""` (defaults to chart appVersion)
    tag: ""
    # -- Server image pull policy.
    pullPolicy: IfNotPresent
    # -- Image pull secrets for the server Deployment.
    pullSecrets: []

  serviceAccount:
    # -- Existing ServiceAccount name for the server. When set, the chart does not create one.
    name: ""
    # -- Annotations for the chart-created server ServiceAccount, e.g. an IRSA role ARN.
    annotations: {}

  # -- Number of server replicas. Ignored when `server.autoscaling.enabled` is true.
  replicas: 1

  autoscaling:
    # -- Enable a HorizontalPodAutoscaler for the server.
    enabled: false
    # -- Minimum server replicas when autoscaling is enabled.
    minReplicas: 1
    # -- Maximum server replicas when autoscaling is enabled.
    maxReplicas: 10
    # -- Target average CPU utilization percentage for server autoscaling.
    targetCpu: 80

  service:
    # -- Server service and container port.
    port: 8080

  ingress:
    # -- Enable an Ingress for the server API and UI.
    enabled: false
    # -- IngressClass name, e.g. `nginx` or `alb`. Empty uses the cluster default.
    className: ""
    # -- Annotations for the Ingress, e.g. a cert-manager issuer or ALB settings.
    annotations: {}
    # -- Path served by the Ingress.
    path: /
    # -- PathType for the path.
    pathType: Prefix
    # -- Hostnames served by the Ingress.
    hosts:
      - filament.example.com
    # -- Ingress TLS configuration, passed through verbatim.
    tls: []

  # -- Server resource requests and limits.
  # @default -- `{}` (See [values.yaml])
  resources: {}

controlPlane:
  # -- Deploy the Filament control plane.
  enabled: true

  image:
    # -- Control plane image repository.
    repository: ghcr.io/galaxy-io/filament/control-plane
    # -- Control plane image tag.
    # @default -- `""` (defaults to chart appVersion)
    tag: ""
    # -- Control plane image pull policy.
    pullPolicy: IfNotPresent
    # -- Image pull secrets for the control plane Deployment.
    pullSecrets: []

  serviceAccount:
    # -- Existing ServiceAccount name for the control plane. When set, the chart does not create one.
    name: ""
    # -- Annotations for the chart-created control plane ServiceAccount, e.g. an IRSA role ARN.
    annotations: {}

  # -- Number of control plane replicas. Ignored when `controlPlane.autoscaling.enabled` is true.
  replicas: 1

  autoscaling:
    # -- Enable a HorizontalPodAutoscaler for the control plane.
    enabled: false
    # -- Minimum control plane replicas when autoscaling is enabled.
    minReplicas: 1
    # -- Maximum control plane replicas when autoscaling is enabled.
    maxReplicas: 10
    # -- Target average CPU utilization percentage for control plane autoscaling.
    targetCpu: 80

  # -- Control plane resource requests and limits.
  # @default -- `{}` (See [values.yaml])
  resources: {}

  health:
    # -- Port the control plane serves `/livez` and `/readyz` on, stored in the
    # ConfigMap as `HEALTH_ADDR` and used for the container port and probes.
    port: 8081

  reaper:
    # -- How often the reaper sweeps for zombie runs, in seconds. Empty uses the binary default (60).
    intervalSeconds: ""
    # -- How long a Running run may go without a heartbeat write before the reaper fails it, in seconds. Empty uses the binary default (300).
    staleAfterSeconds: ""

  dispatch:
    # -- Worker dispatch backend.
    mode: kubernetes

    worker:
      image:
        # -- Worker image repository used for dispatched Jobs.
        repository: ghcr.io/galaxy-io/filament/worker
        # -- Worker image tag.
        # @default -- `""` (defaults to chart appVersion)
        tag: ""
        # -- Worker image pull policy.
        pullPolicy: IfNotPresent
        # -- Image pull secrets for dispatched worker Jobs.
        pullSecrets: []
      serviceAccount:
        # -- Existing ServiceAccount name for dispatched worker Jobs. When set, the chart does not create one.
        name: ""
        # -- Annotations for the chart-created worker ServiceAccount, e.g. an IRSA role ARN.
        annotations: {}
      # -- Restart policy for dispatched worker Jobs.
      restartPolicy: Never
      # -- Worker Job termination grace period in seconds.
      terminationGraceSeconds: 30
      # -- Worker Job active deadline in seconds. Leave empty for no deadline.
      activeDeadlineSeconds: ""
      # -- Interval in seconds between worker heartbeats, stored in the worker
      # ConfigMap as `HEARTBEAT_SECONDS`. Empty uses the worker's own default.
      heartbeatSeconds: 30

    job:
      # -- Prefix used when naming dispatched worker Jobs.
      namePrefix: filament
      # -- Kubernetes Job backoff limit for dispatched workers.
      backoffLimit: 1
      # -- Seconds to retain completed dispatched worker Jobs.
      ttlSecondsAfterFinished: 3600

metrics:
  # -- Metrics backend for the dashboard query API, stored in the server
  # ConfigMap as `METRICSSTORE_PROVIDER`. `postgresql` answers from the
  # datastore's own pool.
  type: postgresql

persistence:
  # -- Persistence provider.
  type: postgresql

  # -- Run database migrations as a post-install/post-upgrade hook Job.
  migrate: true

  postgresql:
    # -- PostgreSQL connection string stored in the chart-created Secret as `PERSISTENCE_DSN`.
    # Required unless `existingSecret` is set.
    # @default -- required
    dsn: ""

  # @ignore
  mysql: {}

secrets:
  # -- Secret storage provider. Valid values are `postgres` and `aws-secrets-manager`.
  type: postgres

  # -- Extra name prefix external secret stores apply to every secret reference,
  # stored in the ConfigMap as `SECRETS_PREFIX`. Filament-minted references are
  # already namespaced under `filament/`. Unused by postgres.
  prefix: ""

  postgres:
    # -- Encryption key identifier stored with each secret row. Change this when rotating keys.
    encryptionKeyId: ""
    # -- Base64-encoded AES key stored in the chart-created Secret as `ENCRYPTION_KEY`.
    # Required unless `existingSecret` is set.
    # @default -- required
    encryptionKey: ""

  aws:
    # -- AWS region for Secrets Manager, stored in the ConfigMap as `AWS_REGION`.
    # Leave empty to use the SDK default chain (env, IMDS).
    region: ""

  # @ignore
  gcp: {}

  # @ignore
  azure: {}

  # @ignore
  vault: {}

eventBus:
  # -- Event bus provider.
  type: nats

  nats:
    # -- NATS connection URL stored in the chart-created Secret as `NATS_URL`.
    # Required unless `existingSecret` is set.
    # @default -- required
    url: ""
    # -- NATS stream used by Filament.
    stream: EVENTBUS
    # -- NATS subject filter consumed by Filament.
    subjects: "ingestion.v1.>"

  # @ignore
  kafka: {}

observability:
  otel:
    # -- OTLP endpoint metrics and traces are exported to, stored in the
    # ConfigMaps as `OTEL_EXPORTER_OTLP_ENDPOINT`. Use an `http://` scheme for
    # plaintext in-cluster collectors. Empty disables export.
    endpoint: ""

    # -- OTLP transport, stored in the ConfigMaps as `OTEL_EXPORTER_OTLP_PROTOCOL`.
    # Valid values are `grpc` (collector port 4317) and `http/protobuf` (port 4318).
    # Empty defaults to `grpc`.
    protocol: ""

# Vendored Bitnami PostgreSQL configuration.
# It is strongly recommended to use an external PostgreSQL instance in production.
postgresql:
  # -- Enable the vendored Bitnami PostgreSQL chart for local or test clusters. See the [Bitnami PostgreSQL chart](https://artifacthub.io/packages/helm/bitnami/postgresql) for additional configuration.
  enabled: false
  # -- Full name override for the vendored PostgreSQL release.
  fullnameOverride: filament-postgresql
  auth:
    # -- Disable the default `postgres` superuser in the vendored PostgreSQL chart.
    enablePostgresUser: false
    # -- Database created by the vendored PostgreSQL chart.
    database: filament
    # -- Username created by the vendored PostgreSQL chart.
    username: filament
    # -- Password for the vendored PostgreSQL user. Must match `persistence.postgresql.dsn` when vendored PostgreSQL is enabled.
    # @default -- required when `postgresql.enabled=true`
    password: ""
  primary:
    # -- Resources for the vendored PostgreSQL primary. Overrides the upstream
    # `nano` preset (192Mi memory limit), which risks OOM kills and unclean
    # shutdowns under real load.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
    persistence:
      # -- PVC size for the vendored PostgreSQL primary.
      size: 8Gi
  backup:
    # -- Enable daily logical dumps (`pg_dumpall`) of the vendored PostgreSQL
    # to a dedicated PVC. See `backup.cronjob.*` in the upstream chart for
    # schedule and storage options.
    enabled: false

# Vendored NATS configuration.
nats:
  # -- Enable the vendored NATS chart for local or test clusters. See the [NATS chart](https://artifacthub.io/packages/helm/nats/nats) for additional configuration.
  enabled: false
  # -- Full name override for the vendored NATS release.
  fullnameOverride: filament-nats
  config:
    jetstream:
      # -- Enable JetStream in the vendored NATS chart.
      enabled: true
      fileStore:
        pvc:
          # -- PVC size for the vendored NATS JetStream file store.
          size: 10Gi
  container:
    # -- Merged into the vendored NATS container spec. Sets resources so the
    # pod is not BestEffort QoS (first evicted under node pressure); the
    # upstream chart sets none.
    merge:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
