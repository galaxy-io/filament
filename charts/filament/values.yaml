nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
commonLabels: {}
commonAnnotations: {}

# Bring-your-own Secret holding Persistence, Secrets, and Event Bus configuration
existingSecret: ""

server:
  image:
    repository: galaxy-io/filament-server
    tag: "latest"
    pullPolicy: IfNotPresent
    pullSecrets: []

  replicas: 3

  # Autoscaling takes precedence over replicas
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCpu: 80

  service:
    port: 8080

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

controlPlane:
  enabled: true

  image:
    repository: galaxy-io/filament-control-plane
    tag: "latest"
    pullPolicy: IfNotPresent
    pullSecrets: []

  replicas: 3

  # Autoscaling takes precedence over replicas
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCpu: 80

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Dispatch
  dispatch:
    mode: kubernetes
    worker:
      image:
        repository: galaxy-io/filament-worker
        tag: "latest"
        pullPolicy: IfNotPresent
        # Pull secrets for dispatched worker Jobs
        pullSecrets: []
      serviceAccount: ""
      restartPolicy: Never
      terminationGraceSeconds: 30
      activeDeadlineSeconds: ""
    job:
      namePrefix: filament
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600

persistence:
  type: postgresql
  # Run migrations as a post-install/post-upgrade hook Job after Postgres is up.
  migrate: true

  postgresql:
    enabled: true
    # Must match postgresql.auth below when using the bundled instance
    dsn: "postgresql://filament:super-secret-key@filament-postgresql:5432/filament?sslmode=disable"

    # Not wired yet; dsn is the interface
    host: filament-postgresql
    port: 5432
    database: filament
    username: filament
    password:
      value: super-secret-key
      existingSecret:
        name: ""
        key: ""

    sslMode: disable

  # NOTE: MySQL is not currently supported
  mysql: {}

secrets:
  enabled: true
  type: postgres

  postgres:
    # Stored with each secret row; bump when rotating
    encryptionKeyId: ""
    # base64 AES key (16/24/32 bytes); override in production
    encryptionKey: ZmlsYW1lbnQtZGV2LWVuY3J5cHRpb24ta2V5LTAwMDA=

  # AWS is not currently supported
  aws: {}

  # GCP is not currently supported
  gcp: {}

  # Azure is not currently supported
  azure: {}

  # Vault is not currently supported
  vault: {}

eventBus:
  type: nats

  nats:
    enabled: true
    url: nats://filament-nats:4222
    stream: EVENTBUS
    subjects: "ingestion.v1.>"

  # NOTE: Kafka is not currently supported
  kafka: {}

# NOTE: It is strongly recommended to use an external PostgreSQL instance in production
# Minimal vendored PostgreSQL configuration
# More configuration can be found in the Bitnami PostgreSQL chart: https://artifacthub.io/packages/helm/bitnami/postgresql
postgresql:
  enabled: true
  fullnameOverride: filament-postgresql
  auth:
    enablePostgresUser: false
    database: filament
    username: filament
    password: super-secret-key

# Minimal vendored NATS configuration
# More configuration can be found in the NATS chart: https://artifacthub.io/packages/helm/nats/nats
nats:
  enabled: true
  fullnameOverride: filament-nats
  config:
    jetstream:
      enabled: true
