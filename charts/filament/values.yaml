# Default values for the Filament Helm chart.
#
# This file is intentionally production-safe: connection strings and
# encryption keys must be supplied by the installer or by an existing Secret.

# -- Provide a name in place of `filament`.
nameOverride: ""

# -- String to fully override the generated release name.
fullnameOverride: ""

# -- Override the namespace used in rendered manifests.
namespaceOverride: ""

# -- Labels added to all Filament resources.
commonLabels: {}

# -- Name of an existing Secret containing `PERSISTENCE_DSN`, `NATS_URL`,
# `ENCRYPTION_KEY` when using the PostgreSQL-backed secret provider, and when
# auth is enabled `AUTH_PAT` for Zitadel, or `AUTH_CLIENT_SECRET`,
# `AUTH_ADMIN_PASSWORD`, and `AUTH_BOOTSTRAP_CLIENT_SECRET` for Keycloak.
# When set, the chart does not create its own Secret, `filament-secret`, and
# the vendored Keycloak needs `keycloak.existingSecret` set to the same name.
existingSecret: ""

server:
  # -- Minimum server log level. Valid values: INFO, DEBUG, TRACE.
  logLevel: INFO

  image:
    # -- Server image repository.
    repository: ghcr.io/galaxy-io/filament/server
    # -- Server image tag.
    # @default -- `""` (defaults to chart appVersion)
    tag: ""
    # -- Server image pull policy.
    pullPolicy: IfNotPresent
    # -- Image pull secrets for the server Deployment.
    pullSecrets: []

  serviceAccount:
    # -- Existing ServiceAccount name for the server. When set, the chart does not create one.
    name: ""
    # -- Annotations for the chart-created server ServiceAccount, e.g. an IRSA role ARN.
    annotations: {}

  # -- Number of server replicas. Ignored when `server.autoscaling.enabled` is true.
  replicas: 1

  autoscaling:
    # -- Enable a HorizontalPodAutoscaler for the server.
    enabled: false
    # -- Minimum server replicas when autoscaling is enabled.
    minReplicas: 1
    # -- Maximum server replicas when autoscaling is enabled.
    maxReplicas: 10
    # -- Target average CPU utilization percentage for server autoscaling.
    targetCpu: 80

  service:
    # -- Server service and container port.
    port: 8080

  ingress:
    # -- Enable an Ingress for the server API and UI.
    enabled: false
    # -- IngressClass name, e.g. `nginx` or `alb`. Empty uses the cluster default.
    className: ""
    # -- Annotations for the Ingress, e.g. a cert-manager issuer or ALB settings.
    annotations: {}
    # -- Path served by the Ingress.
    path: /
    # -- PathType for the path.
    pathType: Prefix
    # -- Hostnames served by the Ingress.
    hosts:
      - filament.example.com
    # -- Ingress TLS configuration, passed through verbatim.
    tls: []

  # -- Server resource requests and limits.
  # @default -- `{}` (See [values.yaml])
  resources: {}

controlPlane:
  # -- Deploy the Filament control plane.
  enabled: true

  # -- Minimum control-plane log level. Valid values: INFO, DEBUG, TRACE.
  logLevel: INFO

  image:
    # -- Control plane image repository.
    repository: ghcr.io/galaxy-io/filament/control-plane
    # -- Control plane image tag.
    # @default -- `""` (defaults to chart appVersion)
    tag: ""
    # -- Control plane image pull policy.
    pullPolicy: IfNotPresent
    # -- Image pull secrets for the control plane Deployment.
    pullSecrets: []

  serviceAccount:
    # -- Existing ServiceAccount name for the control plane. When set, the chart does not create one.
    name: ""
    # -- Annotations for the chart-created control plane ServiceAccount, e.g. an IRSA role ARN.
    annotations: {}

  # -- Number of control plane replicas. Ignored when `controlPlane.autoscaling.enabled` is true.
  replicas: 1

  autoscaling:
    # -- Enable a HorizontalPodAutoscaler for the control plane.
    enabled: false
    # -- Minimum control plane replicas when autoscaling is enabled.
    minReplicas: 1
    # -- Maximum control plane replicas when autoscaling is enabled.
    maxReplicas: 10
    # -- Target average CPU utilization percentage for control plane autoscaling.
    targetCpu: 80

  # -- Control plane resource requests and limits.
  # @default -- `{}` (See [values.yaml])
  resources: {}

  health:
    # -- Port the control plane serves `/livez`, `/startupz`, and `/readyz` on,
    # stored in the ConfigMap as `HEALTH_ADDR` and used for the container port
    # and probes.
    port: 8081

  reaper:
    # -- How often the reaper sweeps for zombie runs, in seconds. Empty uses the binary default (60).
    intervalSeconds: ""
    # -- How long a Running run may go without a heartbeat write before the reaper fails it, in seconds. Empty uses the binary default (300).
    staleAfterSeconds: ""

  dispatch:
    # -- Worker dispatch backend.
    mode: kubernetes

    worker:
      # -- Minimum worker log level. Valid values: INFO, DEBUG, TRACE.
      logLevel: INFO

      image:
        # -- Worker image repository used for dispatched Jobs.
        repository: ghcr.io/galaxy-io/filament/worker
        # -- Worker image tag.
        # @default -- `""` (defaults to chart appVersion)
        tag: ""
        # -- Worker image pull policy.
        pullPolicy: IfNotPresent
        # -- Image pull secrets for dispatched worker Jobs.
        pullSecrets: []
      serviceAccount:
        # -- Existing ServiceAccount name for dispatched worker Jobs. When set, the chart does not create one.
        name: ""
        # -- Annotations for the chart-created worker ServiceAccount, e.g. an IRSA role ARN.
        annotations: {}
      # -- Restart policy for dispatched worker Jobs.
      restartPolicy: Never
      # -- Worker Job termination grace period in seconds.
      terminationGraceSeconds: 30
      # -- Worker Job active deadline in seconds. Leave empty for no deadline.
      activeDeadlineSeconds: ""
      # -- Interval in seconds between worker heartbeats, stored in the worker
      # ConfigMap as `HEARTBEAT_SECONDS`. Empty uses the worker's own default.
      heartbeatSeconds: 30

    job:
      # -- Prefix used when naming dispatched worker Jobs.
      namePrefix: filament
      # -- Kubernetes Job backoff limit for dispatched workers.
      backoffLimit: 1
      # -- Seconds to retain completed dispatched worker Jobs.
      ttlSecondsAfterFinished: 3600

metrics:
  # -- Metrics backend for the dashboard query API. `datastore` answers from
  # the persistence store and emits no `METRICSSTORE_PROVIDER`; any other value
  # is stored in the server ConfigMap as `METRICSSTORE_PROVIDER`.
  type: datastore

persistence:
  # -- Persistence provider.
  type: postgres

  # -- Run database migrations as a post-install/post-upgrade hook Job.
  migrate: true

  postgresql:
    # -- PostgreSQL connection string stored in the chart-created Secret as `PERSISTENCE_DSN`.
    # Required unless `existingSecret` is set.
    # @default -- required
    dsn: ""

  # @ignore
  mysql: {}

secrets:
  # -- Secret storage provider. `datastore` keeps secrets in the persistence
  # store and emits no `SECRET_PROVIDER`; external provider names are stored in
  # the ConfigMap as `SECRET_PROVIDER`.
  type: datastore

  # -- Extra name prefix external secret stores apply to every secret reference,
  # stored in the ConfigMap as `SECRETS_PREFIX`. Filament-minted references are
  # already namespaced under `filament/`. Unused by datastore.
  prefix: ""

  datastore:
    # -- Encryption key identifier stored with each secret row. Change this when rotating keys.
    encryptionKeyId: ""
    # -- Base64-encoded AES key stored in the chart-created Secret as `ENCRYPTION_KEY`.
    # Required unless `existingSecret` is set.
    # @default -- required
    encryptionKey: ""

  aws:
    # -- AWS region for Secrets Manager, stored in the ConfigMap as `AWS_REGION`.
    # Leave empty to use the SDK default chain (env, IMDS).
    region: ""

  gcp:
    # -- GCP project containing Secret Manager secrets, stored as `GCP_PROJECT_ID`.
    # Required when `secrets.type` is `gcp-secret-manager`.
    projectId: ""
    # -- GCP region containing Secret Manager secrets, stored as `GCP_REGION`.
    # Required when `secrets.type` is `gcp-secret-manager`.
    region: ""

  # @ignore
  azure: {}

  # @ignore
  vault: {}

eventBus:
  # -- Event bus provider.
  type: nats

  nats:
    # -- NATS connection URL stored in the chart-created Secret as `NATS_URL`.
    # Required unless `existingSecret` is set.
    # @default -- required
    url: ""
    # -- NATS stream used by Filament.
    stream: EVENTBUS
    # -- NATS subject filter consumed by Filament.
    subjects: "ingestion.v1.>"
    # -- Maximum age of messages retained in the NATS stream, in seconds. Set to 0 to disable age-based expiration.
    ttlSeconds: 604800

  # @ignore
  kafka: {}

auth:
  # -- Enable authentication. Disabled leaves the API unauthenticated and every
  # request scoped to the default tenant.
  enabled: false

  # -- Identity provider. Valid values are `zitadel` and `keycloak`.
  type: zitadel

  # -- Origin the UI is served from, stored in the ConfigMap as
  # `AUTH_UI_ORIGIN`; normally the ingress host. An https origin marks the
  # session cookie Secure.
  uiOrigin: ""

  zitadel:
    # -- Issuer URL Filament reaches the provider at, stored in the ConfigMap
    # as `AUTH_ISSUER`. Only the server talks to Zitadel, so an in-cluster name
    # is fine, but it must equal the issuer Zitadel advertises or discovery
    # fails.
    # @default -- required when `auth.enabled=true`
    issuer: ""
    # -- Machine-user personal access token, stored in the chart-created Secret
    # as `AUTH_PAT`. Zitadel generates the token itself and will not accept one
    # you choose, so create the machine user out of band and paste the result
    # here. Ignored when `zitadel.enabled=true`: the vendored setup job mints a
    # token into its own Secret and the server reads it from there.
    # @default -- required when `auth.enabled=true` and `zitadel.enabled=false`
    pat: ""

  keycloak:
    # -- Realm URL Filament reaches Keycloak at, stored in the ConfigMap as
    # `AUTH_ISSUER`, in the form `https://<host>/realms/<realm>`. It must equal
    # the issuer the realm advertises or discovery fails. Keycloak 26 or newer.
    # Derived from `keycloak.hostname` when `keycloak.enabled=true`.
    # @default -- required when `auth.type=keycloak` and `keycloak.enabled=false`
    issuer: ""
    # -- Filament's confidential client in the realm, stored in the ConfigMap
    # as `AUTH_CLIENT_ID`. Filament converges the realm on boot; with admin
    # credentials it creates the realm and this client too.
    clientId: filament
    # -- The client's secret, stored in the chart-created Secret as
    # `AUTH_CLIENT_SECRET`. Generated once and kept across upgrades when
    # `keycloak.enabled=true`.
    # @default -- required when `auth.type=keycloak` and `keycloak.enabled=false`
    clientSecret: ""
    # -- Keycloak admin on the master realm, stored in the ConfigMap as
    # `AUTH_ADMIN_USERNAME`. With `adminPassword` the server creates the realm
    # and client on boot; empty against a realm its owners provision. The
    # vendored Keycloak supplies its own.
    adminUser: ""
    # -- That admin's password, stored in the chart-created Secret as
    # `AUTH_ADMIN_PASSWORD`. Generated once when `keycloak.enabled=true`.
    adminPassword: ""
    bootstrap:
      # -- Tenant Filament converges on every boot, stored in the ConfigMap as
      # `AUTH_BOOTSTRAP_TENANT`. With `clientId` and `clientSecret` it gives an
      # SDK an admin service account before any person has registered. Leave
      # all three empty to skip.
      tenant: ""
      # -- Client id of that tenant's admin service account, stored in the
      # ConfigMap as `AUTH_BOOTSTRAP_CLIENT_ID`.
      clientId: ""
      # -- Secret the service account authenticates with, chosen by you and
      # stored in the chart-created Secret as `AUTH_BOOTSTRAP_CLIENT_SECRET`.
      clientSecret: ""

observability:
  otel:
    # -- OTLP endpoint metrics and traces are exported to, stored in the
    # ConfigMaps as `OTEL_EXPORTER_OTLP_ENDPOINT`. Use an `http://` scheme for
    # plaintext in-cluster collectors. Empty disables export.
    endpoint: ""

    # -- OTLP transport, stored in the ConfigMaps as `OTEL_EXPORTER_OTLP_PROTOCOL`.
    # Valid values are `grpc` (collector port 4317) and `http/protobuf` (port 4318).
    # Empty defaults to `grpc`.
    protocol: ""

# Vendored Bitnami PostgreSQL configuration.
# It is strongly recommended to use an external PostgreSQL instance in production.
postgresql:
  # -- Enable the vendored Bitnami PostgreSQL chart for local or test clusters. See the [Bitnami PostgreSQL chart](https://artifacthub.io/packages/helm/bitnami/postgresql) for additional configuration.
  enabled: false
  # -- Full name override for the vendored PostgreSQL release.
  fullnameOverride: filament-postgresql
  auth:
    # -- Disable the default `postgres` superuser in the vendored PostgreSQL chart.
    enablePostgresUser: false
    # -- Database created by the vendored PostgreSQL chart.
    database: filament
    # -- Username created by the vendored PostgreSQL chart.
    username: filament
    # -- Password for the vendored PostgreSQL user. Must match `persistence.postgresql.dsn` when vendored PostgreSQL is enabled.
    # @default -- required when `postgresql.enabled=true`
    password: ""
  primary:
    # -- Resources for the vendored PostgreSQL primary. Overrides the upstream
    # `nano` preset (192Mi memory limit), which risks OOM kills and unclean
    # shutdowns under real load.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
    persistence:
      # -- PVC size for the vendored PostgreSQL primary.
      size: 8Gi
    # Protect cold starts and crash recovery from liveness restarts for up to
    # five minutes. Readiness still removes an unhealthy primary promptly.
    startupProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
      successThreshold: 1
    readinessProbe:
      failureThreshold: 2
    initdb:
      # -- SQL run once, when the volume is first initialized. Creates the
      # database the vendored Keycloak owns; Keycloak cannot create its own.
      scripts:
        keycloak.sql: |
          CREATE DATABASE keycloak OWNER filament;
  backup:
    # -- Enable daily logical dumps (`pg_dumpall`) of the vendored PostgreSQL
    # to a dedicated PVC. See `backup.cronjob.*` in the upstream chart for
    # schedule and storage options.
    enabled: false

# Vendored NATS configuration.
nats:
  # -- Enable the vendored NATS chart for local or test clusters. See the [NATS chart](https://artifacthub.io/packages/helm/nats/nats) for additional configuration.
  enabled: false
  # -- Full name override for the vendored NATS release.
  fullnameOverride: filament-nats
  config:
    jetstream:
      # -- Enable JetStream in the vendored NATS chart.
      enabled: true
      fileStore:
        pvc:
          # -- PVC size for the vendored NATS JetStream file store.
          size: 10Gi
  container:
    # -- Merged into the vendored NATS container spec. Sets resources so the
    # pod is not BestEffort QoS (first evicted under node pressure); the
    # upstream chart sets none.
    merge:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

# Vendored Zitadel configuration.
# Running the identity provider inside this release ties its lifecycle to
# Filament's: uninstalling the release takes the provider with it, and every
# upgrade re-runs its init and setup hooks. Prefer an external instance
# wherever that coupling matters.
zitadel:
  # -- Enable the vendored Zitadel chart for local or test clusters. See the [Zitadel chart](https://artifacthub.io/packages/helm/zitadel/zitadel) for additional configuration.
  enabled: false
  # -- Full name override for the vendored Zitadel release.
  fullnameOverride: filament-zitadel
  login:
    # -- Deploy Zitadel's own login UI. Filament serves its own sign-in pages and
    # points the OIDC client at them, so the upstream login Deployment, Service,
    # ConfigMap, ServiceAccount, and generated keypair are unused.
    enabled: false
  zitadel:
    # -- 32-character key Zitadel encrypts its stored credentials with.
    # @default -- required when `zitadel.enabled=true`
    masterkey: ""
    configmapConfig:
      # -- Serve external traffic over HTTPS. Zitadel builds its OIDC issuer from
      # `ExternalSecure`, `ExternalDomain`, and `ExternalPort`, and that issuer must
      # match `auth.zitadel.issuer` exactly.
      ExternalSecure: true
      # -- Hostname Zitadel advertises itself at.
      # @default -- required when `zitadel.enabled=true`
      ExternalDomain: ""
      Database:
        Postgres:
          # -- PostgreSQL server Zitadel connects to, e.g. the vendored
          # `filament-postgresql` Service. The init job also needs
          # `Admin.Username` and `Admin.Password` for a role that can create
          # databases, and the runtime needs `User.Password`.
          # @default -- required when `zitadel.enabled=true`
          Host: ""
          # -- Database Zitadel creates and owns. Keep it separate from
          # Filament's own database even when they share a server.
          Database: zitadel
          User:
            Username: zitadel
            SSL:
              Mode: disable
          Admin:
            SSL:
              Mode: disable
  # Zitadel runs init then setup as pre-install hooks, which Helm executes
  # before it creates any regular resources, so against the vendored
  # PostgreSQL both poll a database that does not exist yet until the install
  # fails. Post-install keeps the weighted ordering and the recreate-on-upgrade
  # policy while letting PostgreSQL come up first. The rest converges on pod
  # restarts, which `--wait` cannot see past: it holds the post-install hooks
  # until every pod is ready, and the server only becomes ready after these
  # hooks mint its token, so do not install with `--wait`. Trade-off of leaving
  # pre-upgrade: a Zitadel version bump rolls the new pod before its setup has
  # run, and it restarts until setup finishes.
  initJob:
    # -- Hook timing for the Zitadel init job, moved to post-install so the
    # vendored PostgreSQL exists before the job polls it.
    annotations:
      helm.sh/hook: post-install,post-upgrade
      helm.sh/hook-delete-policy: before-hook-creation
      helm.sh/hook-weight: "1"
  setupJob:
    # -- Hook timing for the Zitadel setup job, weighted to run after init.
    annotations:
      helm.sh/hook: post-install,post-upgrade
      helm.sh/hook-delete-policy: before-hook-creation
      helm.sh/hook-weight: "2"
  resources:
    # -- Resources for the vendored Zitadel pod. The upstream chart sets none,
    # which leaves it BestEffort QoS and first to be evicted.
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

# Vendored Keycloak configuration.
# The same lifecycle coupling as Zitadel applies: uninstalling the release
# takes every user and tenant with it. Keycloak shares the vendored PostgreSQL
# server in its own `keycloak` database, and the server creates Filament's
# realm on boot with the admin credentials below.
keycloak:
  # -- Enable the vendored Keycloak chart. See the [keycloakx chart](https://artifacthub.io/packages/helm/codecentric/keycloakx) for additional configuration.
  enabled: false
  # -- Full name override for the vendored Keycloak release.
  fullnameOverride: filament-keycloak
  # -- URL Keycloak advertises itself at and the ingress serves, e.g.
  # `https://id.example.com`. Its origin forms the issuer Filament and every
  # token client use, so it must resolve from inside the cluster as well as
  # outside. An `http://` URL is for plain-http test clusters.
  # @default -- required when `keycloak.enabled=true`
  hostname: ""
  # -- Admin of the master realm. The server creates Filament's realm with it;
  # the password is the Filament Secret's `AUTH_ADMIN_PASSWORD`.
  adminUser: admin
  # -- Secret holding `AUTH_ADMIN_PASSWORD`: the chart-created one by default,
  # or the top-level `existingSecret` when using one.
  existingSecret: filament-secret
  command:
    - /opt/keycloak/bin/kc.sh
    - start
  http:
    relativePath: /
  proxy:
    enabled: true
    # -- Proxy header scheme the ingress forwards.
    mode: xforwarded
    http:
      enabled: true
  database:
    vendor: postgres
    # -- The vendored PostgreSQL Service.
    hostname: filament-postgresql
    port: 5432
    # -- Database Keycloak owns, created by `postgresql.primary.initdb.scripts`.
    database: keycloak
    username: filament
    # -- Secret the vendored PostgreSQL chart stores its user password in.
    existingSecret: filament-postgresql
    existingSecretKey: password
  dbchecker:
    # -- Wait for PostgreSQL before starting.
    enabled: true
  extraEnv: |
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      value: {{ .Values.adminUser | quote }}
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: {{ .Values.existingSecret }}
          key: AUTH_ADMIN_PASSWORD
    - name: KC_HOSTNAME
      value: {{ .Values.hostname | quote }}
  ingress:
    # -- Expose Keycloak through an ingress at `hostname`. Token clients such
    # as the CLI and SDKs reach the issuer through it.
    enabled: true
    rules:
      - host: "{{ .Values.hostname | trimPrefix \"https://\" | trimPrefix \"http://\" }}"
        paths:
          - path: /
            pathType: Prefix
    # -- TLS for the ingress, e.g. a cert-manager Secret for `hostname`.
    tls: []
  resources:
    # -- Resources for the vendored Keycloak pod. The upstream chart sets none.
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
