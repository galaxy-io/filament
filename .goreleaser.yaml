version: 2

project_name: filament

builds:
  - dir: cmd
    main: ./filament
    binary: filament
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    tags:
      - embedui
    ldflags:
      - -s -w
      - -X github.com/galaxy-io/filament/cmd/internal/version.Version={{ .Version }}
      - -X github.com/galaxy-io/filament/cmd/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/galaxy-io/filament/cmd/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  mode: keep-existing
  prerelease: auto

homebrew_casks:
  - name: filament
    ids:
      - default
    repository:
      owner: galaxy-io
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    commit_author:
      name: gx-null[bot]
      email: 286761379+gx-null[bot]@users.noreply.github.com
    homepage: "https://github.com/galaxy-io/filament"
    description: "Pluggable data replication with checkpointing, batching, and integrity events"
    binaries:
      - filament
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/filament"]
          end
